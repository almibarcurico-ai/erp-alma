// ─── COBRANZA ─────────────────────────────────────────────────────────────────
function CobranzaView() {
  const { st, hoy, uf, abrirFicha, user } = useApp();
  const [filtro, setFiltro] = useState("");
  const [modal, setModal] = useState(null);
  const filas = listarUnidades(st).filter(x => x.u.contrato).map(x => ({ ...x, r: calcUnidad(x.u, hoy, uf) }))
    .filter(x => !filtro || x.r.estado === filtro)
    .sort((a, b) => EST[a.r.estado].ord - EST[b.r.estado].ord || (a.u.contrato.diaPago - b.u.contrato.diaPago));
  const cuenta = {};
  listarUnidades(st).filter(x => x.u.contrato).forEach(x => { const e = calcUnidad(x.u, hoy, uf).estado; cuenta[e] = (cuenta[e] || 0) + 1; });
  return (
    <div className="grid fade-up" style={{ gap: 14 }}>
      <div className="row between">
        <div><div className="h1">Cobranza · {MESES[hoy.getMonth()]} {hoy.getFullYear()}</div><div className="muted">UF hoy {fmtCLP(uf)} · las multas se calculan automáticamente solo donde el dueño las activó</div></div>
      </div>
      <div className="row">
        <button className={"btn btn-sm " + (!filtro ? "btn-primary" : "btn-ghost")} onClick={() => setFiltro("")}>Todos ({Object.values(cuenta).reduce((a, b) => a + b, 0)})</button>
        {["atrasado", "hoy", "proximo", "pendiente", "pagado"].map(k => (
          <button key={k} className={"btn btn-sm " + (filtro === k ? "btn-primary" : "btn-ghost")} onClick={() => setFiltro(k)}><span className="dot" style={{ background: EST[k].color }} />{EST[k].label} ({cuenta[k] || 0})</button>
        ))}
      </div>
      {!filas.length ? <div className="card empty">Nada que mostrar.</div> : (
        <div className="table-wrap"><table>
          <thead><tr><th>Unidad</th><th>Arrendatario</th><th>Vence</th><th>Estado</th><th className="num">Renta</th><th className="num">Multa</th><th className="num">Deuda</th><th></th></tr></thead>
          <tbody>{filas.map(({ p, u, r }) => {
            const c = u.contrato;
            return (
              <tr key={u.id} className="click" onClick={() => abrirFicha(p.id, u.id)}>
                <td style={{ fontWeight: 600 }}>{nombreUnidad(p, u)}</td>
                <td>{c.arrendatario.nombre}</td>
                <td>{r.deudas.length ? fmtFecha(r.deudas[0].venc) : r.proxVenc ? fmtFecha(r.proxVenc) : "—"}</td>
                <td><Badge estado={r.estado}>{r.estado === "atrasado" ? `Atrasado ${r.deudas[0].dias}d` : null}</Badge></td>
                <td className="num">{fmtMonto(c.valor, c.moneda)}</td>
                <td className="num">{c.multa?.cobrar ? (r.multa ? fmtMonto(r.multa, c.moneda) : "$0") : <span className="muted">no cobra</span>}</td>
                <td className="num" style={{ color: r.deudaCLP ? "#DC2626" : null, fontWeight: r.deudaCLP ? 700 : 400 }}>{r.deudaCLP ? fmtCLP(r.deudaCLP) : "—"}</td>
                <td onClick={e => e.stopPropagation()}>
                  <div className="row" style={{ flexWrap: "nowrap" }}>
                    {puede(user, "pagos") && r.estado !== "pagado" && <button className="btn btn-primary btn-sm" onClick={() => setModal({ t: "pago", p, u })}>Pagó</button>}
                    <button className="btn btn-ghost btn-sm" onClick={() => setModal({ t: "com", p, u })}>Avisar</button>
                  </div>
                </td>
              </tr>);
          })}</tbody></table></div>
      )}
      {modal && modal.t === "pago" && <PagoModal p={modal.p} u={modal.u} onClose={() => setModal(null)} />}
      {modal && modal.t === "com" && <ComunicarModal p={modal.p} u={modal.u} onClose={() => setModal(null)} />}
    </div>
  );
}


// ─── DISPONIBLES ──────────────────────────────────────────────────────────────

      {!libres.length ? <div className="card empty">🎉 Todas las unidades están arrendadas.</div> : (
        <div className="grid" style={{ gridTemplateColumns: "repeat(auto-fill,minmax(260px,1fr))" }}>
          {libres.map(({ p, u }) => (
            <div key={u.id} className="card" style={{ padding: 0, overflow: "hidden" }}>

              <div style={{ padding: 14 }}>
                <div style={{ fontWeight: 700 }}>{nombreUnidad(p, u)}</div>
                <div className="muted">{p.direccion}, {p.comuna}</div>
                <div className="row" style={{ marginTop: 8, fontSize: 12, color: C.textDim }}>
                  <span>{CATEGORIAS[u.categoria]}</span>{u.m2 ? <span>· {u.m2} m²</span> : null}{u.dormitorios ? <span>· {u.dormitorios} dorm.</span> : null}{u.banos ? <span>· {u.banos} baños</span> : null}
                </div>
                <div style={{ fontWeight: 700, fontSize: 16, marginTop: 8, color: EST.libre.color }}>{u.precioUF ? `${fmtUF(u.precioUF)}` : "Precio por definir"}{u.precioUF ? <span className="muted" style={{ fontWeight: 400 }}> ≈ {fmtCLP(u.precioUF * uf)}</span> : null}</div>
                <div className="row" style={{ marginTop: 12 }}>
                  <button className="btn btn-primary btn-sm" onClick={() => setCompartir({ p, u })}>📤 Enviar a interesado</button>
                  <button className="btn btn-ghost btn-sm" onClick={() => abrirFicha(p.id, u.id)}>Ver ficha</button>
                </div>
              </div>
            </div>
          ))}
        </div>
      )}
      {st.interesados.length > 0 && (
        <div className="card">
          <div className="h2">Últimos interesados</div>
          <div className="table-wrap"><table>
            <thead><tr><th>Fecha</th><th>Interesado</th><th>Contacto</th><th>Propiedad</th><th>Vía</th></tr></thead>
            <tbody>{st.interesados.slice(0, 15).map(x => {
              const p = st.propiedades.find(y => y.id === x.propId); const u = p?.unidades.find(y => y.id === x.unidadId);
              return <tr key={x.id}><td>{fmtFecha(x.fecha)}</td><td>{x.nombre || "—"}{x.nota ? <div className="muted">{x.nota}</div> : null}</td><td>{x.telefono} {x.email}</td><td>{p && u ? nombreUnidad(p, u) : "—"}</td><td>{x.canal}</td></tr>;
            })}</tbody></table></div>
        </div>
      )}
      {compartir && <CompartirModal p={compartir.p} u={compartir.u} onClose={() => setCompartir(null)} />}
    </div>
  );
}

function ConfigView() {
  const { st, update, user, toast, recargarUF, recargar } = useApp();
  const [emp, setEmp] = useState(st.empresa);
  const [inv, setInv] = useState({ nombre: "", email: "", rol: "secretaria" });
  const [clave, setClave] = useState("");
  const [haylocal, setHayLocal] = useState(false);
  const archivo = useRef(null);
  const E = st.empresa.id;
  const sus = st.suscripcion;

  useEffect(() => { leerDatosDelNavegador().then(d => setHayLocal(!!(d && d.propiedades && d.propiedades.length))); }, []);

  const accion = async (fn, ok, registro) => {
    try {
      await fn();
      if (registro) await q(sb.from("bitacora").insert({ empresa_id: E, user_id: user.id, usuario: user.nombre, accion: registro }));
      toast(ok); recargar();
    } catch (e) { toast(mensajeError(e)); }
  };
  const invitar = () => {
    const email = inv.email.trim().toLowerCase();
    if (!inv.nombre.trim() || !/^\S+@\S+\.\S+$/.test(email)) return toast("Ingresa nombre y un correo válido");
    accion(() => q(sb.from("invitaciones").insert({ empresa_id: E, email, nombre: inv.nombre.trim(), rol: inv.rol })),
      "Invitación creada", `Invitó a ${inv.nombre.trim()} (${email}) como ${inv.rol}`);
    setInv({ nombre: "", email: "", rol: "secretaria" });
  };
  const mensajeInvitacion = i => `Hola ${i.nombre}, te invité a ${st.empresa.nombre} en Alma Arriendos. Crea tu cuenta con este correo (${i.email}) en: ${urlRetorno()}`;
  const cambiarClave = () => {
    if (clave.length < 8) return toast("La clave debe tener al menos 8 caracteres");
    accion(() => q(sb.auth.updateUser({ password: clave })), "Clave actualizada");
    setClave("");
  };
  const importar = (d, origen) => {
    const r = conIdsNuevos(d);
    if (!r.propiedades.length) return toast("No hay propiedades para importar");
    if (!confirm(`Se agregarán ${r.propiedades.length} propiedades ${origen}. ¿Continuar?`)) return;
    update(s => { s.propiedades.push(...r.propiedades); s.documentos.unshift(...r.documentos); s.interesados.unshift(...r.interesados); }, `Importó ${r.propiedades.length} propiedades ${origen}`);
    toast("Importando…");
  };
  const exportar = () => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(st)], { type: "application/json" }));
    a.download = `respaldo-arriendos-${toISO(new Date())}.json`; a.click();
  };
  const leerArchivo = e => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => { try { const d = JSON.parse(r.result); if (!d.propiedades) throw new Error(); importar(d, "desde el respaldo"); } catch { toast("Archivo de respaldo inválido"); } };
    r.readAsText(f); e.target.value = "";
  };

  return (
    <div className="grid fade-up" style={{ gap: 16 }}>
      <div className="h1">Configuración</div>

      {sus && (
        <div className="card">
          <div className="h2">Suscripción</div>
          <dl className="kv">
            <dt>Plan</dt><dd>{sus.plan}{sus.maxUnidades ? ` (hasta ${sus.maxUnidades} unidades)` : ""}</dd>
            <dt>Estado</dt><dd>{{ prueba: "Prueba", activa: "Activa", morosa: "Morosa", suspendida: "Suspendida", cancelada: "Cancelada" }[sus.estado] || sus.estado}{sus.estado === "prueba" && sus.pruebaHasta ? ` hasta el ${fmtFecha(sus.pruebaHasta)}` : ""}</dd>
            <dt>Unidades en uso</dt><dd>{listarUnidades(st).length}</dd>
          </dl>
          <div className="muted" style={{ marginTop: 8 }}>Para cambiar de plan o pagar la suscripción, contacta a HM Software.</div>
        </div>
      )}

      <div className="card">
        <div className="h2">Datos de la empresa (arrendador por defecto)</div>
        <div className="form-grid">
          {[["nombre", "Razón social"], ["rut", "RUT"], ["direccion", "Domicilio"], ["email", "Correo"], ["telefono", "Teléfono / WhatsApp"], ["representante", "Representante legal"], ["rutRep", "RUT representante"]].map(([k, l]) =>
            <Campo key={k} label={l}><input className="input" value={emp[k] || ""} onChange={e => setEmp({ ...emp, [k]: e.target.value })} /></Campo>)}
        </div>
        <button className="btn btn-primary" style={{ marginTop: 12 }} onClick={() => { if (!emp.nombre.trim()) return toast("Falta la razón social"); update(s => { s.empresa = { ...emp }; }, "Actualizó los datos de la empresa"); toast("Guardado"); }}>Guardar</button>
      </div>

      <div className="card">
        <div className="h2">Valor UF</div>
        <div className="row">
          <div style={{ width: 160 }}><input className="input" type="number" step="0.01" value={st.uf.valor} onChange={e => update(s => { s.uf = { valor: Number(e.target.value) || 0, fecha: toISO(new Date()), auto: false }; })} /></div>
          <span className="muted">Actualizada: {fmtFecha(st.uf.fecha || null)} {st.uf.auto ? "(automática, mindicador.cl)" : "(manual, solo en este equipo)"}</span>
          <button className="btn btn-ghost btn-sm" onClick={recargarUF}>Actualizar desde internet</button>
        </div>
      </div>

      <div className="card">
        <div className="h2">Usuarios</div>
        <div className="muted" style={{ marginBottom: 10 }}>La <b>secretaria</b> puede agregar y editar propiedades, registrar pagos, enviar avisos y generar contratos. Solo el <b>dueño</b> ve los ingresos, decide las multas (activar/condonar), elimina datos y administra usuarios. Todo queda en la bitácora.</div>
        <div className="table-wrap"><table>
          <thead><tr><th>Nombre</th><th>Rol</th><th>Estado</th><th></th></tr></thead>
          <tbody>
            {st.usuarios.map(u => (
              <tr key={u.id}><td>{u.nombre}{u.id === user.id ? " (tú)" : ""}</td><td>{u.rol === "dueno" ? "Dueño" : "Secretaria"}</td>
                <td>{u.activo === false ? <span className="tag" style={{ background: C.dangerBg, color: C.danger }}>Desactivado</span> : <span className="tag" style={{ background: C.successBg, color: C.success }}>Activo</span>}</td>
                <td>{u.id !== user.id && <button className="btn btn-ghost btn-sm" onClick={() => accion(() => q(sb.from("miembros").update({ activo: u.activo === false }).eq("empresa_id", E).eq("user_id", u.id)), "Listo", `${u.activo === false ? "Activó" : "Desactivó"} a ${u.nombre}`)}>{u.activo === false ? "Activar" : "Desactivar"}</button>}</td>
              </tr>))}
            {st.invitaciones.map(i => (
              <tr key={i.email}><td>{i.nombre}<div className="muted">{i.email}</div></td><td>{i.rol === "dueno" ? "Dueño" : "Secretaria"}</td>
                <td><span className="tag" style={{ background: C.warningBg, color: C.warning }}>Invitación pendiente</span></td>
                <td><div className="row" style={{ flexWrap: "nowrap" }}>
                  <a className="btn btn-mail btn-sm" href={linkMail(i.email, `Invitación a ${st.empresa.nombre}`, mensajeInvitacion(i))}>Enviar</a>
                  <button className="btn btn-ghost btn-sm" onClick={() => accion(() => q(sb.from("invitaciones").delete().eq("empresa_id", E).eq("email", i.email)), "Invitación anulada", `Anuló la invitación de ${i.email}`)}>Anular</button>
                </div></td>
              </tr>))}
          </tbody></table></div>
        <div className="label" style={{ marginTop: 16 }}>Invitar usuario</div>
        <div className="form-grid">
          <Campo label="Nombre"><input className="input" value={inv.nombre} onChange={e => setInv({ ...inv, nombre: e.target.value })} /></Campo>
          <Campo label="Correo"><input className="input" type="email" value={inv.email} onChange={e => setInv({ ...inv, email: e.target.value })} /></Campo>
          <Campo label="Rol"><select className="select" value={inv.rol} onChange={e => setInv({ ...inv, rol: e.target.value })}><option value="secretaria">Secretaria</option><option value="dueno">Dueño</option></select></Campo>
        </div>
        <button className="btn btn-primary" style={{ marginTop: 12 }} onClick={invitar}>Invitar</button>
        <div className="muted" style={{ marginTop: 8 }}>La persona se registra en esta misma página con ese correo y queda dentro de tu empresa.</div>
        <div className="label" style={{ marginTop: 16 }}>Cambiar mi clave</div>
        <div className="row">
          <div style={{ width: 220 }}><input className="input" type="password" value={clave} onChange={e => setClave(e.target.value)} autoComplete="new-password" placeholder="Clave nueva" /></div>
          <button className="btn btn-ghost" onClick={cambiarClave}>Guardar clave</button>
        </div>
      </div>

      <div className="card">
        <div className="h2">Importar y respaldar</div>
        <div className="muted" style={{ marginBottom: 10 }}>Los datos se guardan en la nube y se ven desde cualquier equipo. Puedes descargar un respaldo cuando quieras.</div>
        <div className="row">
          <button className="btn btn-ghost" onClick={exportar}>⬇️ Descargar respaldo</button>
          <button className="btn btn-ghost" onClick={() => archivo.current.click()}>⬆️ Importar respaldo</button>
          <input ref={archivo} type="file" accept="application/json" hidden onChange={leerArchivo} />
          {haylocal && <button className="btn btn-primary" onClick={() => leerDatosDelNavegador().then(d => d && importar(d, "guardadas en este navegador"))}>Importar datos de la versión anterior</button>}
          {!st.propiedades.length && <button className="btn btn-ghost" onClick={() => importar({ propiedades: datosEjemplo(sinHora(new Date())) }, "de ejemplo")}>Cargar datos de ejemplo</button>}
        </div>
      </div>
    </div>
  );
}

const VISTAS = [
  { id: "panel", label: "Panel", icono: "📊", grupo: "General" },
  { id: "mapa", label: "Mapa", icono: "🗺️", grupo: "General" },
  { id: "propiedades", label: "Propiedades", icono: "🏢", grupo: "Gestión" },
  { id: "cobranza", label: "Cobranza", icono: "💵", grupo: "Gestión" },
  { id: "disponibles", label: "Desocupadas", icono: "🏷️", grupo: "Gestión" },
  { id: "contratos", label: "Contratos y anexos", icono: "📄", grupo: "Gestión" },
  { id: "bitacora", label: "Bitácora", icono: "🧾", grupo: "Administración", soloDueno: true },
  { id: "config", label: "Configuración", icono: "⚙️", grupo: "Administración", soloDueno: true },
];
const TABLAS_EN_VIVO = ["propiedades", "unidades", "contratos", "pagos", "documentos", "interesados", "miembros"];

function Cargando({ texto = "Cargando…", error, onReintentar }) {
  return (
    <PantallaCentrada>
      {error ? <>
        <div style={{ color: "#B91C1C", margin: "12px 0" }}>{error}</div>
        <div className="row"><button className="btn btn-primary" onClick={onReintentar}>Reintentar</button><button className="btn btn-ghost" onClick={() => sb.auth.signOut()}>Cerrar sesión</button></div>
      </> : <div className="muted" style={{ marginTop: 8 }}>{texto}</div>}
    </PantallaCentrada>
  );
}

function App() {
  const [sesionSb, setSesionSb] = useState(undefined); // undefined: verificando · null: sin sesión
  const [recuperando, setRecuperando] = useState(false);
  const [empresas, setEmpresas] = useState(null);
  const [esAdmin, setEsAdmin] = useState(false);
  const [empresaId, setEmpresaId] = useState(null);
  const [st, setSt] = useState(null);
  const [error, setError] = useState("");
  const [intento, setIntento] = useState(0);
  const [vista, setVista] = useState("panel");
  const [ficha, setFicha] = useState(null);
  const [toastMsg, setToastMsg] = useState("");
  const [hoy, setHoy] = useState(() => sinHora(new Date()));
  const [menu, setMenu] = useState(false);
  const [guardando, setGuardando] = useState(0);
  const stRef = useRef(null); stRef.current = st;
  const cola = useRef(Promise.resolve());
  const pendientes = useRef(0);
  const temporizador = useRef(null);

  const toast = useCallback(m => { setToastMsg(m); clearTimeout(window.__tt); window.__tt = setTimeout(() => setToastMsg(""), 3800); }, []);

  useEffect(() => {
    sb.auth.getSession().then(({ data }) => setSesionSb(data.session));
    const { data } = sb.auth.onAuthStateChange((evento, s) => { setSesionSb(s); if (evento === "PASSWORD_RECOVERY") setRecuperando(true); });
    const t = setInterval(() => { const d = sinHora(new Date()); setHoy(h => h.getTime() === d.getTime() ? h : d); }, 60000);
    return () => { data.subscription.unsubscribe(); clearInterval(t); };
  }, []);

  const uidSesion = sesionSb ? sesionSb.user.id : null;

  // Al iniciar sesión: aceptar invitaciones pendientes y listar las empresas del usuario
  const cargarEmpresas = useCallback(async () => {
    setError("");
    await q(sb.rpc("aceptar_invitaciones"));
    const [ms, adm] = await Promise.all([
      q(sb.from("miembros").select("empresa_id, rol, activo, empresas(nombre)").eq("user_id", uidSesion)),
      q(sb.from("admins_plataforma").select("rol").eq("user_id", uidSesion).maybeSingle()),
    ]);
    const activas = ms.filter(m => m.activo);
    setEsAdmin(!!adm); setEmpresas(activas);
    const guardada = local.get("alma-empresa");
    const elegida = activas.find(m => m.empresa_id === guardada) || (activas.length === 1 ? activas[0] : null);
    setEmpresaId(elegida ? elegida.empresa_id : null);
  }, [uidSesion]);

  useEffect(() => {
    setEmpresas(null); setEmpresaId(null); setSt(null);
    if (uidSesion) cargarEmpresas().catch(e => setError(mensajeError(e)));
  }, [uidSesion, intento]);

  const recargar = useCallback(async () => {
    if (!empresaId) return;
    try { const n = await cargarEmpresa(empresaId); stRef.current = n; setSt(n); setError(""); }
    catch (e) { if (!stRef.current) setError(mensajeError(e)); else toast(mensajeError(e)); }
  }, [empresaId, toast]);

  // Recarga cuando otro usuario cambia algo (espera a que terminen los guardados propios)
  const programarRecarga = useCallback(() => {
    clearTimeout(temporizador.current);
    temporizador.current = setTimeout(() => { if (pendientes.current) programarRecarga(); else recargar(); }, 700);
  }, [recargar]);

  useEffect(() => {
    if (!empresaId) return;
    local.set("alma-empresa", empresaId);
    setSt(null); recargar();
    const canalVivo = sb.channel("empresa-" + empresaId);
    TABLAS_EN_VIVO.forEach(t => canalVivo.on("postgres_changes", { event: "*", schema: "public", table: t, filter: `empresa_id=eq.${empresaId}` }, programarRecarga));
    canalVivo.on("postgres_changes", { event: "*", schema: "public", table: "empresas", filter: `id=eq.${empresaId}` }, programarRecarga);
    canalVivo.subscribe();
    return () => { sb.removeChannel(canalVivo); };
  }, [empresaId]);

  const user = st && uidSesion && (() => {
    const m = st.usuarios.find(u => u.id === uidSesion && u.activo !== false);
    return m ? { ...m, email: sesionSb.user.email } : null;
  })();

  // Cambio optimista: se ve al instante y se guarda en segundo plano, en orden
  const update = useCallback((fn, accion) => {
    const prev = stRef.current;
    const n = structuredClone(prev);
    fn(n);
    if (accion) n.bitacora = [{ t: Date.now(), u: user ? user.nombre : "—", a: accion }, ...(n.bitacora || [])].slice(0, 1000);
    stRef.current = n; setSt(n);
    if (JSON.stringify(n.uf) !== JSON.stringify(prev.uf)) local.set("alma-uf", n.uf);
    pendientes.current++; setGuardando(g => g + 1);
    cola.current = cola.current
      .then(async () => {
        await sincronizar(prev, n, empresaId);
        if (accion) await q(sb.from("bitacora").insert({ empresa_id: empresaId, user_id: uidSesion, usuario: user ? user.nombre : null, accion }));
      })
      .catch(e => { toast("No se guardó: " + mensajeError(e)); recargar(); })
      .finally(() => { pendientes.current--; setGuardando(g => g - 1); });
  }, [empresaId, uidSesion, user && user.nombre, toast, recargar]);

  const recargarUF = useCallback(async () => {
    try { const r = await obtenerUF(); update(s => { s.uf = { valor: r.valor, fecha: r.fecha, auto: true }; }); toast(`UF actualizada: ${fmtCLP(r.valor)}`); }
    catch { toast("No se pudo obtener la UF. Ingresa el valor manualmente en Configuración."); }
  }, [update, toast]);

  // UF automática una vez al día
  useEffect(() => {
    if (st && user && st.uf.auto !== false && st.uf.fecha !== toISO(hoy)) obtenerUF().then(r => update(s => { s.uf = { valor: r.valor, fecha: toISO(hoy), auto: true }; })).catch(() => {});
  }, [!!user, hoy]);

  const salir = () => { setVista("panel"); setFicha(null); sb.auth.signOut(); };

  if (recuperando && sesionSb) return <><style>{css}</style><NuevaClave onListo={() => { setRecuperando(false); toast("Clave actualizada"); }} /></>;
  if (sesionSb === undefined) return <><style>{css}</style><Cargando /></>;
  if (!sesionSb) return <><style>{css}</style><Acceso /></>;
  if (error && !st) return <><style>{css}</style><Cargando error={error} onReintentar={() => setIntento(i => i + 1)} /></>;
  if (!empresas) return <><style>{css}</style><Cargando /></>;
  if (!empresaId) return <><style>{css}</style><Bienvenida sesionSb={sesionSb} empresas={empresas} esAdmin={esAdmin}
    onElegir={setEmpresaId} onCreada={id => { local.set("alma-empresa", id); setIntento(i => i + 1); }} /></>;
  if (!st) return <><style>{css}</style><Cargando texto="Cargando propiedades…" /></>;
  if (!user) return <><style>{css}</style><Cargando error="Tu usuario está desactivado en esta empresa." onReintentar={() => setIntento(i => i + 1)} /></>;

  const ctx = {
    st, update, user, hoy, uf: Number(st.uf.valor) || 0, toast, recargarUF, recargar,
    abrirFicha: (propId, unidadId = null) => setFicha({ propId, unidadId }),
    setUnidadFicha: unidadId => setFicha(f => ({ ...f, unidadId })),
    ir: v => setVista(v),
  };
  const atrasados = listarUnidades(st).filter(x => x.u.contrato && calcUnidad(x.u, hoy, ctx.uf).estado === "atrasado").length;
  const vistas = VISTAS.filter(v => !v.soloDueno || user.rol === "dueno");
  const grupos = [...new Set(vistas.map(v => v.grupo))];
  const vistaOk = vistas.some(v => v.id === vista) ? vista : "panel";
  const Vista = { panel: PanelView, mapa: MapaView, propiedades: PropiedadesView, cobranza: CobranzaView, disponibles: DisponiblesView, contratos: ContratosView, bitacora: BitacoraView, config: ConfigView }[vistaOk];
  const sus = st.suscripcion;
  const bloqueada = sus && ["suspendida", "cancelada"].includes(sus.estado);

  return (
    <Ctx.Provider value={ctx}>
      <style>{css}</style>
      <div className="shell">
        <aside className={"sidebar" + (menu ? " open" : "")}>
          <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "4px 8px 12px" }}>
            <div style={{ width: 34, height: 34, borderRadius: 9, background: C.sidebarActive, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 18 }}>🏢</div>
            <div><div style={{ color: "#fff", fontWeight: 700, fontSize: 14 }}>Alma Arriendos</div><div style={{ color: "rgba(255,255,255,.4)", fontSize: 10.5 }}>{st.empresa.nombre}</div></div>
          </div>
          {grupos.map(g => (
            <div key={g}>
              <div className="nav-group-label">{g}</div>
              {vistas.filter(v => v.grupo === g).map(v => (
                <button key={v.id} className={"nav-item" + (vistaOk === v.id ? " active" : "")} onClick={() => { setVista(v.id); setMenu(false); }}>
                  <span>{v.icono}</span>{v.label}{v.id === "cobranza" && atrasados > 0 && <span className="nav-badge">{atrasados}</span>}
                </button>
              ))}
            </div>
          ))}
          <div style={{ marginTop: "auto", padding: "12px 8px 0", borderTop: "1px solid rgba(255,255,255,.08)" }}>
            <div style={{ color: "#fff", fontSize: 12.5, fontWeight: 600 }}>{user.nombre}</div>
            <div style={{ color: "rgba(255,255,255,.4)", fontSize: 11 }}>{user.rol === "dueno" ? "Dueño" : "Secretaria"}{esAdmin ? " · admin HM" : ""}</div>
            {empresas.length > 1 && <button className="nav-item" style={{ marginTop: 8, paddingLeft: 0 }} onClick={() => { local.set("alma-empresa", null); setFicha(null); setEmpresaId(null); }}>⇄ Cambiar empresa</button>}
            <button className="nav-item" style={{ paddingLeft: 0 }} onClick={salir}>↩ Cerrar sesión</button>
          </div>
        </aside>
        <div className="main">
          <div className="topbar">
            <div className="row">
              <button className="icon-btn menu-btn" onClick={() => setMenu(true)}>☰</button>
              <span style={{ fontWeight: 700 }}>{VISTAS.find(v => v.id === vistaOk)?.label}</span>
            </div>
            <div className="row">
              {guardando > 0 && <span className="muted">Guardando…</span>}
              <span className="tag hide-sm" style={{ background: C.blueDim, color: C.blue }}>UF {fmtCLP(ctx.uf)}</span>
              {atrasados > 0 && <button className="tag" style={{ background: EST.atrasado.bg, color: EST.atrasado.color, border: "none", cursor: "pointer" }} onClick={() => setVista("cobranza")}>⚠️ {atrasados} atrasado{atrasados > 1 ? "s" : ""}</button>}
            </div>
          </div>
          {sus && sus.estado !== "activa" && (
            <div style={{ padding: "8px 24px", fontSize: 12.5, background: bloqueada ? EST.atrasado.bg : sus.estado === "morosa" ? C.warningBg : C.infoBg, color: bloqueada ? "#B91C1C" : sus.estado === "morosa" ? C.warning : C.info, borderBottom: `1px solid ${C.border}` }}>
              {bloqueada ? "Suscripción suspendida: puedes ver tus datos, pero no modificarlos. Contacta a HM Software para reactivarla."
                : sus.estado === "morosa" ? "Tu suscripción tiene un pago pendiente. Regulariza para evitar la suspensión."
                : `Período de prueba${sus.pruebaHasta ? " hasta el " + fmtFecha(sus.pruebaHasta) : ""} · plan ${sus.plan}.`}
            </div>
          )}
          <div className="content"><Vista /></div>
        </div>
      </div>
      {ficha && <FichaDrawer propId={ficha.propId} unidadId={ficha.unidadId} onClose={() => setFicha(null)} />}
      {toastMsg && <div className="toast">{toastMsg}</div>}
    </Ctx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
