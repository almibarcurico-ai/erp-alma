// ─── UTILIDADES ───────────────────────────────────────────────────────────────
const uid = () => crypto.randomUUID();
const pad = n => String(n).padStart(2, "0");
const toISO = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseISO = s => { if (!s) return null; const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const sinHora = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const diffDias = (a, b) => Math.round((sinHora(a) - sinHora(b)) / 86400000);
const periodoDe = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
const sumarMes = (p, n) => { const [y, m] = p.split("-").map(Number); const d = new Date(y, m - 1 + n, 1); return periodoDe(d); };
const vencimiento = (p, dia) => { const [y, m] = p.split("-").map(Number); const ult = new Date(y, m, 0).getDate(); return new Date(y, m - 1, Math.min(dia || 1, ult)); };
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const nombrePeriodo = p => { const [y, m] = p.split("-").map(Number); return `${MESES[m - 1]} ${y}`; };
const fmtFecha = d => { if (!d) return "—"; const x = typeof d === "string" ? parseISO(d) : d; return `${pad(x.getDate())}-${pad(x.getMonth() + 1)}-${x.getFullYear()}`; };
const fmtFechaLarga = d => { const x = typeof d === "string" ? parseISO(d) : d; return `${x.getDate()} de ${MESES[x.getMonth()]} de ${x.getFullYear()}`; };
const fmtCLP = n => "$" + Math.round(n || 0).toLocaleString("es-CL");
const fmtUF = n => (Number(n) || 0).toLocaleString("es-CL", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " UF";
const fmtMonto = (n, moneda) => moneda === "CLP" ? fmtCLP(n) : fmtUF(n);
const aCLP = (n, moneda, uf) => moneda === "CLP" ? Number(n) || 0 : (Number(n) || 0) * uf;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const telWA = t => { let d = String(t || "").replace(/\D/g, ""); if (d.length === 9 && d[0] === "9") d = "56" + d; if (d.length === 8) d = "569" + d; return d; };

function comprimirImagen(file, max = 1200, calidad = 0.72) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onerror = rej;
    r.onload = () => {
      const img = new Image();
      img.onerror = rej;
      img.onload = () => {
        const s = Math.min(1, max / Math.max(img.width, img.height));
        const cv = document.createElement("canvas");
        cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
        cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
        res(cv.toDataURL("image/jpeg", calidad));
      };
      img.src = r.result;
    };
    r.readAsDataURL(file);
  });
}

    const filas = await q(crear().range(desde, desde + 999));
    out.push(...filas);
    if (filas.length < 1000) return out;
  }
}

function mensajeError(e) {
  const m = (e && (e.message || e.error_description)) || String(e);
  if (/row-level security|permission denied/i.test(m)) return "No tienes permiso para esta acción (o la suscripción está suspendida).";
  if (/Invalid login credentials/i.test(m)) return "Correo o clave incorrectos.";
  if (/Email not confirmed/i.test(m)) return "Confirma tu correo con el enlace que te enviamos antes de ingresar.";
  if (/User already registered/i.test(m)) return "Ese correo ya tiene cuenta. Ingresa con tu clave.";
  if (/Failed to fetch|NetworkError/i.test(m)) return "Sin conexión con el servidor. Revisa tu internet.";
  return m;
}

const aContrato = (c, pagos) => ({
  id: c.id, arrendatario: c.arrendatario, inicio: c.inicio, termino: c.termino || "", diaPago: c.dia_pago, moneda: c.moneda,
  valor: Number(c.valor), garantia: c.garantia == null ? "" : Number(c.garantia), multa: c.multa,
  multasCondonadas: Object.fromEntries((c.multas_condonadas || []).map(p => [p, true])),
  terminado: c.terminado,
  pagos: pagos.filter(p => p.contrato_id === c.id).map(p => ({
    id: p.id, periodo: p.periodo, fecha: p.fecha, ufDia: p.uf_dia == null ? null : Number(p.uf_dia),
    montoCLP: p.monto_clp, multaCLP: p.multa_clp, metodo: p.medio || "", obs: p.obs || "",
    registradoPor: p.registrado_nombre || "", registrado: Date.parse(p.creado),
  })),
});
const vacio = v => v == null ? "" : v;

async function cargarEmpresa(E) {
  const f = t => () => sb.from(t).select("*").eq("empresa_id", E);
  const [emp, sus, props, unis, cons, pags, docs, ints, bit, mies, invs] = await Promise.all([
    q(sb.from("empresas").select("*").eq("id", E).single()),
    q(sb.from("suscripciones").select("*, planes(nombre, max_unidades)").eq("empresa_id", E).maybeSingle()),
    todas(() => f("propiedades")().order("creado")),
    todas(() => f("unidades")().order("orden")),
    todas(f("contratos")),
    todas(f("pagos")),
    todas(() => f("documentos")().order("creado", { ascending: false })),
    todas(() => f("interesados")().order("creado", { ascending: false })),
    q(f("bitacora")().order("creado", { ascending: false }).limit(1000)),
    q(f("miembros")()),
    q(f("invitaciones")().is("aceptada", null)),
  ]);
  const propDeUnidad = Object.fromEntries(unis.map(u => [u.id, u.propiedad_id]));
  return {
    empresa: { id: emp.id, nombre: emp.nombre, rut: vacio(emp.rut), direccion: vacio(emp.direccion), email: vacio(emp.email), telefono: vacio(emp.telefono), representante: vacio(emp.representante), rutRep: vacio(emp.rut_rep) },
    suscripcion: sus ? { planId: sus.plan_id, plan: sus.planes && sus.planes.nombre, maxUnidades: sus.planes && sus.planes.max_unidades, estado: sus.estado, pruebaHasta: sus.prueba_hasta, vigenteHasta: sus.vigente_hasta } : null,
    uf: local.get("alma-uf") || { valor: 39800, fecha: "", auto: true },
    usuarios: mies.map(m => ({ id: m.user_id, nombre: m.nombre, rol: m.rol, activo: m.activo })),
    invitaciones: invs,
    propiedades: props.map(p => ({
      id: p.id, tipo: p.tipo, nombre: p.nombre, direccion: vacio(p.direccion), comuna: vacio(p.comuna), ciudad: vacio(p.ciudad),
      lat: p.lat, lng: p.lng, rol: vacio(p.rol_sii), notas: vacio(p.notas), arrendador: p.arrendador || {},
      unidades: unis.filter(u => u.propiedad_id === p.id).map(u => {
        const vig = cons.find(c => c.unidad_id === u.id && c.vigente);
        return {
          id: u.id, nombre: u.nombre, categoria: u.categoria, m2: vacio(u.m2), dormitorios: vacio(u.dormitorios), banos: vacio(u.banos),
          estacionamientos: vacio(u.estacionamientos), descripcion: vacio(u.descripcion), precioUF: vacio(u.precio_uf), fotos: u.fotos || [],
          contrato: vig ? aContrato(vig, pags) : null,
          historial: cons.filter(c => c.unidad_id === u.id && !c.vigente).map(c => aContrato(c, pags)),
        };
      }),
    })),
    documentos: docs.map(d => ({ id: d.id, propId: propDeUnidad[d.unidad_id], unidadId: d.unidad_id, tipo: d.tipo, titulo: d.titulo, fecha: d.creado.slice(0, 10), autor: d.autor_nombre || "", html: d.html })),
    interesados: ints.map(x => ({ id: x.id, nombre: vacio(x.nombre), telefono: vacio(x.telefono), email: vacio(x.email), nota: vacio(x.nota), canal: vacio(x.canal), por: x.por_nombre || "", propId: propDeUnidad[x.unidad_id], unidadId: x.unidad_id, fecha: x.creado.slice(0, 10) })),
    bitacora: bit.map(b => ({ t: Date.parse(b.creado), u: b.usuario || "—", a: b.accion })),
  };
}

// Convierte el estado de la app en filas por tabla, para comparar y guardar solo lo que cambió
function filas(st, E) {
  const t = { empresas: new Map(), propiedades: new Map(), unidades: new Map(), contratos: new Map(), pagos: new Map(), documentos: new Map(), interesados: new Map() };
  const e = st.empresa, n = v => v === "" || v == null ? null : v;
  t.empresas.set(e.id, { id: e.id, nombre: e.nombre, rut: n(e.rut), direccion: n(e.direccion), email: n(e.email), telefono: n(e.telefono), representante: n(e.representante), rut_rep: n(e.rutRep) });
  st.propiedades.forEach(p => {
    t.propiedades.set(p.id, { id: p.id, empresa_id: E, tipo: p.tipo, nombre: p.nombre, direccion: n(p.direccion), comuna: n(p.comuna), ciudad: n(p.ciudad),
      lat: Number(p.lat), lng: Number(p.lng), rol_sii: n(p.rol), notas: n(p.notas), arrendador: p.arrendador || {} });
    p.unidades.forEach((u, i) => {
      t.unidades.set(u.id, { id: u.id, empresa_id: E, propiedad_id: p.id, nombre: u.nombre, categoria: u.categoria || "otro", m2: num(u.m2), dormitorios: num(u.dormitorios),
        banos: num(u.banos), estacionamientos: num(u.estacionamientos), descripcion: n(u.descripcion), precio_uf: num(u.precioUF), fotos: u.fotos || [], orden: i });
      const contratos = [...(u.historial || []).map(c => [c, false]), ...(u.contrato ? [[u.contrato, true]] : [])];
      contratos.forEach(([c, vigente]) => {
        t.contratos.set(c.id, { id: c.id, empresa_id: E, unidad_id: u.id, arrendatario: c.arrendatario, inicio: c.inicio, termino: n(c.termino),
          dia_pago: Number(c.diaPago), moneda: c.moneda, valor: num(c.valor), garantia: num(c.garantia), multa: c.multa || { cobrar: false },
          multas_condonadas: Object.keys(c.multasCondonadas || {}).filter(k => c.multasCondonadas[k]).sort(),
          vigente, terminado: vigente ? null : n(c.terminado) });
        (c.pagos || []).forEach(pg => t.pagos.set(pg.id, { id: pg.id, empresa_id: E, contrato_id: c.id, periodo: pg.periodo, fecha: pg.fecha,
          uf_dia: num(pg.ufDia), monto_clp: Math.round(pg.montoCLP || 0), multa_clp: Math.round(pg.multaCLP || 0), medio: n(pg.metodo), obs: n(pg.obs), registrado_nombre: n(pg.registradoPor) }));
      });
    });
  });
  st.documentos.forEach(d => t.documentos.set(d.id, { id: d.id, empresa_id: E, unidad_id: d.unidadId, tipo: d.tipo, titulo: d.titulo, html: d.html, autor_nombre: n(d.autor) }));
  st.interesados.forEach(x => t.interesados.set(x.id, { id: x.id, empresa_id: E, unidad_id: x.unidadId, nombre: n(x.nombre), telefono: n(x.telefono), email: n(x.email), nota: n(x.nota), canal: n(x.canal), por_nombre: n(x.por) }));
  return t;
}

const TABLAS = ["empresas", "propiedades", "unidades", "contratos", "pagos", "documentos", "interesados"];
async function sincronizar(prev, next, E) {
  const a = filas(prev, E), b = filas(next, E);
  const creadas = [];
  try {
    await escribir(a, b, creadas);
  } catch (e) {
    // Sin transacción entre tablas: si algo falla a mitad, se deshace lo recién creado (más nuevo primero)
    for (const [t, ids] of creadas.reverse()) await sb.from(t).delete().in("id", ids);
    throw e;
  }
}
async function escribir(a, b, creadas) {
  for (const t of TABLAS) {
    const nuevas = [], cambiadas = [];
    for (const r of b[t].values()) {
      const antes = a[t].get(r.id);
      if (!antes) nuevas.push(r);
      else if (JSON.stringify(antes) !== JSON.stringify(r)) cambiadas.push(r);
    }
    // Fila por fila y no con upsert: un upsert dispara el límite de unidades del plan aunque sea una edición.
    // Un contrato que termina se guarda antes que el nuevo vigente de la misma unidad.
    if (t === "contratos") cambiadas.sort((x, y) => Number(x.vigente) - Number(y.vigente));
    for (const r of cambiadas) await q(sb.from(t).update(r).eq("id", r.id));
    const lote = t === "unidades" ? 10 : 100; // las unidades llevan fotos
    for (let i = 0; i < nuevas.length; i += lote) {
      const parte = nuevas.slice(i, i + lote);
      await q(sb.from(t).insert(parte));
      creadas.push([t, parte.map(r => r.id)]);
    }
  }
  for (const t of [...TABLAS].reverse()) {
    const borrar = [...a[t].keys()].filter(id => !b[t].has(id));
    if (borrar.length) await q(sb.from(t).delete().in("id", borrar));
  }
}

// Respaldos y datos antiguos: se copian con ids nuevos para no chocar con los existentes
function conIdsNuevos(d) {
  const mapa = {};
  const id = viejo => mapa[viejo] || (mapa[viejo] = uid());
  const contrato = c => ({ ...c, id: uid(), pagos: (c.pagos || []).map(pg => ({ ...pg, id: uid() })) });
  const propiedades = (d.propiedades || []).map(p => ({ ...p, id: id(p.id), arrendador: p.arrendador || {},
    unidades: (p.unidades || []).map(u => ({ ...u, id: id(u.id), fotos: u.fotos || [], contrato: u.contrato ? contrato(u.contrato) : null, historial: (u.historial || []).map(contrato) })) }));
  const documentos = (d.documentos || []).filter(x => mapa[x.unidadId]).map(x => ({ ...x, id: uid(), propId: mapa[x.propId], unidadId: mapa[x.unidadId] }));
  const interesados = (d.interesados || []).filter(x => mapa[x.unidadId]).map(x => ({ ...x, id: uid(), propId: mapa[x.propId], unidadId: mapa[x.unidadId] }));
  return { propiedades, documentos, interesados };
}

// Datos que la versión anterior guardaba en el navegador (IndexedDB), para importarlos
function leerDatosDelNavegador() {
  return new Promise(res => {
    try {
      const r = indexedDB.open("alma-arriendos", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("kv");
      r.onerror = () => res(null);
      r.onsuccess = () => {
        try {
          const g = r.result.transaction("kv").objectStore("kv").get("estado");
          g.onsuccess = () => res(g.result || null); g.onerror = () => res(null);
        } catch { res(null); }
      };
    } catch { res(null); }
  });
}

// ─── LÓGICA DE COBRO ──────────────────────────────────────────────────────────
function periodosContrato(c, hoy) {
  const ini = parseISO(c.inicio);
  if (!ini) return [];
  let p = periodoDe(ini);
  if (vencimiento(p, c.diaPago) < ini) p = sumarMes(p, 1);
  const fin = c.termino ? periodoDe(parseISO(c.termino)) : null;
  const actual = periodoDe(hoy);
  const out = [];
  while (p <= actual && (!fin || p <= fin) && out.length < 600) { out.push(p); p = sumarMes(p, 1); }
  return out;
}

// La multa se calcula en la moneda del contrato y solo si el arrendador decidió cobrarla.
// Superados los días de gracia, se cuenta desde el día siguiente al vencimiento.
function calcMulta(c, diasAtraso, periodo) {
  const m = c.multa || {};
  if (!m.cobrar || diasAtraso <= 0) return 0;
  if ((c.multasCondonadas || {})[periodo]) return 0;
  if (diasAtraso <= (Number(m.diasGracia) || 0)) return 0;
  const monto = Number(m.monto) || 0, valor = Number(c.valor) || 0;
  let x = 0;
  if (m.tipo === "diaria") x = monto * diasAtraso;
  else if (m.tipo === "diaria_pct") x = valor * monto / 100 * diasAtraso;
  else if (m.tipo === "fija") x = monto;
  else if (m.tipo === "pct") x = valor * monto / 100;
  const tope = Number(m.tope) || 0;
  return tope > 0 ? Math.min(x, tope) : x;
}

function descripcionMulta(c) {
  const m = c.multa || {};
  if (!m.cobrar) return "No se cobra multa";
  const u = c.moneda === "CLP" ? "$" : "UF";
  const monto = c.moneda === "CLP" ? fmtCLP(m.monto) : `${m.monto} UF`;
  const base = {
    diaria: `${monto} por cada día de atraso`,
    diaria_pct: `${m.monto}% de la renta por cada día de atraso`,
    fija: `${monto} fija por mes atrasado`,
    pct: `${m.monto}% de la renta por mes atrasado`,
  }[m.tipo] || "";
  return base + (Number(m.diasGracia) ? `, después de ${m.diasGracia} días de gracia` : "") + (Number(m.tope) ? ` (tope ${c.moneda === "CLP" ? fmtCLP(m.tope) : m.tope + " " + u})` : "");
}

function calcUnidad(u, hoy, uf) {
  const c = u.contrato;
  if (!c) return { estado: "libre", deudas: [], canonCLP: 0, multa: 0, deudaCLP: 0 };
  const pers = periodosContrato(c, hoy);
  const pagados = new Set((c.pagos || []).map(p => p.periodo));
  const deudas = [];
  pers.forEach(p => {
    if (pagados.has(p)) return;
    const v = vencimiento(p, c.diaPago);
    const dias = diffDias(hoy, v);
    if (dias > 0) deudas.push({ periodo: p, venc: v, dias, multa: calcMulta(c, dias, p) });
  });
  const actual = periodoDe(hoy);
  const vAct = vencimiento(actual, c.diaPago);
  let estado, proxVenc = null;
  if (deudas.length) estado = "atrasado";
  else if (pagados.has(actual) || !pers.includes(actual)) {
    estado = pagados.has(actual) ? "pagado" : "pendiente";
    const sig = sumarMes(actual, 1);
    proxVenc = vencimiento(pers.includes(actual) ? sig : (pers.length ? sig : periodoDe(parseISO(c.inicio))), c.diaPago);
  } else {
    const d = diffDias(vAct, hoy);
    estado = d === 0 ? "hoy" : d <= DIAS_AVISO ? "proximo" : "pendiente";
    proxVenc = vAct;
  }
  const canonCLP = aCLP(c.valor, c.moneda, uf);
  const multa = deudas.reduce((s, d) => s + d.multa, 0);
  const deudaCLP = aCLP(deudas.length * (Number(c.valor) || 0) + multa, c.moneda, uf);
  const diasTermino = c.termino ? diffDias(parseISO(c.termino), hoy) : null;
  return { estado, deudas, proxVenc, canonCLP, multa, deudaCLP, diasTermino, periodoActivo: pers.includes(actual) };
}

function calcPropiedad(p, hoy, uf) {
  const us = p.unidades.map(u => ({ u, r: calcUnidad(u, hoy, uf) }));
  const ocupadas = us.filter(x => x.u.contrato);
  const peor = ocupadas.length ? ocupadas.reduce((a, b) => EST[a.r.estado].ord <= EST[b.r.estado].ord ? a : b).r.estado : "libre";
  const cuenta = {};
  us.forEach(x => { cuenta[x.r.estado] = (cuenta[x.r.estado] || 0) + 1; });
  return { us, estado: peor, ocupadas: ocupadas.length, libres: us.length - ocupadas.length, cuenta,
    canonCLP: us.reduce((s, x) => s + x.r.canonCLP, 0), deudaCLP: us.reduce((s, x) => s + x.r.deudaCLP, 0) };
}

// Todas las unidades arrendables en una lista plana
function listarUnidades(st) {
  const out = [];
  st.propiedades.forEach(p => p.unidades.forEach(u => out.push({ p, u })));
  return out;
}
const nombreUnidad = (p, u) => p.tipo === "centro" ? `${p.nombre} · ${u.nombre}` : p.nombre;

function resumenFinanciero(st, hoy, uf) {
  const actual = periodoDe(hoy);
  let esperado = 0, cobrado = 0, porCobrar = 0, morosidad = 0, multas = 0, ocupadas = 0, total = 0;
  const pagosMes = [], porMes = {};
  for (let i = 5; i >= 0; i--) porMes[sumarMes(actual, -i)] = 0;
  listarUnidades(st).forEach(({ p, u }) => {
    total++;
    const c = u.contrato;
    const todos = [...(u.historial || []).flatMap(h => h.pagos || []), ...((c && c.pagos) || [])];
    todos.forEach(pg => {
      const mes = pg.fecha.slice(0, 7);
      const m = (pg.montoCLP || 0) + (pg.multaCLP || 0);
      if (mes in porMes) porMes[mes] += m;
      if (mes === actual) { cobrado += m; pagosMes.push({ ...pg, p, u }); }
    });
    if (!c) return;
    ocupadas++;
    const r = calcUnidad(u, hoy, uf);
    if (r.periodoActivo) {
      esperado += r.canonCLP;
      if (!(c.pagos || []).some(pg => pg.periodo === actual)) porCobrar += r.canonCLP;
    }
    morosidad += r.deudaCLP;
    multas += aCLP(r.multa, c.moneda, uf);
  });
  pagosMes.sort((a, b) => (b.registrado || 0) - (a.registrado || 0));
  return { esperado, cobrado, porCobrar, morosidad, multas, ocupadas, total, libres: total - ocupadas, pagosMes, porMes };
}


// ─── PLANTILLAS DE MENSAJES ───────────────────────────────────────────────────

  if (r.deudas.length) {

    out.push({ id: "atraso", titulo: "Aviso de atraso",
      asunto: `Arriendo atrasado - ${nom}`,
      texto: `Estimado/a ${a.nombre || ""}:\n\nA la fecha registramos el siguiente saldo pendiente por el arriendo de ${nom}:\n\n${det}\n\nTotal adeudado: ${fmtCLP(r.deudaCLP)} (UF a ${fmtCLP(uf)}).\n\nLe solicitamos regularizar a la brevedad. Si ya realizó el pago, por favor envíenos el comprobante.${firma}` });
  }
  out.push({ id: "pago", titulo: "Confirmación de pago recibido",
    asunto: `Pago recibido - ${nom}`,
    texto: `Estimado/a ${a.nombre || ""}:\n\nConfirmamos la recepción de su pago del arriendo de ${nom}. Muchas gracias.${firma}` });
  if (r.diasTermino != null && r.diasTermino <= DIAS_AVISO_TERMINO) {
    out.push({ id: "termino", titulo: "Contrato por terminar",
      asunto: `Término de contrato - ${nom}`,

  }
  out.push({ id: "libre", titulo: "Mensaje libre", asunto: `Arriendo ${nom}`, texto: `Estimado/a ${a.nombre || ""}:\n\n${firma}` });
  return out;
}

function datosEjemplo(hoy) {
  const d = hoy.getDate();
  const inicio = toISO(new Date(hoy.getFullYear(), hoy.getMonth() - 8, 1));
  const termino = (meses) => toISO(new Date(hoy.getFullYear(), hoy.getMonth() + meses, 0));
  const actual = periodoDe(hoy);
  const UFREF = 39800;
  const pagosHasta = (diaPago, valor, hastaOffset) => {
    const out = [];
    for (let i = 8; i >= hastaOffset; i--) {
      const per = sumarMes(actual, -i);
      const v = vencimiento(per, diaPago);
      if (v > hoy) break;
      out.push({ id: uid(), periodo: per, fecha: toISO(v), ufDia: UFREF, montoCLP: Math.round(valor * UFREF), multaCLP: 0, metodo: "Transferencia", registradoPor: "Ejemplo", registrado: v.getTime() });
    }
    return out;
  };

function Badge({ estado, children }) {
  const e = EST[estado];
  return <span className="tag" style={{ background: e.bg, color: e.color, border: `1px solid ${e.color}33` }}><span className="dot" style={{ background: e.color }} />{children || e.label}</span>;
}

function Modal({ titulo, onClose, children, pie, ancho }) {
  const ref = useRef(null);
  useEffect(() => {
    // Escape cierra solo la ventana de más arriba
    const f = e => { if (e.key !== "Escape") return; const todas = document.querySelectorAll(".overlay"); if (todas[todas.length - 1] === ref.current) onClose(); };
    window.addEventListener("keydown", f); return () => window.removeEventListener("keydown", f);
  }, [onClose]);
  return ReactDOM.createPortal(
    <div ref={ref} className="overlay" onMouseDown={e => e.target === e.currentTarget && onClose()}>
      <div className="modal" style={ancho ? { maxWidth: ancho } : null}>
        <div className="modal-head"><div style={{ fontWeight: 700 }}>{titulo}</div><button className="icon-btn" onClick={onClose}>✕</button></div>
        <div className="modal-body">{children}</div>
        {pie && <div className="modal-foot">{pie}</div>}
      </div>
    </div>, document.body);
}

function Campo({ label, children, span }) {
  return <div style={span ? { gridColumn: "1 / -1" } : null}><label className="label">{label}</label>{children}</div>;
}

function Kpi({ label, valor, sub, color, icono }) {
  return (
    <div className="kpi-card">
      <div className="row between"><span className="kpi-label">{label}</span><span style={{ fontSize: 18 }}>{icono}</span></div>
      <div className="kpi-value" style={color ? { color } : null}>{valor}</div>
      {sub && <div className="kpi-sub">{sub}</div>}
    </div>
  );
}

function Leyenda() {
  return <div className="legend">{Object.entries(EST).map(([k, e]) => <span key={k}><span className="dot" style={{ background: e.color }} />{e.label}</span>)}</div>;
}

function Contactar({ tel, email, mensaje, asunto, compacto }) {
  return (
    <div className="row">
      {tel && <a className={"btn btn-wa" + (compacto ? " btn-sm" : "")} href={linkWA(tel, mensaje || "")} target="_blank" rel="noopener">WhatsApp</a>}
      {email && <a className={"btn btn-mail" + (compacto ? " btn-sm" : "")} href={linkMail(email, asunto || "", mensaje || "")}>Correo</a>}
      {!tel && !email && <span className="muted">Sin datos de contacto</span>}
    </div>
  );
}

      h += `<div class="r"><span>Arrendatario</span><span>${esc(c.arrendatario?.nombre || "—")}</span></div>`;
      h += `<div class="r"><span>Renta</span><span>${fmtMonto(c.valor, c.moneda)}</span></div>`;
      h += `<div class="r"><span>Día de pago</span><span>${c.diaPago} de cada mes</span></div>`;
      if (r.proxVenc) h += `<div class="r"><span>Próximo venc.</span><span>${fmtFecha(r.proxVenc)}</span></div>`;
    } else if (u) {
      h += `<div class="r"><span>Tipo</span><span>${CATEGORIAS[u.categoria] || "—"}</span></div>`;
      if (u.m2) h += `<div class="r"><span>Superficie</span><span>${u.m2} m²</span></div>`;
      if (u.precioUF) h += `<div class="r"><span>Precio publicado</span><span>${fmtUF(u.precioUF)}</span></div>`;
    }
  }
  if (cp.deudaCLP) h += `<div class="r"><span>Deuda</span><span style="color:#DC2626;font-weight:700">${fmtCLP(cp.deudaCLP)}</span></div>`;
  h += `<div class="muted" style="margin-top:6px">Clic para abrir la ficha</div>`;
  return h;
}

function MapaBase({ puntos, onSelect, alto = 520, tooltips = true, elegir, onElegir, posicion, ajustar = true }) {
  const ref = useRef(null), mapa = useRef(null), capa = useRef(null), marcaElegida = useRef(null);
  const selRef = useRef(onSelect); selRef.current = onSelect;
  const eligeRef = useRef(onElegir); eligeRef.current = onElegir;
  const ajustado = useRef(false);

  useEffect(() => {
    const m = L.map(ref.current, { zoomControl: true, scrollWheelZoom: true }).setView([-33.45, -70.62], 11);
    const calles = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap" }).addTo(m);
    const sat = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", { maxZoom: 19, attribution: "© Esri" });
    L.control.layers({ "Mapa": calles, "Satélite": sat }, null, { position: "topright" }).addTo(m);
    capa.current = L.layerGroup().addTo(m);
    m.on("click", e => eligeRef.current && eligeRef.current(e.latlng));
    mapa.current = m;
    const ro = new ResizeObserver(() => m.invalidateSize());
    ro.observe(ref.current);
    return () => { ro.disconnect(); m.remove(); };
  }, []);

  useEffect(() => {
    const m = mapa.current, g = capa.current;
    if (!m || !puntos) return;
    g.clearLayers();
    puntos.forEach(pt => {
      const e = EST[pt.estado];
      const alerta = pt.estado === "atrasado" || pt.estado === "hoy";
      const icon = L.divIcon({ className: "", iconSize: pt.centro ? [36, 36] : [30, 30], iconAnchor: pt.centro ? [18, 18] : [15, 15],
        html: `<div class="pin ${pt.centro ? "centro" : ""} ${alerta ? "alerta" : ""}" style="--c:${e.color}">${pt.etiqueta || ""}</div>` });
      const mk = L.marker([pt.lat, pt.lng], { icon, riseOnHover: true });
      if (tooltips && pt.tooltip) mk.bindTooltip(pt.tooltip, { direction: "auto", offset: [pt.centro ? 14 : 12, 0], className: "tt", opacity: 1 });
      mk.on("click", () => selRef.current && selRef.current(pt.id));
      mk.addTo(g);
    });
    if (ajustar && !ajustado.current && puntos.length) {
      ajustado.current = true;
      m.fitBounds(L.latLngBounds(puntos.map(p => [p.lat, p.lng])).pad(0.2), { maxZoom: 15 });
    }
  }, [puntos]);

  useEffect(() => {
    const m = mapa.current;
    if (!m || !elegir) return;
    if (marcaElegida.current) { m.removeLayer(marcaElegida.current); marcaElegida.current = null; }
    if (posicion && posicion.lat != null && posicion.lng != null && !isNaN(posicion.lat)) {
      const mk = L.marker([posicion.lat, posicion.lng], { draggable: true }).addTo(m);
      mk.on("dragend", () => { const ll = mk.getLatLng(); eligeRef.current && eligeRef.current(ll); });
      marcaElegida.current = mk;
      if (!m.getBounds().contains([posicion.lat, posicion.lng])) m.setView([posicion.lat, posicion.lng], 16);
    }
  }, [posicion && posicion.lat, posicion && posicion.lng, elegir]);

  useEffect(() => { if (elegir && posicion && posicion.centrar) mapa.current.setView([posicion.lat, posicion.lng], 17); }, [posicion && posicion.centrar]);

  return <div ref={ref} className="map" style={{ height: alto, cursor: elegir ? "crosshair" : undefined }} />;
}

// soloLibres: pinta en morado y cuenta solo los locales desocupados
function usePuntos(propiedades, filtro, soloLibres = false) {
  const { hoy, uf } = useApp();
  return useMemo(() => propiedades.filter(p => p.lat != null && p.lng != null).map(p => {
    const cp = calcPropiedad(p, hoy, uf);
    return { id: p.id, lat: Number(p.lat), lng: Number(p.lng), estado: soloLibres ? "libre" : cp.estado, centro: p.tipo === "centro",
      etiqueta: p.tipo === "centro" ? (soloLibres ? cp.libres : p.unidades.length) : "", tooltip: tooltipHTML(p, cp, uf), cp, p };
  }).filter(pt => !filtro || filtro(pt)), [propiedades, hoy, uf, filtro, soloLibres]);
}

const urlRetorno = () => location.href.split("#")[0];

function Acceso() {
  const [modo, setModo] = useState("entrar");
  const [f, setF] = useState({ nombre: "", email: "", clave: "", clave2: "" });
  const [msg, setMsg] = useState({ error: "", ok: "" });
  const [enviando, setEnviando] = useState(false);
  const set = (k, v) => setF(x => ({ ...x, [k]: v }));

  const enviar = async e => {
    e.preventDefault(); setMsg({ error: "", ok: "" });
    const email = f.email.trim().toLowerCase();
    if (!email) return setMsg({ error: "Ingresa tu correo." });
    setEnviando(true);
    try {
      if (modo === "entrar") {
        await q(sb.auth.signInWithPassword({ email, password: f.clave }));
      } else if (modo === "registro") {
        if (!f.nombre.trim()) throw new Error("Ingresa tu nombre.");
        if (f.clave.length < 8) throw new Error("La clave debe tener al menos 8 caracteres.");
        if (f.clave !== f.clave2) throw new Error("Las claves no coinciden.");
        const r = await q(sb.auth.signUp({ email, password: f.clave, options: { data: { nombre: f.nombre.trim() }, emailRedirectTo: urlRetorno() } }));
        if (!r.session) setMsg({ ok: "Te enviamos un correo para confirmar tu cuenta. Ábrelo y luego ingresa con tu clave." });
      } else {
        await q(sb.auth.resetPasswordForEmail(email, { redirectTo: urlRetorno() }));
        setMsg({ ok: "Si el correo tiene cuenta, te llegará un enlace para crear una clave nueva." });
      }
    } catch (err) { setMsg({ error: mensajeError(err) }); }
    setEnviando(false);
  };

  const titulos = { entrar: "Ingresa con tu cuenta", registro: "Crea tu cuenta (14 días gratis)", recuperar: "Recupera tu clave" };
  return (
    <PantallaCentrada>
      <div className="muted" style={{ marginBottom: 20 }}>{titulos[modo]}</div>
      <form onSubmit={enviar} className="grid" style={{ gap: 12 }}>
        {modo === "registro" && <Campo label="Tu nombre"><input className="input" value={f.nombre} onChange={e => set("nombre", e.target.value)} autoComplete="name" /></Campo>}
        <Campo label="Correo"><input className="input" type="email" value={f.email} onChange={e => set("email", e.target.value)} autoComplete="email" autoFocus /></Campo>
        {modo !== "recuperar" && <Campo label="Clave"><input className="input" type="password" value={f.clave} onChange={e => set("clave", e.target.value)} autoComplete={modo === "registro" ? "new-password" : "current-password"} /></Campo>}
        {modo === "registro" && <Campo label="Repetir clave"><input className="input" type="password" value={f.clave2} onChange={e => set("clave2", e.target.value)} autoComplete="new-password" /></Campo>}
        {msg.error && <div style={{ color: "#B91C1C", fontSize: 12.5 }}>{msg.error}</div>}
        {msg.ok && <div style={{ color: C.success, fontSize: 12.5 }}>{msg.ok}</div>}
        <button className="btn btn-primary" style={{ justifyContent: "center", padding: 11 }} disabled={enviando}>
          {enviando ? "Un momento…" : modo === "entrar" ? "Ingresar" : modo === "registro" ? "Crear cuenta" : "Enviar enlace"}
        </button>
      </form>
      <div className="row between" style={{ marginTop: 16, fontSize: 12.5 }}>
        {modo !== "entrar" ? <a href="#" onClick={e => { e.preventDefault(); setModo("entrar"); setMsg({}); }}>‹ Ya tengo cuenta</a>
          : <a href="#" onClick={e => { e.preventDefault(); setModo("registro"); setMsg({}); }}>Crear cuenta nueva</a>}
        {modo === "entrar" && <a href="#" onClick={e => { e.preventDefault(); setModo("recuperar"); setMsg({}); }}>Olvidé mi clave</a>}
      </div>
      {modo === "registro" && <div className="muted" style={{ marginTop: 14 }}>Si te invitaron como secretaria, regístrate con el mismo correo de la invitación.</div>}
    </PantallaCentrada>
  );
}

  );

function GraficoIngresos({ porMes }) {

  return (
    <div style={{ display: "flex", alignItems: "flex-end", gap: 10, height: 170, paddingTop: 10 }}>

function Dona({ ocupadas, libres }) {
  const t = ocupadas + libres || 1, r = 42, cfr = 2 * Math.PI * r, f = ocupadas / t;
  return (
    <svg width="120" height="120" viewBox="0 0 120 120">
      <circle cx="60" cy="60" r={r} fill="none" stroke={EST.libre.color} strokeWidth="16" opacity=".85" />
      <circle cx="60" cy="60" r={r} fill="none" stroke={C.blueLight} strokeWidth="16" strokeDasharray={`${cfr * f} ${cfr}`} transform="rotate(-90 60 60)" />
      <text x="60" y="58" textAnchor="middle" fontSize="20" fontWeight="700" fill={C.text}>{Math.round(f * 100)}%</text>
      <text x="60" y="76" textAnchor="middle" fontSize="10" fill={C.textDim}>ocupación</text>
    </svg>
  );
}

function Alertas() {
  const { st, hoy, uf, abrirFicha } = useApp();
  const items = [];
  listarUnidades(st).forEach(({ p, u }) => {
    const r = calcUnidad(u, hoy, uf);
    if (["atrasado", "hoy", "proximo"].includes(r.estado)) items.push({ p, u, r, ord: EST[r.estado].ord, txt: r.estado === "atrasado" ? `${r.deudas.length} mes(es) · ${fmtCLP(r.deudaCLP)}${r.multa ? " (incluye multa)" : ""}` : `Vence ${fmtFecha(r.proxVenc)} · ${fmtMonto(u.contrato.valor, u.contrato.moneda)}` });
    if (r.diasTermino != null && r.diasTermino <= DIAS_AVISO_TERMINO) items.push({ p, u, r, ord: 3, termino: true, txt: r.diasTermino < 0 ? `Contrato venció el ${fmtFecha(u.contrato.termino)}` : `Contrato termina en ${r.diasTermino} días (${fmtFecha(u.contrato.termino)})` });
  });
  items.sort((a, b) => a.ord - b.ord);

  return (
    <div className="grid" style={{ gap: 8 }}>

  );

            <div className="row between"><div className="h2" style={{ margin: 0 }}>Libres y ocupadas</div><button className="btn btn-ghost btn-sm" onClick={() => ir("disponibles")}>Ver disponibles</button></div>

        </div>

}

  return (
    <div className="grid" style={{ gap: 6 }}>
      {libres.slice(0, max).map(({ p, u }) => (
        <div key={u.id} className="alert-row" onClick={() => abrirFicha(p.id, u.id)}>
          <span style={{ fontSize: 18 }}>{ICONO[u.categoria] || "📍"}</span>
          <div style={{ flex: 1, minWidth: 0 }}>

function MapaView() {

  const [estado, setEstado] = useState("");
  const [q, setQ] = useState("");
  const [editar, setEditar] = useState(null);
  const filtro = useCallback(pt => {
    if (estado && !(pt.estado === estado || pt.cp.cuenta[estado])) return false;
    if (q) { const s = q.toLowerCase(); return [pt.p.nombre, pt.p.direccion, pt.p.comuna, ...pt.p.unidades.map(u => u.contrato?.arrendatario?.nombre)].some(x => (x || "").toLowerCase().includes(s)); }
    return true;
  }, [estado, q]);
  const puntos = usePuntos(st.propiedades, filtro);
  return (
    <div className="grid fade-up" style={{ gap: 14 }}>
      <div className="row between">
        <div className="h1">Mapa</div>

          <input className="input" style={{ width: 220 }} placeholder="Buscar propiedad, comuna, arrendatario…" value={q} onChange={e => setQ(e.target.value)} />

}

function Fotos({ fotos, onChange, editable = true }) {
  const [ver, setVer] = useState(null);
  const subir = async e => {
    const files = Array.from(e.target.files || []);
    const nuevas = [];
    for (const f of files) { try { nuevas.push(await comprimirImagen(f)); } catch {} }
    onChange([...(fotos || []), ...nuevas]);
    e.target.value = "";
  };
  return (
    <div>
      <div className="gallery">
        {(fotos || []).map((src, i) => (
          <div key={i} className="ph">
            <img src={src} onClick={() => setVer(src)} alt="" />
            {editable && <button type="button" onClick={() => onChange(fotos.filter((_, j) => j !== i))}>✕</button>}
          </div>
        ))}
        {editable && (
          <label style={{ border: `2px dashed ${C.border}`, borderRadius: 8, aspectRatio: "4/3", display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", color: C.muted, fontSize: 12, textAlign: "center" }}>
            + Agregar fotos<input type="file" accept="image/*" multiple hidden onChange={subir} />
          </label>
        )}
      </div>
      {!editable && !(fotos || []).length && <div className="muted">Sin fotos.</div>}
      {ver && ReactDOM.createPortal(<div className="overlay" style={{ alignItems: "center" }} onClick={() => setVer(null)}><img src={ver} style={{ maxWidth: "95%", maxHeight: "90vh", borderRadius: 10 }} alt="" /></div>, document.body)}
    </div>
  );
}

function PropiedadForm({ inicial, onClose }) {
  const { st, update, toast, user } = useApp();
  const [p, setP] = useState(() => inicial ? structuredClone(inicial) : {
    id: uid(), tipo: "propiedad", nombre: "", direccion: "", comuna: "", ciudad: "Santiago", lat: null, lng: null, rol: "", notas: "",
    arrendador: { nombre: "", rut: "", email: "", telefono: "", domicilio: "" }, unidades: [unidadVacia()],
  });
  const [localEdit, setLocalEdit] = useState(null);
  const [buscando, setBuscando] = useState(false);
  const [centrar, setCentrar] = useState(0);
  const upd = (k, v) => setP(x => ({ ...x, [k]: v }));
  const updArr = (k, v) => setP(x => ({ ...x, arrendador: { ...(x.arrendador || {}), [k]: v } }));

  const cambiarTipo = t => setP(x => ({ ...x, tipo: t, unidades: t === "centro"
    ? (x.unidades.length === 1 && !x.unidades[0].contrato && !x.unidades[0].m2 ? [] : x.unidades.map((u, i) => ({ ...u, nombre: u.nombre === "Unidad principal" ? `Local ${i + 1}` : u.nombre })))
    : (x.unidades.length ? [x.unidades[0]] : [unidadVacia()]) }));

  const buscarDireccion = async () => {
    const q = [p.direccion, p.comuna, p.ciudad, "Chile"].filter(Boolean).join(", ");
    if (!p.direccion) return toast("Escribe la dirección primero");
    setBuscando(true);
    try {
      const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=cl&q=${encodeURIComponent(q)}`, { headers: { "Accept-Language": "es" } });
      const j = await r.json();
      if (j[0]) { setP(x => ({ ...x, lat: Number(Number(j[0].lat).toFixed(6)), lng: Number(Number(j[0].lon).toFixed(6)) })); setCentrar(Date.now()); toast("Ubicación encontrada. Ajusta el marcador si es necesario."); }
      else toast("No se encontró la dirección. Haz clic en el mapa para ubicarla.");
    } catch { toast("No se pudo buscar. Haz clic en el mapa para ubicarla."); }
    setBuscando(false);
  };

  const guardar = () => {
    if (!p.nombre.trim()) return toast("Falta el nombre de la propiedad");
    if (p.lat == null || p.lng == null || isNaN(p.lat) || isNaN(p.lng)) return toast("Ubica la propiedad en el mapa (busca la dirección o haz clic en el mapa)");
    if (p.tipo === "centro" && !p.unidades.length) return toast("Agrega al menos un local");
    const max = st.suscripcion && st.suscripcion.maxUnidades;
    const otras = listarUnidades(st).filter(x => x.p.id !== p.id).length;
    if (max && otras + p.unidades.length > max) return toast(`Tu plan ${st.suscripcion.plan} permite hasta ${max} unidades (tienes ${otras}). Contacta a HM Software para cambiar de plan.`);
    const malos = p.unidades.filter(u => u.contrato && (!u.contrato.arrendatario.nombre || !u.contrato.valor));
    if (malos.length) return toast(`Completa arrendatario y renta en: ${malos.map(u => u.nombre).join(", ")}`);
    const lat = Number(p.lat), lng = Number(p.lng);
    update(s => {
      const i = s.propiedades.findIndex(x => x.id === p.id);
      const limpio = { ...p, lat, lng };
      if (i >= 0) s.propiedades[i] = limpio; else s.propiedades.push(limpio);
    }, `${inicial ? "Editó" : "Agregó"} ${p.tipo === "centro" ? "centro comercial" : "propiedad"} "${p.nombre}"`);
    toast("Guardado");
    onClose();
  };

  return (
    <Modal titulo={inicial ? `Editar: ${inicial.nombre}` : "Nueva propiedad o centro comercial"} onClose={onClose} ancho={880}
      pie={<><button className="btn btn-ghost" onClick={onClose}>Cancelar</button><button className="btn btn-primary" onClick={guardar}>Guardar</button></>}>
      <div className="row" style={{ marginBottom: 14 }}>
        {[["propiedad", "🏠 Propiedad individual"], ["centro", "🛍️ Centro comercial / edificio con locales"]].map(([k, l]) =>
          <button key={k} type="button" className={"btn " + (p.tipo === k ? "btn-primary" : "btn-ghost")} onClick={() => cambiarTipo(k)}>{l}</button>)}
      </div>
      <div className="form-grid">
        <Campo label="Nombre"><input className="input" value={p.nombre} onChange={e => upd("nombre", e.target.value)} placeholder={p.tipo === "centro" ? "Ej: Strip Center Alma" : "Ej: Casa Los Jardines"} /></Campo>
        <Campo label="Dirección"><input className="input" value={p.direccion} onChange={e => upd("direccion", e.target.value)} onKeyDown={e => e.key === "Enter" && (e.preventDefault(), buscarDireccion())} /></Campo>
        <Campo label="Comuna"><input className="input" value={p.comuna} onChange={e => upd("comuna", e.target.value)} /></Campo>
        <Campo label="Ciudad"><input className="input" value={p.ciudad} onChange={e => upd("ciudad", e.target.value)} /></Campo>
        <Campo label="Rol SII"><input className="input" value={p.rol} onChange={e => upd("rol", e.target.value)} /></Campo>
      </div>

      <div className="section-title">Ubicación (coordenadas)</div>
      <div className="row" style={{ marginBottom: 8 }}>
        <button type="button" className="btn btn-ghost" onClick={buscarDireccion} disabled={buscando}>{buscando ? "Buscando…" : "📍 Buscar dirección en el mapa"}</button>
        <div style={{ width: 130 }}><input className="input" placeholder="Latitud" value={p.lat ?? ""} onChange={e => upd("lat", e.target.value === "" ? null : Number(e.target.value))} /></div>
        <div style={{ width: 130 }}><input className="input" placeholder="Longitud" value={p.lng ?? ""} onChange={e => upd("lng", e.target.value === "" ? null : Number(e.target.value))} /></div>
        <span className="muted">o haz clic en el mapa / arrastra el marcador</span>
      </div>
      <MapaBase puntos={[]} alto={260} tooltips={false} ajustar={false} elegir
        posicion={{ lat: p.lat, lng: p.lng, centrar }}
        onElegir={ll => setP(x => ({ ...x, lat: Number(ll.lat.toFixed(6)), lng: Number(ll.lng.toFixed(6)) }))} />

      <div className="section-title">Arrendador / propietario {user.rol === "dueno" ? "" : ""}</div>
      <div className="muted" style={{ marginBottom: 8 }}>Déjalo vacío si el arrendador es {st.empresa.nombre}.</div>
      <div className="form-grid">
        <Campo label="Nombre"><input className="input" value={p.arrendador?.nombre || ""} onChange={e => updArr("nombre", e.target.value)} placeholder={st.empresa.nombre} /></Campo>
        <Campo label="RUT"><input className="input" value={p.arrendador?.rut || ""} onChange={e => updArr("rut", e.target.value)} /></Campo>
        <Campo label="Correo"><input className="input" value={p.arrendador?.email || ""} onChange={e => updArr("email", e.target.value)} /></Campo>
        <Campo label="Teléfono / WhatsApp"><input className="input" value={p.arrendador?.telefono || ""} onChange={e => updArr("telefono", e.target.value)} /></Campo>
      </div>

      {p.tipo === "propiedad" ? (
        <UnidadEditor value={p.unidades[0]} onChange={u => setP(x => ({ ...x, unidades: [u] }))} />
      ) : (
        <>
          <div className="section-title row between"><span>Locales ({p.unidades.length})</span>
            <button type="button" className="btn btn-ghost btn-sm" onClick={() => setLocalEdit(unidadVacia("local", `Local ${p.unidades.length + 1}`))}>+ Agregar local</button>
          </div>
          {!p.unidades.length ? <div className="muted">Agrega los locales del centro comercial.</div> : (
            <div className="table-wrap"><table>
              <thead><tr><th>Local</th><th>m²</th><th>Arrendatario</th><th className="num">Renta</th><th></th></tr></thead>
              <tbody>{p.unidades.map(u => (
                <tr key={u.id} className="click" onClick={() => setLocalEdit(structuredClone(u))}>
                  <td style={{ fontWeight: 600 }}>{u.nombre}</td><td>{u.m2 || "—"}</td>
                  <td>{u.contrato ? u.contrato.arrendatario.nombre : <Badge estado="libre" />}</td>
                  <td className="num">{u.contrato ? fmtMonto(u.contrato.valor, u.contrato.moneda) : "—"}</td>
                  <td className="num"><button type="button" className="btn btn-ghost btn-sm">Editar</button></td>
                </tr>))}
              </tbody></table></div>
          )}
        </>
      )}
      <div className="section-title">Notas internas</div>
      <textarea className="input" rows={2} value={p.notas} onChange={e => upd("notas", e.target.value)} />

      {localEdit && (
        <Modal titulo={`Local: ${localEdit.nombre}`} onClose={() => setLocalEdit(null)} ancho={760}
          pie={<>
            {p.unidades.some(x => x.id === localEdit.id) && user.rol === "dueno" &&
              <button className="btn btn-danger" style={{ marginRight: "auto" }} onClick={() => { if (confirm("¿Eliminar este local?")) { setP(x => ({ ...x, unidades: x.unidades.filter(u => u.id !== localEdit.id) })); setLocalEdit(null); } }}>Eliminar local</button>}
            <button className="btn btn-ghost" onClick={() => setLocalEdit(null)}>Cancelar</button>
            <button className="btn btn-primary" onClick={() => { setP(x => { const i = x.unidades.findIndex(u => u.id === localEdit.id); const us = [...x.unidades]; if (i >= 0) us[i] = localEdit; else us.push(localEdit); return { ...x, unidades: us }; }); setLocalEdit(null); }}>Listo</button>
          </>}>
          <UnidadEditor value={localEdit} onChange={setLocalEdit} esLocal />
        </Modal>
      )}
    </Modal>
  );
}


// ─── REGISTRO DE PAGO ─────────────────────────────────────────────────────────
function PagoModal({ p, u, onClose }) {
  const { update, hoy, uf, user, toast } = useApp();
  const c = u.contrato;
  const r = calcUnidad(u, hoy, uf);
  const pagados = new Set((c.pagos || []).map(x => x.periodo));
  const actual = periodoDe(hoy);
  const opciones = [...new Set([...r.deudas.map(d => d.periodo), actual, sumarMes(actual, 1)])].filter(x => !pagados.has(x));
  const [f, setF] = useState(() => ({ periodo: opciones[0] || actual, fecha: toISO(hoy), ufDia: Math.round(uf * 100) / 100, metodo: "Transferencia", obs: "", condonar: false }));
  const fechaPago = parseISO(f.fecha) || hoy;
  const diasAtraso = diffDias(fechaPago, vencimiento(f.periodo, c.diaPago));
  const multa = f.condonar ? 0 : calcMulta(c, diasAtraso, f.periodo);
  const montoCLP = Math.round(aCLP(c.valor, c.moneda, Number(f.ufDia)));
  const multaCLP = Math.round(aCLP(multa, c.moneda, Number(f.ufDia)));
  const [ajuste, setAjuste] = useState(null);
  const totalSugerido = montoCLP + multaCLP;
  const total = ajuste == null ? totalSugerido : Number(ajuste) || 0;

  const guardar = () => {
    update(s => {
      const uu = s.propiedades.find(x => x.id === p.id).unidades.find(x => x.id === u.id);
      const cc = uu.contrato;
      if (f.condonar) cc.multasCondonadas = { ...(cc.multasCondonadas || {}), [f.periodo]: true };
      const mClp = Math.min(multaCLP, Math.max(0, total - montoCLP));
      cc.pagos = [...(cc.pagos || []), { id: uid(), periodo: f.periodo, fecha: f.fecha, ufDia: Number(f.ufDia), montoCLP: total - mClp, multaCLP: mClp, metodo: f.metodo, obs: f.obs, registradoPor: user.nombre, registrado: Date.now() }];
    }, `Registró pago de ${nombrePeriodo(f.periodo)} en "${nombreUnidad(p, u)}" por ${fmtCLP(total)}${f.condonar ? " (multa condonada)" : ""}`);
    toast("Pago registrado");
    onClose();
  };

  return (
    <Modal titulo={`Registrar pago · ${nombreUnidad(p, u)}`} onClose={onClose} ancho={560}
      pie={<><button className="btn btn-ghost" onClick={onClose}>Cancelar</button><button className="btn btn-primary" onClick={guardar} disabled={!opciones.length}>Registrar {fmtCLP(total)}</button></>}>
      <div className="form-grid">
        <Campo label="Mes que paga">
          <select className="select" value={f.periodo} onChange={e => setF({ ...f, periodo: e.target.value })}>
            {opciones.map(o => <option key={o} value={o}>{nombrePeriodo(o)}{r.deudas.some(d => d.periodo === o) ? " (atrasado)" : ""}</option>)}
          </select>
        </Campo>
        <Campo label="Fecha de pago"><input className="input" type="date" value={f.fecha} onChange={e => setF({ ...f, fecha: e.target.value })} /></Campo>
        {c.moneda === "UF" && <Campo label="Valor UF del día"><input className="input" type="number" step="0.01" value={f.ufDia} onChange={e => setF({ ...f, ufDia: e.target.value })} /></Campo>}
        <Campo label="Medio de pago">
          <select className="select" value={f.metodo} onChange={e => setF({ ...f, metodo: e.target.value })}>
            {["Transferencia", "Depósito", "Efectivo", "Cheque", "Tarjeta", "Otro"].map(m => <option key={m}>{m}</option>)}
          </select>
        </Campo>
      </div>
      <div className="card" style={{ marginTop: 14, background: C.bg, padding: 14 }}>
        <dl className="kv">
          <dt>Renta</dt><dd>{fmtMonto(c.valor, c.moneda)} = {fmtCLP(montoCLP)}</dd>
          <dt>Vencimiento</dt><dd>{fmtFecha(vencimiento(f.periodo, c.diaPago))} {diasAtraso > 0 ? <span style={{ color: "#DC2626" }}>· {diasAtraso} días de atraso</span> : ""}</dd>
          <dt>Multa</dt><dd>{c.multa?.cobrar ? (multa ? `${fmtMonto(multa, c.moneda)} = ${fmtCLP(multaCLP)}` : "$0") : "No se cobra"} </dd>
        </dl>
        {c.multa?.cobrar && calcMulta(c, diasAtraso, f.periodo) > 0 && (
          <label className="switch" style={{ marginTop: 10 }} title={user.rol !== "dueno" ? "Solo el dueño puede condonar multas" : ""}>
            <input type="checkbox" checked={f.condonar} disabled={user.rol !== "dueno"} onChange={e => setF({ ...f, condonar: e.target.checked })} />
            Condonar multa de este mes {user.rol !== "dueno" && <span className="muted">(solo dueño)</span>}
          </label>
        )}
      </div>
      <div className="form-grid" style={{ marginTop: 14 }}>
        <Campo label="Monto recibido (CLP)"><input className="input" type="number" value={ajuste ?? totalSugerido} onChange={e => setAjuste(e.target.value)} /></Campo>
        <Campo label="Observación"><input className="input" value={f.obs} onChange={e => setF({ ...f, obs: e.target.value })} placeholder="N° de transferencia, etc." /></Campo>
      </div>
    </Modal>
  );
}


// ─── COMUNICAR (WhatsApp / correo) ────────────────────────────────────────────
function ComunicarModal({ p, u, onClose, inicial }) {
  const { st, hoy, uf, update } = useApp();
  const r = calcUnidad(u, hoy, uf);
  const lista = mensajes(p, u, r, uf, st.empresa);
  const [sel, setSel] = useState(inicial && lista.some(m => m.id === inicial) ? inicial : (r.deudas.length ? "atraso" : "recordatorio"));
  const m = lista.find(x => x.id === sel) || lista[0];
  const [texto, setTexto] = useState(m.texto);
  const [destino, setDestino] = useState("arrendatario");
  useEffect(() => { setTexto((lista.find(x => x.id === sel) || lista[0]).texto); }, [sel]);
  const a = u.contrato.arrendatario || {};
  const arr = p.arrendador && (p.arrendador.telefono || p.arrendador.email) ? p.arrendador : { nombre: st.empresa.nombre, telefono: st.empresa.telefono, email: st.empresa.email };
  const dest = destino === "arrendatario" ? a : arr;
  const registrar = canalTxt => update(() => {}, `Envió "${m.titulo}" por ${canalTxt} a ${dest.nombre || destino} (${nombreUnidad(p, u)})`);

  return (
    <Modal titulo="Contactar" onClose={onClose} ancho={620}>
      <div className="form-grid">
        <Campo label="Destinatario">
          <select className="select" value={destino} onChange={e => setDestino(e.target.value)}>
            <option value="arrendatario">Arrendatario: {a.nombre}</option>
            <option value="arrendador">Arrendador: {arr.nombre}</option>
          </select>
        </Campo>
        <Campo label="Plantilla">
          <select className="select" value={sel} onChange={e => setSel(e.target.value)}>
            {lista.map(x => <option key={x.id} value={x.id}>{x.titulo}</option>)}
          </select>
        </Campo>
        <Campo label="Mensaje" span><textarea className="input" rows={10} value={texto} onChange={e => setTexto(e.target.value)} /></Campo>
      </div>
      <div className="row" style={{ marginTop: 14 }}>
        {dest.telefono ? <a className="btn btn-wa" href={linkWA(dest.telefono, texto)} target="_blank" rel="noopener" onClick={() => registrar("WhatsApp")}>Enviar por WhatsApp</a> : <span className="muted">Sin teléfono</span>}
        {dest.email ? <a className="btn btn-mail" href={linkMail(dest.email, m.asunto, texto)} onClick={() => registrar("correo")}>Enviar por correo</a> : <span className="muted">Sin correo</span>}
        <button className="btn btn-ghost" onClick={() => { navigator.clipboard?.writeText(texto); }}>Copiar texto</button>
      </div>
    </Modal>
  );
}


// ─── COMPARTIR CON INTERESADO ─────────────────────────────────────────────────
function CompartirModal({ p, u, onClose }) {
  const { uf, update, toast, user } = useApp();
  const [i, setI] = useState({ nombre: "", telefono: "", email: "", nota: "" });
  const texto = `Hola${i.nombre ? " " + i.nombre.split(" ")[0] : ""}, te comparto la información de la propiedad:\n\n${textoFichaDisponible(p, u, uf)}\n\nQuedo atento/a para coordinar una visita.`;
  const registrar = canalTxt => {
    if (!i.nombre && !i.telefono && !i.email) return;
    update(s => { s.interesados.unshift({ id: uid(), ...i, propId: p.id, unidadId: u.id, fecha: toISO(new Date()), canal: canalTxt, por: user.nombre }); }, `Envió ficha de "${nombreUnidad(p, u)}" a interesado ${i.nombre || i.telefono || i.email} por ${canalTxt}`);
  };
  const compartirFotos = async () => {
    try {
      const files = await Promise.all((u.fotos || []).map(async (src, k) => { const b = await (await fetch(src)).blob(); return new File([b], `foto-${k + 1}.jpg`, { type: "image/jpeg" }); }));
      if (navigator.canShare && navigator.canShare({ files })) {
        await navigator.share({ files, title: nombreUnidad(p, u), text: texto });
        registrar("compartir (fotos)");
      } else toast("Este navegador no permite compartir fotos directamente. Usa “Ficha PDF” o compártelo desde el celular.");
    } catch {}
  };
  const fichaPDF = () => {
    imprimirHTML(`Ficha ${nombreUnidad(p, u)}`, `<h1 style="font-size:20px">${esc(nombreUnidad(p, u))}</h1><p style="text-align:center">${esc(p.direccion)}${p.comuna ? ", " + esc(p.comuna) : ""}</p>
      <div class="fotos">${(u.fotos || []).slice(0, 6).map(f => `<img src="${f}"/>`).join("")}</div>
      <table style="margin-top:14px"><tr><td>Tipo</td><td>${CATEGORIAS[u.categoria] || ""}</td></tr>${u.m2 ? `<tr><td>Superficie</td><td>${u.m2} m²</td></tr>` : ""}${u.dormitorios ? `<tr><td>Dormitorios</td><td>${u.dormitorios}</td></tr>` : ""}${u.banos ? `<tr><td>Baños</td><td>${u.banos}</td></tr>` : ""}${u.estacionamientos ? `<tr><td>Estacionamientos</td><td>${u.estacionamientos}</td></tr>` : ""}${u.precioUF ? `<tr><td>Valor mensual</td><td>${fmtUF(u.precioUF)} (aprox. ${fmtCLP(u.precioUF * uf)})</td></tr>` : ""}</table>
      ${u.descripcion ? `<p style="margin-top:14px">${esc(u.descripcion)}</p>` : ""}<p>Ubicación: https://www.google.com/maps?q=${p.lat},${p.lng}</p>`);
    registrar("ficha PDF");
  };
  return (
    <Modal titulo={`Enviar a interesado · ${nombreUnidad(p, u)}`} onClose={onClose} ancho={640}>
      <div className="form-grid">
        <Campo label="Nombre del interesado"><input className="input" value={i.nombre} onChange={e => setI({ ...i, nombre: e.target.value })} /></Campo>
        <Campo label="Teléfono / WhatsApp"><input className="input" value={i.telefono} onChange={e => setI({ ...i, telefono: e.target.value })} /></Campo>
        <Campo label="Correo"><input className="input" value={i.email} onChange={e => setI({ ...i, email: e.target.value })} /></Campo>
        <Campo label="Nota"><input className="input" value={i.nota} onChange={e => setI({ ...i, nota: e.target.value })} placeholder="Ej: busca para cafetería" /></Campo>
      </div>
      <div className="label" style={{ marginTop: 14 }}>Mensaje que se enviará</div>
      <pre style={{ whiteSpace: "pre-wrap", fontFamily: "Sora", fontSize: 12.5, background: C.bg, border: `1px solid ${C.border}`, borderRadius: 8, padding: 12 }}>{texto}</pre>
      {(u.fotos || []).length > 0 && <div style={{ marginTop: 10 }}><Fotos fotos={u.fotos} editable={false} /></div>}
      <div className="row" style={{ marginTop: 14 }}>
        <a className={"btn btn-wa" + (i.telefono ? "" : " disabled")} href={i.telefono ? linkWA(i.telefono, texto) : undefined} target="_blank" rel="noopener" onClick={e => { if (!i.telefono) { e.preventDefault(); toast("Ingresa el teléfono del interesado"); } else registrar("WhatsApp"); }}>WhatsApp</a>
        <a className="btn btn-mail" href={linkMail(i.email, `Propiedad en arriendo: ${nombreUnidad(p, u)}`, texto)} onClick={() => registrar("correo")}>Correo</a>
        {(u.fotos || []).length > 0 && <button className="btn btn-ghost" onClick={compartirFotos}>📷 Compartir con fotos</button>}
        <button className="btn btn-ghost" onClick={fichaPDF}>📄 Ficha PDF</button>
      </div>
      <div className="muted" style={{ marginTop: 10 }}>WhatsApp Web no permite adjuntar fotos desde un enlace: en el celular usa “Compartir con fotos”; en el computador envía la Ficha PDF.</div>
    </Modal>
  );
}


// ─── FICHA (panel lateral) ────────────────────────────────────────────────────
function FichaDrawer({ propId, unidadId, onClose }) {
  const { st, hoy, uf, user, update, toast, setUnidadFicha } = useApp();
  const p = st.propiedades.find(x => x.id === propId);
  const [tab, setTab] = useState("resumen");
  const [modal, setModal] = useState(null);
  useEffect(() => { setTab("resumen"); }, [unidadId]);
  useEffect(() => { const f = e => e.key === "Escape" && !document.querySelector(".overlay") && onClose(); window.addEventListener("keydown", f); return () => window.removeEventListener("keydown", f); }, [onClose]);
  if (!p) return null;
  const esCentro = p.tipo === "centro";
  const u = esCentro ? p.unidades.find(x => x.id === unidadId) : p.unidades[0];
  const cp = calcPropiedad(p, hoy, uf);
  const esDueno = user.rol === "dueno";

  const eliminar = () => {
    if (!confirm(`¿Eliminar "${p.nombre}" y todos sus datos? Esta acción no se puede deshacer.`)) return;
    update(s => { s.propiedades = s.propiedades.filter(x => x.id !== p.id); }, `Eliminó la propiedad "${p.nombre}"`);
    onClose();
  };

  return (
    <>
      <div className="drawer-bg" onClick={onClose} />
      <div className="drawer">
        <div className="drawer-head">
          <div className="row between" style={{ flexWrap: "nowrap" }}>
            <div style={{ minWidth: 0 }}>
              {esCentro && u && <button className="btn btn-ghost btn-sm" style={{ marginBottom: 6 }} onClick={() => setUnidadFicha(null)}>‹ {p.nombre}</button>}
              <div style={{ fontWeight: 700, fontSize: 17 }}>{ICONO[esCentro && !u ? "centro" : u?.categoria]} {esCentro && u ? u.nombre : p.nombre}</div>
              <div className="muted">{p.direccion}{p.comuna ? ", " + p.comuna : ""}</div>
            </div>
            <button className="icon-btn" onClick={onClose}>✕</button>
          </div>
          <div className="row" style={{ marginTop: 10 }}>
            {u ? <Badge estado={calcUnidad(u, hoy, uf).estado} /> : <Badge estado={cp.estado} />}
            {puede(user, "editar") && <button className="btn btn-ghost btn-sm" onClick={() => setModal({ t: "editar" })}>✏️ Editar</button>}
            <a className="btn btn-ghost btn-sm" href={`https://www.google.com/maps?q=${p.lat},${p.lng}`} target="_blank" rel="noopener">🗺️ Google Maps</a>
            {esDueno && !u && <button className="btn btn-danger btn-sm" onClick={eliminar}>Eliminar</button>}
            {esDueno && u && !esCentro && <button className="btn btn-danger btn-sm" onClick={eliminar}>Eliminar</button>}
          </div>
        </div>
        <div className="drawer-body">
          {esCentro && !u ? <FichaCentro p={p} cp={cp} /> : <FichaUnidad p={p} u={u} tab={tab} setTab={setTab} setModal={setModal} />}
        </div>
      </div>
      {modal && modal.t === "editar" && <PropiedadForm inicial={p} onClose={() => setModal(null)} />}
      {modal && modal.t === "pago" && <PagoModal p={p} u={u} onClose={() => setModal(null)} />}
      {modal && modal.t === "comunicar" && <ComunicarModal p={p} u={u} inicial={modal.plantilla} onClose={() => setModal(null)} />}
      {modal && modal.t === "compartir" && <CompartirModal p={p} u={u} onClose={() => setModal(null)} />}
      {modal && modal.t === "doc" && <DocumentoModal p={p} u={u} tipoInicial={modal.tipo} onClose={() => setModal(null)} />}
    </>
  );
}

function FichaUnidad({ p, u, tab, setTab, setModal }) {
  const { st, hoy, uf, user, update, toast } = useApp();
  if (!u) return <div className="empty">Unidad no encontrada.</div>;
  const r = calcUnidad(u, hoy, uf);
  const c = u.contrato;
  const a = c?.arrendatario || {};
  const esDueno = user.rol === "dueno";
  const arr = p.arrendador && p.arrendador.nombre ? p.arrendador : { nombre: st.empresa.nombre, rut: st.empresa.rut, email: st.empresa.email, telefono: st.empresa.telefono };
  const docs = st.documentos.filter(d => d.unidadId === u.id);
  const interes = st.interesados.filter(x => x.unidadId === u.id);

  const toggleMulta = () => update(s => {
    const cc = s.propiedades.find(x => x.id === p.id).unidades.find(x => x.id === u.id).contrato;
    cc.multa = { ...cc.multa, cobrar: !cc.multa.cobrar };
  }, `${c.multa.cobrar ? "Desactivó" : "Activó"} el cobro de multa en "${nombreUnidad(p, u)}"`);

  const terminar = () => {
    if (!confirm(`¿Terminar el contrato de ${a.nombre}? La unidad quedará desocupada y el contrato pasará al historial.`)) return;
    update(s => {
      const uu = s.propiedades.find(x => x.id === p.id).unidades.find(x => x.id === u.id);
      uu.historial = [...(uu.historial || []), { ...uu.contrato, terminado: toISO(new Date()) }];
      uu.contrato = null;
    }, `Terminó el contrato de ${a.nombre} en "${nombreUnidad(p, u)}"`);
    toast("Contrato terminado. La unidad quedó disponible.");
  };

  const borrarPago = pg => {
    if (!confirm(`¿Eliminar el pago de ${nombrePeriodo(pg.periodo)}?`)) return;
    update(s => {
      const cc = s.propiedades.find(x => x.id === p.id).unidades.find(x => x.id === u.id).contrato;
      cc.pagos = cc.pagos.filter(x => x.id !== pg.id);
    }, `Eliminó el pago de ${nombrePeriodo(pg.periodo)} en "${nombreUnidad(p, u)}"`);
  };

  const tabs = c ? [["resumen", "Resumen"], ["arrendatario", "Arrendatario"], ["pagos", `Pagos${r.deudas.length ? " ⚠️" : ""}`], ["fotos", "Fotos"], ["docs", `Documentos (${docs.length})`]]
                 : [["resumen", "Resumen"], ["fotos", "Fotos"], ["interesados", `Interesados (${interes.length})`], ["docs", `Documentos (${docs.length})`]];

  return (
    <div>
      {u.fotos?.length ? <img className="cover" style={{ borderRadius: 10, height: 180 }} src={u.fotos[0]} alt="" /> : null}
      {c ? (
        <div className="row" style={{ marginTop: 12 }}>
          {puede(user, "pagos") && <button className="btn btn-primary btn-sm" onClick={() => setModal({ t: "pago" })}>💵 Registrar pago</button>}
          <button className="btn btn-ghost btn-sm" onClick={() => setModal({ t: "comunicar" })}>💬 Contactar</button>
          <button className="btn btn-ghost btn-sm" onClick={() => setModal({ t: "doc", tipo: p.tipo === "centro" || ["local", "oficina", "bodega"].includes(u.categoria) ? "contrato_com" : "contrato_hab" })}>📄 Contrato / anexo</button>
        </div>
      ) : (
        <div className="row" style={{ marginTop: 12 }}>
          <button className="btn btn-primary btn-sm" onClick={() => setModal({ t: "compartir" })}>📤 Enviar a interesado</button>

        </div>

      <div style={{ paddingTop: 16 }}>
        {tab === "resumen" && (
          <div className="grid" style={{ gap: 18 }}>
            {c && (
              <div className="card" style={{ background: EST[r.estado].bg, borderColor: EST[r.estado].color + "55", padding: 14 }}>
                <div className="row between">
                  <div>
                    <div className="muted">Renta mensual</div>
                    <div style={{ fontSize: 22, fontWeight: 700 }}>{fmtMonto(c.valor, c.moneda)}</div>
                    {c.moneda === "UF" && <div className="muted">≈ {fmtCLP(r.canonCLP)} (UF {fmtCLP(uf)})</div>}

                  <div style={{ textAlign: "right" }}>
                    <Badge estado={r.estado} />
                    <div className="muted" style={{ marginTop: 6 }}>{r.proxVenc ? `Próximo pago: ${fmtFecha(r.proxVenc)}` : ""}</div>
                  </div>
                </div>
                {r.deudas.length > 0 && (
                  <div style={{ marginTop: 10, paddingTop: 10, borderTop: `1px solid ${EST.atrasado.color}33` }}>
                    <div style={{ fontWeight: 700, color: "#B91C1C" }}>Deuda: {fmtCLP(r.deudaCLP)}</div>
                    {r.deudas.map(d => <div key={d.periodo} className="muted">{nombrePeriodo(d.periodo)} · {d.dias} días de atraso{d.multa ? ` · multa ${fmtMonto(d.multa, c.moneda)}` : ""}</div>)}
                  </div>
                )}
              </div>
            )}
            <div>
              <div className="h2">Datos de la propiedad</div>
              <dl className="kv">
                <dt>Tipo</dt><dd>{CATEGORIAS[u.categoria]}{p.tipo === "centro" ? ` en ${p.nombre}` : ""}</dd>
                <dt>Dirección</dt><dd>{p.direccion}, {p.comuna}</dd>
                {u.m2 ? <><dt>Superficie</dt><dd>{u.m2} m²</dd></> : null}
                {u.dormitorios ? <><dt>Dormitorios</dt><dd>{u.dormitorios}</dd></> : null}
                {u.banos ? <><dt>Baños</dt><dd>{u.banos}</dd></> : null}
                {u.estacionamientos ? <><dt>Estacionamientos</dt><dd>{u.estacionamientos}</dd></> : null}
                {p.rol && <><dt>Rol SII</dt><dd>{p.rol}</dd></>}
                <dt>Coordenadas</dt><dd className="mono" style={{ fontSize: 12 }}>{Number(p.lat).toFixed(5)}, {Number(p.lng).toFixed(5)}</dd>
                {!c && u.precioUF ? <><dt>Precio publicado</dt><dd>{fmtUF(u.precioUF)} ≈ {fmtCLP(u.precioUF * uf)}</dd></> : null}
                {u.descripcion && <><dt>Descripción</dt><dd>{u.descripcion}</dd></>}
              </dl>
            </div>
            {c && (
              <div>
                <div className="h2">Datos del arriendo</div>
                <dl className="kv">
                  <dt>Arrendatario</dt><dd>{a.nombre}</dd>
                  <dt>Vigencia</dt><dd>{fmtFecha(c.inicio)} al {fmtFecha(c.termino)} {r.diasTermino != null && r.diasTermino <= DIAS_AVISO_TERMINO && <span className="tag" style={{ background: C.warningBg, color: C.warning }}>{r.diasTermino < 0 ? "vencido" : `termina en ${r.diasTermino} días`}</span>}</dd>
                  <dt>Día de pago</dt><dd>{c.diaPago} de cada mes</dd>
                  <dt>Garantía</dt><dd>{c.garantia ? fmtMonto(c.garantia, c.moneda) : "—"}</dd>
                  <dt>Multa</dt><dd>{descripcionMulta(c)}</dd>
                </dl>
                <div className="card" style={{ marginTop: 10, padding: 12, background: c.multa?.cobrar ? C.warningBg : C.bg }}>
                  <div className="row between">
                    <span style={{ fontSize: 12.5 }}><b>Cobro de multa:</b> {c.multa?.cobrar ? "activo — se aplica automáticamente al vencer" : "desactivado"}</span>
                    {esDueno ? <button className="btn btn-ghost btn-sm" onClick={toggleMulta}>{c.multa?.cobrar ? "Desactivar" : "Activar"}</button> : <span className="muted">Lo decide el dueño</span>}
                  </div>
                </div>
              </div>

            <div>
              <div className="h2">Arrendador</div>
              <dl className="kv"><dt>Nombre</dt><dd>{arr.nombre}</dd>{arr.rut && <><dt>RUT</dt><dd>{arr.rut}</dd></>}</dl>
              <div style={{ marginTop: 8 }}><Contactar tel={arr.telefono} email={arr.email} compacto mensaje={`Hola ${arr.nombre || ""}, te escribo por la propiedad ${nombreUnidad(p, u)} (${p.direccion}).`} asunto={`Propiedad ${nombreUnidad(p, u)}`} /></div>
            </div>
            {c && esDueno && <button className="btn btn-danger btn-sm" style={{ justifySelf: "start" }} onClick={terminar}>Terminar contrato y dejar disponible</button>}
            {(u.historial || []).length > 0 && (
              <div><div className="h2">Contratos anteriores</div>
                {u.historial.map((h, i) => <div key={i} className="muted">{h.arrendatario?.nombre} · {fmtFecha(h.inicio)} al {fmtFecha(h.terminado || h.termino)} · {fmtMonto(h.valor, h.moneda)}</div>)}
              </div>
            )}
          </div>
        )}

        {tab === "arrendatario" && c && (
          <div className="grid" style={{ gap: 14 }}>
            <dl className="kv">
              <dt>Nombre</dt><dd>{a.nombre}</dd>
              <dt>RUT</dt><dd>{a.rut || "—"}</dd>
              <dt>Correo</dt><dd>{a.email || "—"}</dd>
              <dt>Teléfono</dt><dd>{a.telefono || "—"}</dd>
              <dt>Domicilio</dt><dd>{a.domicilio || "—"}</dd>
              {a.giro && <><dt>Giro</dt><dd>{a.giro}</dd></>}
              {a.representante && <><dt>Representante / aval</dt><dd>{a.representante}</dd></>}
            </dl>
            <div className="label">Contacto directo</div>
            <Contactar tel={a.telefono} email={a.email} mensaje={`Estimado/a ${a.nombre}, `} asunto={`Arriendo ${nombreUnidad(p, u)}`} />
            <button className="btn btn-ghost" style={{ justifySelf: "start" }} onClick={() => setModal({ t: "comunicar" })}>Usar plantilla (recordatorio, atraso, etc.)</button>
          </div>
        )}

        {tab === "pagos" && c && (
          <div className="grid" style={{ gap: 14 }}>
            {r.deudas.length > 0 && (
              <div className="card" style={{ background: EST.atrasado.bg, borderColor: "#FCA5A5", padding: 14 }}>
                <div className="row between">
                  <b style={{ color: "#B91C1C" }}>Pendiente: {fmtCLP(r.deudaCLP)}</b>
                  <button className="btn btn-ghost btn-sm" onClick={() => setModal({ t: "comunicar", plantilla: "atraso" })}>Enviar aviso de atraso</button>
                </div>
                {r.deudas.map(d => <div key={d.periodo} className="muted" style={{ marginTop: 4 }}>{nombrePeriodo(d.periodo)}: {fmtMonto(c.valor, c.moneda)} · venció {fmtFecha(d.venc)} ({d.dias} días){d.multa ? ` · multa ${fmtMonto(d.multa, c.moneda)}` : ""}</div>)}
              </div>
            )}
            {!(c.pagos || []).length ? <div className="empty">Sin pagos registrados.</div> : (
              <div className="table-wrap"><table>
                <thead><tr><th>Mes</th><th>Fecha</th><th className="num">Monto</th><th className="num">Multa</th><th>Medio</th>{esDueno && <th></th>}</tr></thead>
                <tbody>{[...c.pagos].sort((x, y) => y.periodo.localeCompare(x.periodo)).map(pg => (
                  <tr key={pg.id} title={`Registró: ${pg.registradoPor}${pg.obs ? " · " + pg.obs : ""}`}>
                    <td style={{ textTransform: "capitalize" }}>{nombrePeriodo(pg.periodo)}</td><td>{fmtFecha(pg.fecha)}</td>
                    <td className="num">{fmtCLP(pg.montoCLP)}</td><td className="num">{pg.multaCLP ? fmtCLP(pg.multaCLP) : "—"}</td><td>{pg.metodo}</td>
                    {esDueno && <td><button className="icon-btn" style={{ fontSize: 13 }} onClick={() => borrarPago(pg)}>🗑</button></td>}
                  </tr>))}
                </tbody></table></div>
            )}
          </div>
        )}

        {tab === "fotos" && (
          <Fotos fotos={u.fotos} editable={puede(user, "editar")} onChange={f => update(s => { s.propiedades.find(x => x.id === p.id).unidades.find(x => x.id === u.id).fotos = f; }, `Actualizó fotos de "${nombreUnidad(p, u)}"`)} />
        )}

        {tab === "interesados" && (
          interes.length ? <div className="grid" style={{ gap: 6 }}>{interes.map(x => (
            <div key={x.id} className="alert-row" style={{ cursor: "default" }}>
              <div style={{ flex: 1 }}><div style={{ fontWeight: 600 }}>{x.nombre || "Sin nombre"}</div><div className="muted">{fmtFecha(x.fecha)} · {x.canal} · {x.telefono} {x.email}{x.nota ? " · " + x.nota : ""}</div></div>
              <Contactar tel={x.telefono} email={x.email} compacto mensaje={`Hola ${x.nombre || ""}, te escribo por la propiedad ${nombreUnidad(p, u)}.`} asunto={`Propiedad ${nombreUnidad(p, u)}`} />
            </div>))}</div> : <div className="empty">Aún no se ha enviado esta propiedad a interesados.</div>
        )}

        {tab === "docs" && (
          <div className="grid" style={{ gap: 10 }}>
            <button className="btn btn-primary btn-sm" style={{ justifySelf: "start" }} onClick={() => setModal({ t: "doc" })}>+ Generar documento</button>
            {docs.length ? docs.map(d => (
              <div key={d.id} className="alert-row" onClick={() => setModal({ t: "doc", doc: d })}>
                <span>📄</span><div style={{ flex: 1 }}><div style={{ fontWeight: 600, fontSize: 13 }}>{d.titulo}</div><div className="muted">{fmtFecha(d.fecha)} · {d.autor}</div></div>
                <button className="btn btn-ghost btn-sm" onClick={e => { e.stopPropagation(); imprimirHTML(d.titulo, d.html); }}>PDF</button>
                <button className="btn btn-ghost btn-sm" onClick={e => { e.stopPropagation(); descargarWord(d.titulo, d.html); }}>Word</button>
              </div>)) : <div className="empty">Sin documentos generados.</div>}
          </div>
        )}
      </div>
    </div>
  );
}


// ─── DOCUMENTOS ───────────────────────────────────────────────────────────────
function DocumentoModal({ p, u, tipoInicial, onClose }) {
  const { st, hoy, uf, update, user, toast } = useApp();
  const [tipo, setTipo] = useState(tipoInicial || (u.contrato ? "anexo_renta" : "contrato_hab"));
  const [extra, setExtra] = useState({ nuevoValor: "", desde: toISO(hoy), nuevoTermino: "", texto: "", fechaTermino: toISO(hoy) });
  const [version, setVersion] = useState(0);
  const ref = useRef(null);
  const html = useMemo(() => generarDocumento(tipo, { st, p, u, extra, hoy, uf }), [tipo, extra, version]);
  useEffect(() => { if (ref.current) ref.current.innerHTML = html; }, [html]);
  const titulo = `${TIPOS_DOC[tipo]} - ${nombreUnidad(p, u)}`;
  const actual = () => ref.current ? ref.current.innerHTML : html;
  const guardar = () => {
    update(s => { s.documentos.unshift({ id: uid(), propId: p.id, unidadId: u.id, tipo, titulo, fecha: toISO(new Date()), autor: user.nombre, html: actual() }); }, `Generó "${titulo}"`);
    toast("Documento guardado en la ficha");
  };
  const necesitaContrato = !u.contrato && tipo !== "contrato_hab" && tipo !== "contrato_com";
  return (
    <Modal titulo="Generar contrato o anexo" onClose={onClose} ancho={920}
      pie={<>
        <button className="btn btn-ghost" onClick={() => imprimirHTML(titulo, actual())}>🖨️ Imprimir / PDF</button>
        <button className="btn btn-ghost" onClick={() => descargarWord(titulo, actual())}>⬇️ Word</button>
        <button className="btn btn-primary" onClick={guardar}>Guardar en la ficha</button>
      </>}>
      <div className="form-grid">
        <Campo label="Documento">
          <select className="select" value={tipo} onChange={e => setTipo(e.target.value)}>
            {Object.entries(TIPOS_DOC).map(([k, l]) => <option key={k} value={k}>{l}</option>)}
          </select>
        </Campo>
        {(tipo === "anexo_renta" || tipo === "anexo_prorroga") && <Campo label={`Nueva renta (${u.contrato?.moneda || "UF"})`}><input className="input" value={extra.nuevoValor} onChange={e => setExtra({ ...extra, nuevoValor: e.target.value })} /></Campo>}
        {tipo === "anexo_renta" && <Campo label="Vigente desde"><input className="input" type="date" value={extra.desde} onChange={e => setExtra({ ...extra, desde: e.target.value })} /></Campo>}
        {tipo === "anexo_prorroga" && <Campo label="Nuevo término"><input className="input" type="date" value={extra.nuevoTermino} onChange={e => setExtra({ ...extra, nuevoTermino: e.target.value })} /></Campo>}
        {tipo === "termino" && <Campo label="Fecha de término"><input className="input" type="date" value={extra.fechaTermino} onChange={e => setExtra({ ...extra, fechaTermino: e.target.value })} /></Campo>}
        {(tipo === "anexo_libre" || tipo === "entrega") && <Campo label={tipo === "entrega" ? "Estado del inmueble" : "Modificación acordada"} span><textarea className="input" rows={2} value={extra.texto} onChange={e => setExtra({ ...extra, texto: e.target.value })} /></Campo>}
      </div>
      {necesitaContrato && <div className="card" style={{ marginTop: 12, background: C.warningBg, padding: 12, fontSize: 12.5 }}>Esta unidad no tiene contrato registrado: los datos del arrendatario saldrán en blanco.</div>}
      <div className="row between" style={{ margin: "14px 0 8px" }}>
        <span className="muted">Puedes editar el texto directamente antes de imprimir o guardar.</span>
        <button className="btn btn-ghost btn-sm" onClick={() => setVersion(v => v + 1)}>Restablecer texto</button>
      </div>
      <div ref={ref} className="doc-editor" contentEditable suppressContentEditableWarning />
      <div className="muted" style={{ marginTop: 8 }}>⚖️ Borrador de referencia: revísalo con un abogado antes de firmar.</div>
    </Modal>
  );
}
