// ─── TOKENS ───────────────────────────────────────────────────────────────────

const DIAS_AVISO = 5;          // días antes del vencimiento en que pasa a "Por vencer"
const DIAS_AVISO_TERMINO = 60; // aviso de contrato por terminar

const css = `

  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

// ─── UTILIDADES ───────────────────────────────────────────────────────────────
const uid = () => crypto.randomUUID();
const pad = n => String(n).padStart(2, "0");
const toISO = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseISO = s => { if (!s) return null; const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const sinHora = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const diffDias = (a, b) => Math.round((sinHora(a) - sinHora(b)) / 86400000);
const periodoDe = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
const sumarMes = (p, n) => { const [y, m] = p.split("-").map(Number); const d = new Date(y, m - 1 + n, 1); return periodoDe(d); };
const vencimiento = (p, dia) => { const [y, m] = p.split("-").map(Number); const ult = new Date(y, m, 0).getDate(); return new Date(y, m - 1, Math.min(dia || 1, ult)); };
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const nombrePeriodo = p => { const [y, m] = p.split("-").map(Number); return `${MESES[m - 1]} ${y}`; };
const fmtFecha = d => { if (!d) return "—"; const x = typeof d === "string" ? parseISO(d) : d; return `${pad(x.getDate())}-${pad(x.getMonth() + 1)}-${x.getFullYear()}`; };
const fmtFechaLarga = d => { const x = typeof d === "string" ? parseISO(d) : d; return `${x.getDate()} de ${MESES[x.getMonth()]} de ${x.getFullYear()}`; };
const fmtCLP = n => "$" + Math.round(n || 0).toLocaleString("es-CL");
const fmtUF = n => (Number(n) || 0).toLocaleString("es-CL", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " UF";
const fmtMonto = (n, moneda) => moneda === "CLP" ? fmtCLP(n) : fmtUF(n);
const aCLP = (n, moneda, uf) => moneda === "CLP" ? Number(n) || 0 : (Number(n) || 0) * uf;
// IVA opcional sobre la renta (p. ej. locales comerciales). Las multas no llevan IVA.
const TASA_IVA = 0.19;
const conIVA = c => c && c.iva ? 1 + TASA_IVA : 1;
// Reajuste de la renta. c.reajuste = { tipo, pct, cadaMeses, primero, avisoDias }
//  · pct: sube un % fijo cada N meses (se calcula solo, desde el mes de inicio o desde "primero").
//  · ipc / uf: al llegar el mes, el corredor lo aplica con la variación del IPC (acumulada del período)
//    o de la UF; queda en c.reajustes (tabla reajustes) con los índices usados y rige desde ese mes.
// Contratos antiguos sin "tipo" con pct > 0 son de tipo pct.
const TIPOS_REAJUSTE = { "": "Sin reajuste", ipc: "IPC", uf: "Variación UF", pct: "Porcentaje fijo" };
const PERIODICIDADES = { 1: "Mensual", 3: "Trimestral", 6: "Semestral", 12: "Anual" };
const tipoReajuste = c => !c || !c.reajuste ? "" : c.reajuste.tipo || (Number(c.reajuste.pct) > 0 ? "pct" : "");
const reajusteActivo = c => { const t = tipoReajuste(c); return !!t && Number(c.reajuste.cadaMeses) > 0 && (t !== "pct" || Number(c.reajuste.pct) > 0) && !(t === "uf" && c.moneda === "UF"); };
const mesesEntre = (a, b) => { const [y1, m1] = a.split("-").map(Number), [y2, m2] = b.split("-").map(Number); return (y2 - y1) * 12 + m2 - m1; };
// Primer mes con reajuste: el indicado, o el inicio + periodicidad
const primerReajuste = c => { const ini = parseISO(c.inicio); return c.reajuste.primero || (ini ? sumarMes(periodoDe(ini), Number(c.reajuste.cadaMeses)) : null); };
const pasosReajuste = (c, periodo) => {
  if (!reajusteActivo(c) || tipoReajuste(c) !== "pct") return 0;
  const p1 = primerReajuste(c);
  return p1 && periodo >= p1 ? Math.floor(mesesEntre(p1, periodo) / Number(c.reajuste.cadaMeses)) + 1 : 0;
};
const redondearRenta = (v, moneda) => moneda === "CLP" ? Math.round(v) : Math.round(v * 100) / 100;
// Reajustes IPC/UF ya aplicados, del más antiguo al más nuevo
const aplicados = c => [...(c.reajustes || [])].sort((a, b) => a.desde.localeCompare(b.desde));
function rentaMes(c, periodo = periodoDe(new Date())) {
  const base = Number(c.valor) || 0;
  const ap = aplicados(c).filter(r => r.desde <= periodo).pop();
  if (tipoReajuste(c) === "pct") {
    // % fijo: se calcula solo; un anexo de renta fija una nueva base desde su mes y los pasos siguen después
    const n = pasosReajuste(c, periodo) - (ap ? pasosReajuste(c, ap.desde) : 0);
    const b = ap ? Number(ap.valorNuevo) : base;
    return n > 0 ? redondearRenta(b * Math.pow(1 + Number(c.reajuste.pct) / 100, n), c.moneda) : b;
  }
  return ap ? Number(ap.valorNuevo) : base;
}
// Próximo mes en que sube la renta (para IPC/UF: el siguiente al último aplicado; puede estar vencido)
function proximoReajuste(c, periodo = periodoDe(new Date())) {
  if (!reajusteActivo(c)) return null;
  const p1 = primerReajuste(c), n = Number(c.reajuste.cadaMeses);
  if (!p1) return null;
  if (tipoReajuste(c) === "pct") return sumarMes(p1, pasosReajuste(c, periodo) * n);
  const ult = aplicados(c).filter(r => !(r.detalle && r.detalle.anexo)).pop();
  return ult ? sumarMes(ult.desde, n) : p1;
}
// IPC/UF con el mes ya llegado y sin aplicar: los cobros siguen con la renta anterior hasta aplicarlo
const reajustePendiente = (c, periodo = periodoDe(new Date())) => { const p = reajusteActivo(c) && tipoReajuste(c) !== "pct" ? proximoReajuste(c, periodo) : null; return p && p <= periodo ? p : null; };
// Días que faltan para el reajuste (desde el día 1 del mes en que rige)

// Historial: los aplicados (IPC/UF) o los pasos ya ocurridos del % fijo
function historialReajustes(c, periodo = periodoDe(new Date())) {

  const anexos = aplicados(c).filter(r => r.desde <= periodo);
  const n = pasosReajuste(c, periodo), p1 = primerReajuste(c), r = [];
  for (let i = 1; i <= n; i++) {
    const desde = sumarMes(p1, (i - 1) * Number(c.reajuste.cadaMeses));
    if (!anexos.some(a => a.desde === desde)) r.push({ id: desde, desde, tipo: "pct", variacionPct: Number(c.reajuste.pct), valorAnterior: rentaMes(c, sumarMes(desde, -1)), valorNuevo: rentaMes(c, desde), detalle: { automatico: true } });

}

function reajusteAGuardar(c) {

// Índices para el reajuste (mindicador.cl, fuente Banco Central / INE)
async function indicadorMensual(codigo, anio) {
  const r = await fetch(`https://mindicador.cl/api/${codigo}/${anio}`);
  if (!r.ok) throw new Error("mindicador " + r.status);
  return ((await r.json()).serie || []).map(s => ({ periodo: s.fecha.slice(0, 7), fecha: s.fecha.slice(0, 10), valor: Number(s.valor) }));
}
// IPC: variación acumulada de los N meses anteriores al mes del reajuste. Si el último mes aún no se
// publica (el INE lo publica ~el día 8), se usan los N últimos publicados y se indica cuáles.
async function calcularIPC(desde, n) {
  const fin = sumarMes(desde, -1), ini = sumarMes(desde, -n - 3);
  const anios = [...new Set([ini.slice(0, 4), fin.slice(0, 4)])];
  const serie = (await Promise.all(anios.map(a => indicadorMensual("ipc", a)))).flat()
    .filter(s => s.periodo <= fin).sort((a, b) => a.periodo.localeCompare(b.periodo));
  const meses = serie.slice(-n);
  if (meses.length < n) throw new Error("No hay suficientes meses de IPC publicados");
  const variacion = (meses.reduce((t, m) => t * (1 + m.valor / 100), 1) - 1) * 100;
  return { variacionPct: Math.round(variacion * 10000) / 10000, detalle: { fuente: "mindicador.cl (INE)", meses: meses.map(m => ({ periodo: m.periodo, ipc: m.valor })), completo: meses[meses.length - 1].periodo === fin } };
}
// UF: valor del día 1 del mes del reajuste contra el día 1 de N meses antes
async function valorUF(fecha) {
  const [y, m, d] = fecha.split("-");
  const r = await fetch(`https://mindicador.cl/api/uf/${d}-${m}-${y}`);
  const s = r.ok && ((await r.json()).serie || [])[0];
  if (!s) throw new Error(`Sin valor UF para ${fecha}`);
  return Number(s.valor);
}
async function calcularUF(desde, n) {
  const f1 = `${sumarMes(desde, -n)}-01`, f2 = `${desde}-01`;
  const [u1, u2] = await Promise.all([valorUF(f1), valorUF(f2)]);
  return { variacionPct: Math.round((u2 / u1 - 1) * 1000000) / 10000, detalle: { fuente: "mindicador.cl (Banco Central)", ufInicio: { fecha: f1, valor: u1 }, ufFin: { fecha: f2, valor: u2 } } };
}
async function calcularReajuste(c, desde) {
  const n = Number(c.reajuste.cadaMeses), t = tipoReajuste(c);
  const r = t === "ipc" ? await calcularIPC(desde, n) : await calcularUF(desde, n);
  const anterior = rentaMes(c, sumarMes(desde, -1));

function comprimirImagen(file, max = 1200, calidad = 0.72) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onerror = rej;

      const img = new Image();
      img.onerror = rej;
      img.onload = () => {
        const s = Math.min(1, max / Math.max(img.width, img.height));
        const cv = document.createElement("canvas");
        cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
        cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);

// Limpia HTML de documentos y plantillas antes de mostrarlo o imprimirlo: solo etiquetas de texto y
// tablas, sin scripts, eventos (onerror, onclick…) ni enlaces javascript:. Evita que un documento
// guardado (o un respaldo importado) ejecute código con la sesión de quien lo abre.
const HTML_PERMITIDO = new Set(["P", "BR", "B", "STRONG", "I", "EM", "U", "S", "H1", "H2", "H3", "H4", "UL", "OL", "LI", "TABLE", "THEAD", "TBODY", "TFOOT", "TR", "TD", "TH",
  "DIV", "SPAN", "IMG", "A", "HR", "BLOCKQUOTE", "SMALL", "SUP", "SUB", "FONT", "CENTER", "SECTION"]);
const ATRIB_PERMITIDOS = new Set(["style", "src", "href", "alt", "colspan", "rowspan", "align", "width", "height", "border", "cellpadding", "cellspacing", "class", "color", "size", "face"]);
function urlSegura(u, img) {
  const s = String(u || "").trim();
  if (img && /^privado:[0-9a-f-]{36}\/[0-9a-f-]{36}\.jpg$/i.test(s)) return true;
  return /^https:\/\//i.test(s) || (img && /^data:image\/(png|jpe?g|webp|gif);base64,[a-z0-9+/=\s]+$/i.test(s)) || /^(mailto:|tel:|#)/i.test(s) && !img;
}
function limpiarHTML(html) {
  const doc = new DOMParser().parseFromString(`<div>${html || ""}</div>`, "text/html");
  const raiz = doc.body.firstChild;
  const limpiar = nodo => [...nodo.childNodes].forEach(n => {
    if (n.nodeType === 3) return;
    if (n.nodeType !== 1 || !HTML_PERMITIDO.has(n.tagName)) {
      // etiquetas peligrosas se eliminan con su contenido; las desconocidas dejan solo su texto
      if (n.nodeType === 1 && !["SCRIPT", "STYLE", "IFRAME", "OBJECT", "EMBED", "SVG", "MATH", "TEMPLATE", "LINK", "META", "BASE", "FORM", "INPUT", "BUTTON", "TEXTAREA", "SELECT"].includes(n.tagName)) { limpiar(n); n.replaceWith(...n.childNodes); }
      else n.remove();
      return;
    }
    [...n.attributes].forEach(a => {
      const nom = a.name.toLowerCase();
      if (!ATRIB_PERMITIDOS.has(nom)) n.removeAttribute(a.name);
      else if ((nom === "src" || nom === "href") && !urlSegura(a.value, nom === "src")) n.removeAttribute(a.name);
      else if (nom === "src" && a.value.startsWith("privado:")) n.setAttribute("src", urlFoto(a.value) || "");
      else if (nom === "style" && /(expression|url\s*\(|javascript:|@import|behavior)/i.test(a.value)) n.removeAttribute(a.name);
    });
    if (n.tagName === "A") { n.setAttribute("rel", "noopener noreferrer"); n.setAttribute("target", "_blank"); }
    limpiar(n);
  });
  limpiar(raiz);
  return raiz.innerHTML;
}

const TABLAS = ["empresas", "propietarios", "propietarios_banco", "propiedades", "unidades", "contratos", "reajustes", "pagos", "abonos", "documentos", "interesados"];
async function sincronizar(prev, next, E) {
  const a = filas(prev, E), b = filas(next, E);
  const creadas = [];
  try {
    await escribir(a, b, creadas);
  } catch (e) {
    // Sin transacción entre tablas: si algo falla a mitad, se deshace lo recién creado (más nuevo primero)
    for (const [t, ids] of creadas.reverse()) await sb.from(t).delete().in("id", ids);
    throw e;
  }
}
async function escribir(a, b, creadas) {
  for (const t of TABLAS) {
    const nuevas = [], cambiadas = [];
    for (const r of b[t].values()) {
      const antes = a[t].get(r.id);
      if (!antes) nuevas.push(r);
      else if (JSON.stringify(antes) !== JSON.stringify(r)) cambiadas.push(r);
    }
    // Fila por fila y no con upsert: un upsert dispara el límite de unidades del plan aunque sea una edición.
    // Un contrato que termina se guarda antes que el nuevo vigente de la misma unidad.
    if (t === "contratos") cambiadas.sort((x, y) => Number(x.vigente) - Number(y.vigente));
    for (const r of cambiadas) await q(sb.from(t).update(r).eq("id", r.id));
    const lote = t === "unidades" ? 10 : 100; // las unidades llevan fotos
    for (let i = 0; i < nuevas.length; i += lote) {
      const parte = nuevas.slice(i, i + lote);
      await q(sb.from(t).insert(parte));
      creadas.push([t, parte.map(r => r.id)]);
    }
  }
  for (const t of [...TABLAS].reverse()) {
    const borrar = [...a[t].keys()].filter(id => !b[t].has(id));
    if (borrar.length) await q(sb.from(t).delete().in("id", borrar));
  }
}

function leerDatosDelNavegador() {
  return new Promise(res => {

      r.onupgradeneeded = () => r.result.createObjectStore("kv");
      r.onerror = () => res(null);
      r.onsuccess = () => {
        try {
          const g = r.result.transaction("kv").objectStore("kv").get("estado");
          g.onsuccess = () => res(g.result || null); g.onerror = () => res(null);
        } catch { res(null); }
      };
    } catch { res(null); }
  });
}

// ─── LÓGICA DE COBRO ──────────────────────────────────────────────────────────
// Primer mes que se cobra: el del inicio, o el siguiente si el día de pago ya pasó al firmar
function primerPeriodo(c) {
  const ini = parseISO(c.inicio);
  if (!ini) return null;
  const p = periodoDe(ini);
  return vencimiento(p, c.diaPago) < ini ? sumarMes(p, 1) : p;
}

function periodosContrato(c, hoy) {
  let p = primerPeriodo(c);
  if (!p) return [];
  // contratos que ya venían corriendo: los meses hasta "al día hasta" se dan por pagados
  if (c.alDiaHasta && sumarMes(c.alDiaHasta, 1) > p) p = sumarMes(c.alDiaHasta, 1);
  const fin = c.termino ? periodoDe(parseISO(c.termino)) : null;
  const actual = periodoDe(hoy);
  const out = [];
  while (p <= actual && (!fin || p <= fin) && out.length < 600) { out.push(p); p = sumarMes(p, 1); }
  return out;
}

// La multa se calcula en la moneda del contrato y solo si el arrendador decidió cobrarla.
// Superados los días de gracia se cuentan los días desde el vencimiento, o solo los posteriores a la
// gracia si el contrato lo indica (desdeGracia; los contratos nuevos lo traen activado).
function calcMulta(c, diasAtraso, periodo) {
  const m = c.multa || {};
  if (!m.cobrar || diasAtraso <= 0) return 0;
  if ((c.multasCondonadas || {})[periodo]) return 0;
  if (diasAtraso <= (Number(m.diasGracia) || 0)) return 0;
  const monto = Number(m.monto) || 0, valor = rentaMes(c, periodo);
  const dias = m.desdeGracia ? diasAtraso - (Number(m.diasGracia) || 0) : diasAtraso;
  let x = 0;
  if (m.tipo === "diaria") x = monto * dias;
  else if (m.tipo === "diaria_pct") x = valor * monto / 100 * dias;
  else if (m.tipo === "fija") x = monto;
  else if (m.tipo === "pct") x = valor * monto / 100;
  const tope = Number(m.tope) || 0;
  return tope > 0 ? Math.min(x, tope) : x;
}

function descripcionMulta(c) {
  const m = c.multa || {};
  if (!m.cobrar) return "No se cobra multa";
  const u = c.moneda === "CLP" ? "$" : "UF";
  const monto = c.moneda === "CLP" ? fmtCLP(m.monto) : `${m.monto} UF`;
  const base = {
    diaria: `${monto} por cada día de atraso`,
    diaria_pct: `${m.monto}% de la renta por cada día de atraso`,
    fija: `${monto} fija por mes atrasado`,
    pct: `${m.monto}% de la renta por mes atrasado`,
  }[m.tipo] || "";
  const gracia = Number(m.diasGracia) ? (m.desdeGracia || !m.tipo.startsWith("diaria") ? `, después de ${m.diasGracia} días de gracia` : `, si el atraso supera ${m.diasGracia} días de gracia (contando todos los días desde el vencimiento)`) : "";
  return base + gracia + (Number(m.tope) ? ` (tope ${c.moneda === "CLP" ? fmtCLP(m.tope) : m.tope + " " + u})` : "");
}

// Abonos: pagos parciales de un mes. Se llevan a la moneda del contrato (UF al valor del día del abono)
// y cubren primero la renta del mes (IVA incluido) y luego la multa por atraso, si se cobra.
const totalMes = (c, periodo) => rentaMes(c, periodo) * conIVA(c);
const abonadoMes = (c, periodo) => (c.abonos || []).filter(a => a.periodo === periodo)
  .reduce((t, a) => t + (c.moneda === "CLP" ? a.montoCLP : a.montoCLP / (Number(a.ufDia) || 1)), 0);
const saldoMes = (c, periodo) => Math.max(0, totalMes(c, periodo) - abonadoMes(c, periodo));
const abonadoMesCLP = (c, periodo) => (c.abonos || []).filter(a => a.periodo === periodo).reduce((t, a) => t + a.montoCLP, 0);
// Multa que queda por pagar después de cubrir la renta con abonos
const multaPendiente = (c, periodo, multa) => Math.max(0, multa - Math.max(0, abonadoMes(c, periodo) - totalMes(c, periodo)));
// Meses pagados: con un pago registrado, o cuando los abonos cubren la renta y la multa
// calculada a la fecha del último abono (tolerancia de redondeo de 0,1%)
function mesesPagados(c) {
  const set = new Set((c.pagos || []).map(p => p.periodo));
  new Set((c.abonos || []).map(a => a.periodo)).forEach(p => {
    const ultimo = (c.abonos || []).filter(a => a.periodo === p).map(a => a.fecha).sort().pop();
    const multa = calcMulta(c, diffDias(parseISO(ultimo), vencimiento(p, c.diaPago)), p);
    if (abonadoMes(c, p) >= (totalMes(c, p) + multa) * 0.999) set.add(p);
  });
  return set;
}

function calcUnidad(u, hoy, uf) {
  const c = u.contrato;
  if (!c) return { estado: "libre", deudas: [], canonCLP: 0, multa: 0, deudaCLP: 0 };
  const pers = periodosContrato(c, hoy);
  const pagados = mesesPagados(c);
  const deudas = [];
  pers.forEach(p => {
    if (pagados.has(p)) return;
    const v = vencimiento(p, c.diaPago);
    const dias = diffDias(hoy, v);
    if (dias > 0) deudas.push({ periodo: p, venc: v, dias, multa: multaPendiente(c, p, calcMulta(c, dias, p)), saldo: saldoMes(c, p), abonadoCLP: abonadoMesCLP(c, p) });
  });
  const actual = periodoDe(hoy);
  const vAct = vencimiento(actual, c.diaPago);
  let estado, proxVenc = null;
  const desde = primerPeriodo(c);
  // Primer mes sin pagar desde p (los pagos pueden ir adelantados)
  const siguienteImpago = p => { for (let k = 0; pagados.has(p) && k < 240; k++) p = sumarMes(p, 1); return p; };
  if (deudas.length) estado = "atrasado";
  else if (!pers.includes(actual)) {
    // Aún no empieza a cobrarse (o ya terminó): "pagado" si el primer mes ya está pagado
    estado = desde && pagados.has(desde) ? "pagado" : "pendiente";
    proxVenc = vencimiento(siguienteImpago(desde && desde > actual ? desde : sumarMes(actual, 1)), c.diaPago);
  } else if (pagados.has(actual)) {
    estado = "pagado";
    proxVenc = vencimiento(siguienteImpago(sumarMes(actual, 1)), c.diaPago);
  } else {
    const d = diffDias(vAct, hoy);
    estado = d === 0 ? "hoy" : d <= DIAS_AVISO ? "proximo" : "pendiente";
    proxVenc = vAct;
  }
  if (proxVenc && c.termino && periodoDe(proxVenc) > periodoDe(parseISO(c.termino))) proxVenc = null;
  const canonCLP = aCLP(rentaMes(c, actual), c.moneda, uf) * conIVA(c);
  const multa = deudas.reduce((s, d) => s + d.multa, 0);
  // redondeado mes a mes, igual que al registrar cada pago (evita diferencias de $1)
  const deudaCLP = deudas.reduce((t, d) => t + Math.round(aCLP(d.saldo, c.moneda, uf)) + Math.round(aCLP(d.multa, c.moneda, uf)), 0);
  const diasTermino = c.termino ? diffDias(parseISO(c.termino), hoy) : null;
  // Abonos en meses que aún no quedan pagados (para mostrarlos en cobranza)
  const abonosPendCLP = (c.abonos || []).filter(a => !pagados.has(a.periodo)).reduce((t, a) => t + a.montoCLP, 0);
  // Lo que falta para completar los meses con abonos (renta, a la UF de hoy)
  const faltaAbonadosCLP = [...new Set((c.abonos || []).filter(a => !pagados.has(a.periodo)).map(a => a.periodo))]
    .reduce((t, p) => t + aCLP(saldoMes(c, p), c.moneda, uf), 0);
  return { faltaAbonadosCLP, estado, deudas, proxVenc, canonCLP, multa, deudaCLP, diasTermino, periodoActivo: pers.includes(actual), pagados, abonosPendCLP };
}

function calcPropiedad(p, hoy, uf) {
  const us = p.unidades.map(u => ({ u, r: calcUnidad(u, hoy, uf) }));
  const ocupadas = us.filter(x => x.u.contrato);
  const peor = ocupadas.length ? ocupadas.reduce((a, b) => EST[a.r.estado].ord <= EST[b.r.estado].ord ? a : b).r.estado : "libre";
  const cuenta = {};
  us.forEach(x => { cuenta[x.r.estado] = (cuenta[x.r.estado] || 0) + 1; });
  return { us, estado: peor, ocupadas: ocupadas.length, libres: us.length - ocupadas.length, cuenta,
    canonCLP: us.reduce((s, x) => s + x.r.canonCLP, 0), deudaCLP: us.reduce((s, x) => s + x.r.deudaCLP, 0) };
}

// Todas las unidades arrendables en una lista plana
function listarUnidades(st) {
  const out = [];
  st.propiedades.forEach(p => p.unidades.forEach(u => out.push({ p, u })));
  return out;
}
const nombreUnidad = (p, u) => p.tipo === "centro" ? `${p.nombre} · ${u.nombre}` : p.nombre;

function resumenFinanciero(st, hoy, uf) {
  const actual = periodoDe(hoy);
  let esperado = 0, cobrado = 0, porCobrar = 0, morosidad = 0, multas = 0, ocupadas = 0, total = 0, rentasCobradas = 0;
  const pagosMes = [], porMes = {};
  for (let i = 5; i >= 0; i--) porMes[sumarMes(actual, -i)] = 0;
  listarUnidades(st).forEach(({ p, u }) => {
    total++;
    const c = u.contrato;
    const contratos = [...(u.historial || []), ...(c ? [c] : [])];
    const todos = contratos.flatMap(k => [...(k.pagos || []), ...(k.abonos || []).map(a => ({ ...a, esAbono: true }))]);
    todos.forEach(pg => {
      const mes = pg.fecha.slice(0, 7);
      const m = (pg.montoCLP || 0) + (pg.multaCLP || 0);
      if (mes in porMes) porMes[mes] += m;
      if (mes === actual) { cobrado += m; pagosMes.push({ ...pg, p, u }); }
    });
    if (!c) return;
    ocupadas++;
    const r = calcUnidad(u, hoy, uf);
    if (r.periodoActivo) {
      // rentas del mes: lo ya cobrado de ese mes (a la UF del día de pago) + lo que falta (a la UF de hoy)
      const pagadoMes = (c.pagos || []).filter(pg => pg.periodo === actual).reduce((t, pg) => t + (pg.montoCLP || 0), 0)
        + (c.abonos || []).filter(a => a.periodo === actual).reduce((t, a) => t + a.montoCLP, 0);
      const falta = r.pagados.has(actual) ? 0 : Math.round(aCLP(saldoMes(c, actual), c.moneda, uf));
      rentasCobradas += pagadoMes; porCobrar += falta; esperado += pagadoMes + falta;
    }
    morosidad += r.deudaCLP;
    multas += aCLP(r.multa, c.moneda, uf);
  });
  pagosMes.sort((a, b) => (b.registrado || 0) - (a.registrado || 0));
  return { esperado, cobrado, rentasCobradas, porCobrar, morosidad, multas, ocupadas, total, libres: total - ocupadas, pagosMes, porMes };
}

  }

  if (reajusteActivo(c)) {

const puede = (user, accion) => !!user && !user.soloLectura && (esAdminEmp(user) || PERMISOS_CORREDOR.includes(accion));

// Arrendador de una propiedad: su propietario, el arrendador escrito a mano o la propia empresa
function arrendadorDe(st, p) {
  const pr = p.propietarioId && (st.propietarios || []).find(x => x.id === p.propietarioId);
  if (pr) return { nombre: pr.nombre, rut: pr.rut, domicilio: pr.domicilio, email: pr.email, telefono: pr.telefono, representante: pr.representante, rutRep: pr.rutRep };

function Modal({ titulo, onClose, children, pie, ancho }) {

    const f = e => { if (e.key !== "Escape" || e.defaultPrevented) return; const todas = document.querySelectorAll(".overlay"); if (todas[todas.length - 1] === ref.current) { e.preventDefault(); onClose(); } };
    window.addEventListener("keydown", f, true); return () => window.removeEventListener("keydown", f, true);
  }, [onClose]);
  return ReactDOM.createPortal(
    <div ref={ref} className="overlay" onMouseDown={e => e.target === e.currentTarget && onClose()}>
      <div className="modal" style={ancho ? { maxWidth: ancho } : null}>

function tooltipHTML(p, cp, uf) {
  const e = EST[cp.estado];
  let h = `<b>${ICONO[p.tipo === "centro" ? "centro" : p.unidades[0]?.categoria] || "📍"} ${esc(p.nombre)}</b><div class="muted" style="margin:2px 0 6px">${esc(p.direccion)}${p.comuna ? ", " + esc(p.comuna) : ""}</div>`;
  h += `<div class="r"><span>Estado</span><span style="color:${e.color};font-weight:700">${e.label}</span></div>`;
  if (p.tipo === "centro") {
    h += `<div class="r"><span>Locales</span><span>${p.unidades.length} (${cp.ocupadas} ocupados · ${cp.libres} libres)</span></div>`;
    Object.entries(cp.cuenta).sort((a, b) => EST[a[0]].ord - EST[b[0]].ord).forEach(([k, n]) => { h += `<div class="r"><span>· ${EST[k].label}</span><span>${n}</span></div>`; });
    if (cp.canonCLP) {
      // Suma en UF solo si todos los locales ocupados arriendan en UF; si hay alguno en pesos, solo el total en pesos
      const cs = cp.us.filter(x => x.u.contrato).map(x => x.u.contrato);
      const todoUF = cs.every(c => c.moneda !== "CLP" && !c.iva);
      const totalUF = cs.reduce((t, c) => t + rentaMes(c), 0);
      h += `<div class="r"><span>Renta mensual</span><span>${todoUF ? fmtUF(totalUF) + " · " : ""}${fmtCLP(cp.canonCLP)}</span></div>`;
    }
  } else {
    const { u, r } = cp.us[0] || {};
    if (u && u.contrato) {
      const c = u.contrato;
      h += `<div class="r"><span>Arrendatario</span><span>${esc(c.arrendatario?.nombre || "—")}</span></div>`;
      h += `<div class="r"><span>Renta mensual</span><span>${c.moneda === "CLP" ? "" : fmtUF(rentaMes(c)) + (c.iva ? " + IVA" : "") + " · "}${fmtCLP(r.canonCLP)}</span></div>`;
      h += `<div class="r"><span>Día de pago</span><span>${c.diaPago} de cada mes</span></div>`;
      if (r.proxVenc) h += `<div class="r"><span>Próximo venc.</span><span>${fmtFecha(r.proxVenc)}</span></div>`;
    } else if (u) {
      h += `<div class="r"><span>Tipo</span><span>${CATEGORIAS[u.categoria] || "—"}</span></div>`;
      if (u.m2) h += `<div class="r"><span>Superficie</span><span>${u.m2} m²</span></div>`;
      if (u.precioUF) h += `<div class="r"><span>Precio publicado</span><span>${fmtUF(u.precioUF)}</span></div>`;
    }
  }
  if (cp.deudaCLP) h += `<div class="r"><span>Deuda</span><span style="color:#DC2626;font-weight:700">${fmtCLP(cp.deudaCLP)}</span></div>`;
  h += `<div class="muted" style="margin-top:6px">Clic para abrir la ficha</div>`;
  return h;
}

function MapaBase({ puntos, onSelect, alto = 520, tooltips = true, elegir, onElegir, posicion, ajustar = true }) {
  const ref = useRef(null), mapa = useRef(null), capa = useRef(null), marcaElegida = useRef(null);
  const selRef = useRef(onSelect); selRef.current = onSelect;
  const eligeRef = useRef(onElegir); eligeRef.current = onElegir;
  const ajustado = useRef(false);

  useEffect(() => {
    const m = L.map(ref.current, { zoomControl: true, scrollWheelZoom: true }).setView([-33.45, -70.62], 11);
    const calles = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap" }).addTo(m);
    const sat = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", { maxZoom: 19, attribution: "© Esri" });
    L.control.layers({ "Mapa": calles, "Satélite": sat }, null, { position: "topright" }).addTo(m);
    capa.current = L.layerGroup().addTo(m);
    m.on("click", e => eligeRef.current && eligeRef.current(e.latlng));
    mapa.current = m;
    const ro = new ResizeObserver(() => m.invalidateSize());
    ro.observe(ref.current);
    // detener animaciones antes de quitar el mapa (evita el error _leaflet_pos al cambiar de vista a mitad de un zoom)
    return () => { ro.disconnect(); m.stop(); m.off(); m.remove(); };
  }, []);

  useEffect(() => {
    const m = mapa.current, g = capa.current;
    if (!m || !puntos) return;
    g.clearLayers();
    puntos.forEach(pt => {
      const e = EST[pt.estado];
      const alerta = pt.estado === "atrasado" || pt.estado === "hoy";
      const icon = L.divIcon({ className: "", iconSize: pt.centro ? [36, 36] : [30, 30], iconAnchor: pt.centro ? [18, 18] : [15, 15],
        html: `<div class="pin ${pt.centro ? "centro" : ""} ${alerta ? "alerta" : ""}" style="--c:${e.color}">${pt.etiqueta || ""}</div>` });
      const mk = L.marker([pt.lat, pt.lng], { icon, riseOnHover: true });
      if (tooltips && pt.tooltip) mk.bindTooltip(pt.tooltip, { direction: "auto", offset: [pt.centro ? 14 : 12, 0], className: "tt", opacity: 1 });
      mk.on("click", () => selRef.current && selRef.current(pt.id));
      mk.addTo(g);
    });
    if (ajustar && !ajustado.current && puntos.length) {
      ajustado.current = true;
      m.fitBounds(L.latLngBounds(puntos.map(p => [p.lat, p.lng])).pad(0.2), { maxZoom: 15, animate: false });
    }
  }, [puntos]);

  useEffect(() => {
    const m = mapa.current;
    if (!m || !elegir) return;
    if (marcaElegida.current) { m.removeLayer(marcaElegida.current); marcaElegida.current = null; }
    if (posicion && posicion.lat != null && posicion.lng != null && !isNaN(posicion.lat)) {
      const mk = L.marker([posicion.lat, posicion.lng], { draggable: true }).addTo(m);
      mk.on("dragend", () => { const ll = mk.getLatLng(); eligeRef.current && eligeRef.current(ll); });
      marcaElegida.current = mk;
      if (!m.getBounds().contains([posicion.lat, posicion.lng])) m.setView([posicion.lat, posicion.lng], 16);
    }
  }, [posicion && posicion.lat, posicion && posicion.lng, elegir]);

  useEffect(() => { if (elegir && posicion && posicion.centrar) mapa.current.setView([posicion.lat, posicion.lng], 17); }, [posicion && posicion.centrar]);

  return <div ref={ref} className="map" style={{ height: alto, cursor: elegir ? "crosshair" : undefined }} />;
}

// soloLibres: pinta en morado y cuenta solo los locales desocupados
function usePuntos(propiedades, filtro, soloLibres = false) {
  const { hoy, uf } = useApp();
  return useMemo(() => propiedades.filter(p => p.lat != null && p.lng != null).map(p => {
    const cp = calcPropiedad(p, hoy, uf);
    return { id: p.id, lat: Number(p.lat), lng: Number(p.lng), estado: soloLibres ? "libre" : cp.estado, centro: p.tipo === "centro",
      etiqueta: p.tipo === "centro" ? (soloLibres ? cp.libres : p.unidades.length) : "", tooltip: tooltipHTML(p, cp, uf), cp, p };
  }).filter(pt => !filtro || filtro(pt)), [propiedades, hoy, uf, filtro, soloLibres]);
}

const urlRetorno = () => location.href.split("#")[0];

function Acceso() {
  const [modo, setModo] = useState("entrar");
  const [f, setF] = useState({ nombre: "", email: "", clave: "", clave2: "" });
  const [msg, setMsg] = useState({ error: "", ok: "" });
  const [enviando, setEnviando] = useState(false);
  const set = (k, v) => setF(x => ({ ...x, [k]: v }));

  const enviar = async e => {
    e.preventDefault(); setMsg({ error: "", ok: "" });
    const email = f.email.trim().toLowerCase();
    if (!email) return setMsg({ error: "Ingresa tu correo." });
    setEnviando(true);
    try {
      if (modo === "entrar") {
        await q(sb.auth.signInWithPassword({ email, password: f.clave }));
      } else if (modo === "registro") {
        if (!f.nombre.trim()) throw new Error("Ingresa tu nombre.");
        if (f.clave.length < 8) throw new Error("La clave debe tener al menos 8 caracteres.");
        if (f.clave !== f.clave2) throw new Error("Las claves no coinciden.");
        const r = await q(sb.auth.signUp({ email, password: f.clave, options: { data: { nombre: f.nombre.trim() }, emailRedirectTo: urlRetorno() } }));
        if (!r.session) setMsg({ ok: "Te enviamos un correo para confirmar tu cuenta. Ábrelo y luego ingresa con tu clave." });
      } else {
        await q(sb.auth.resetPasswordForEmail(email, { redirectTo: urlRetorno() }));
        setMsg({ ok: "Si el correo tiene cuenta, te llegará un enlace para crear una clave nueva." });
      }
    } catch (err) { setMsg({ error: mensajeError(err) }); }
    setEnviando(false);
  };

  const titulos = { entrar: "Ingresa con tu cuenta", registro: "Crea tu cuenta (14 días gratis)", recuperar: "Recupera tu clave" };
  return (
    <PantallaCentrada>
      <div className="muted" style={{ marginBottom: 20 }}>{titulos[modo]}</div>
      <form onSubmit={enviar} className="grid" style={{ gap: 12 }}>
        {modo === "registro" && <Campo label="Tu nombre"><input className="input" value={f.nombre} onChange={e => set("nombre", e.target.value)} autoComplete="name" /></Campo>}
        <Campo label="Correo"><input className="input" type="email" value={f.email} onChange={e => set("email", e.target.value)} autoComplete="email" autoFocus /></Campo>
        {modo !== "recuperar" && <Campo label="Clave"><input className="input" type="password" value={f.clave} onChange={e => set("clave", e.target.value)} autoComplete={modo === "registro" ? "new-password" : "current-password"} /></Campo>}
        {modo === "registro" && <Campo label="Repetir clave"><input className="input" type="password" value={f.clave2} onChange={e => set("clave2", e.target.value)} autoComplete="new-password" /></Campo>}
        {msg.error && <div style={{ color: "#B91C1C", fontSize: 12.5 }}>{msg.error}</div>}
        {msg.ok && <div style={{ color: C.success, fontSize: 12.5 }}>{msg.ok}</div>}
        <button className="btn btn-primary" style={{ justifyContent: "center", padding: 11 }} disabled={enviando}>
          {enviando ? "Un momento…" : modo === "entrar" ? "Ingresar" : modo === "registro" ? "Crear cuenta" : "Enviar enlace"}
        </button>
      </form>
      <div className="row between" style={{ marginTop: 16, fontSize: 12.5 }}>
        {modo !== "entrar" ? <a href="#" onClick={e => { e.preventDefault(); setModo("entrar"); setMsg({}); }}>‹ Ya tengo cuenta</a>
          : <a href="#" onClick={e => { e.preventDefault(); setModo("registro"); setMsg({}); }}>Crear cuenta nueva</a>}
        {modo === "entrar" && <a href="#" onClick={e => { e.preventDefault(); setModo("recuperar"); setMsg({}); }}>Olvidé mi clave</a>}
      </div>
      {modo === "registro" && <div className="muted" style={{ marginTop: 14 }}>Si te invitaron a una empresa, regístrate con el mismo correo de la invitación.</div>}
    </PantallaCentrada>
  );
}

function NuevaClave({ onListo }) {
  const [clave, setClave] = useState("");
  const [clave2, setClave2] = useState("");
  const [error, setError] = useState("");
  const guardar = async e => {
    e.preventDefault();
    if (clave.length < 8) return setError("La clave debe tener al menos 8 caracteres.");
    if (clave !== clave2) return setError("Las claves no coinciden.");
    try { await q(sb.auth.updateUser({ password: clave })); onListo(); } catch (err) { setError(mensajeError(err)); }
  };
  return (
    <PantallaCentrada>
      <div className="muted" style={{ marginBottom: 20 }}>Crea tu clave nueva</div>
      <form onSubmit={guardar} className="grid" style={{ gap: 12 }}>
        <Campo label="Clave nueva"><input className="input" type="password" value={clave} onChange={e => setClave(e.target.value)} autoComplete="new-password" autoFocus /></Campo>
        <Campo label="Repetir clave nueva"><input className="input" type="password" value={clave2} onChange={e => setClave2(e.target.value)} autoComplete="new-password" /></Campo>
        {error && <div style={{ color: "#B91C1C", fontSize: 12.5 }}>{error}</div>}
        <button className="btn btn-primary" style={{ justifyContent: "center", padding: 11 }}>Guardar clave</button>
      </form>
    </PantallaCentrada>
  );
}

            </div>

          <Campo label="Tu nombre"><input className="input" value={f.nombre} onChange={e => setF({ ...f, nombre: e.target.value })} /></Campo>

          <div className="muted">¿Te invitaron a una empresa? No crees una nueva: pide a su administrador que te invite con este correo ({sesionSb.user.email}) y vuelve a ingresar.</div>
        </form>
      )}
      <button className="btn btn-ghost btn-sm" style={{ marginTop: 16 }} onClick={() => sb.auth.signOut()}>↩ Cerrar sesión</button>
    </PantallaCentrada>
  );
}

function GraficoIngresos({ porMes }) {
  const ent = Object.entries(porMes);
  const max = Math.max(1, ...ent.map(e => e[1]));
  return (
    <div style={{ display: "flex", alignItems: "flex-end", gap: 10, height: 170, paddingTop: 10 }}>
      {ent.map(([mes, v], i) => (
        <div key={mes} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 6, height: "100%", justifyContent: "flex-end" }}>
          <div className="mono" style={{ fontSize: 10, color: C.textDim }}>{v ? (v / 1e6).toFixed(1) + "M" : "0"}</div>
          <div style={{ width: "100%", maxWidth: 46, height: `${Math.max(2, v / max * 120)}px`, borderRadius: "6px 6px 2px 2px", background: i === ent.length - 1 ? `linear-gradient(180deg,${C.blueLight},${C.blue})` : C.mutedLight, transition: "height .5s" }} title={fmtCLP(v)} />
          <div style={{ fontSize: 10.5, color: C.textDim }}>{MESES[Number(mes.slice(5)) - 1].slice(0, 3)}</div>
        </div>
      ))}
    </div>
  );
}

function Dona({ ocupadas, libres }) {
  const t = ocupadas + libres || 1, r = 42, cfr = 2 * Math.PI * r, f = ocupadas / t;
  return (
    <svg width="120" height="120" viewBox="0 0 120 120">
      <circle cx="60" cy="60" r={r} fill="none" stroke={EST.libre.color} strokeWidth="16" opacity=".85" />
      <circle cx="60" cy="60" r={r} fill="none" stroke={C.blueLight} strokeWidth="16" strokeDasharray={`${cfr * f} ${cfr}`} transform="rotate(-90 60 60)" />
      <text x="60" y="58" textAnchor="middle" fontSize="20" fontWeight="700" fill={C.text}>{Math.round(f * 100)}%</text>
      <text x="60" y="76" textAnchor="middle" fontSize="10" fill={C.textDim}>ocupación</text>
    </svg>
  );
}

// Contactos que llegaron desde la página web y aún no se revisan (se marcan vistos al abrir Desocupadas)
const claveVistos = st => "qipo-web-visto-" + st.empresa.id;
const contactosWebNuevos = st => { const visto = local.get(claveVistos(st)) || ""; return st.interesados.filter(x => x.canal === "Sitio web" && (x.creado || x.fecha) > visto); };

function Alertas() {
  const { st, hoy, uf, abrirFicha } = useApp();
  const items = [];
  contactosWebNuevos(st).forEach(x => {
    const p = st.propiedades.find(y => y.id === x.propId), u = p && p.unidades.find(y => y.id === x.unidadId);
    if (p && u) items.push({ p, u, ord: 0.5, web: true, txt: `${x.nombre}${x.telefono ? " · " + x.telefono : ""}${x.email ? " · " + x.email : ""} pidió información desde la web` });
  });
  listarUnidades(st).forEach(({ p, u }) => {
    const r = calcUnidad(u, hoy, uf);
    if (["atrasado", "hoy", "proximo"].includes(r.estado)) items.push({ p, u, r, ord: EST[r.estado].ord, txt: r.estado === "atrasado" ? `${r.deudas.length} mes(es) · ${fmtCLP(r.deudaCLP)}${r.multa ? " (incluye multa)" : ""}` : `Vence ${fmtFecha(r.proxVenc)} · ${fmtRenta(u.contrato)}` });
    const c = u.contrato;
    if (c && reajusteActivo(c)) {
      const pend = reajustePendiente(c, periodoDe(hoy)), dias = diasParaReajuste(c, hoy);
      if (pend) items.push({ p, u, r, ord: 2.5, reajuste: true, txt: `Reajuste ${TIPOS_REAJUSTE[tipoReajuste(c)]} de ${nombrePeriodo(pend)} pendiente de aplicar` });
      else if (dias != null && dias >= 0 && dias <= avisoReajuste(c)) items.push({ p, u, r, ord: 3.5, reajuste: true, txt: `Reajuste en ${dias} días (${nombrePeriodo(proximoReajuste(c, periodoDe(hoy)))}) · ${descripcionReajuste(c)}` });
    }
    if (r.diasTermino != null && r.diasTermino <= DIAS_AVISO_TERMINO) items.push({ p, u, r, ord: 3, termino: true, txt: r.diasTermino < 0 ? `Contrato venció el ${fmtFecha(u.contrato.termino)}` : `Contrato termina en ${r.diasTermino} días (${fmtFecha(u.contrato.termino)})` });
  });
  items.sort((a, b) => a.ord - b.ord);
  if (!items.length) return <div className="empty">{listarUnidades(st).some(x => x.u.contrato) ? "✅ Sin alertas: todos los arriendos están al día." : "Aún no tienes arriendos registrados: las alertas de cobranza, vencimientos y reajustes aparecerán aquí."}</div>;
  return (
    <div className="grid" style={{ gap: 8 }}>
      {items.slice(0, 12).map((x, i) => (
        <div key={i} className="alert-row" onClick={() => abrirFicha(x.p.id, x.u.id)}>
          {x.web ? <span className="tag" style={{ background: C.successBg, color: C.success }}>📩 Web</span> : x.termino ? <span className="tag" style={{ background: C.infoBg, color: C.info }}>📄 Contrato</span> : x.reajuste ? <span className="tag" style={{ background: C.warningBg, color: C.warning }}>📈 Reajuste</span> : <Badge estado={x.r.estado} />}
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ fontWeight: 600, fontSize: 13 }}>{nombreUnidad(x.p, x.u)}</div>
            <div className="muted">{x.web ? x.txt : `${x.u.contrato.arrendatario?.nombre} · ${x.txt}`}</div>
          </div>
          <span className="muted">›</span>
        </div>
      ))}
    </div>
  );
}

// Primeros pasos para una empresa nueva (se oculta al completarlos o al cerrarla)
function PrimerosPasos() {
  const { st, user, ir, update, toast } = useApp();

    ["Completa los datos de tu empresa (RUT, domicilio, representante)", !!(e.rut && e.direccion && e.representante), "config"],
    ["Agrega tu primera propiedad", unidades.length > 0, "propiedades"],

    ["Invita a tu equipo", st.usuarios.length + st.invitaciones.length > 1, "config"],

  const hechos = pasos.filter(p => p[1]).length;

      <div className="bar-bg" style={{ margin: "10px 0" }}><div className="bar-fg" style={{ width: `${hechos / pasos.length * 100}%` }} /></div>
      {pasos.map(([t, ok, vista], i) => (
        <div key={i} className="row" style={{ padding: "5px 0", fontSize: 13 }}>
          <span style={{ width: 22 }}>{ok ? "✅" : "⬜"}</span><span style={{ flex: 1, color: ok ? C.muted : C.text, textDecoration: ok ? "line-through" : "none" }}>{t}</span>
          {!ok && <button className="btn btn-ghost btn-sm" onClick={() => ir(vista)}>Ir ›</button>}
        </div>))}
      {!unidades.length && <div className="row" style={{ marginTop: 8 }}><span className="muted">¿Quieres verlo funcionando antes?</span>
        <button className="btn btn-ghost btn-sm" onClick={() => { update(s => { s.propiedades.push(...conIdsNuevos({ propiedades: propiedadesEjemplo() }).propiedades); }, "Cargó datos de ejemplo"); toast("Datos de ejemplo cargados: los borras cuando quieras en Configuración"); }}>Cargar datos de ejemplo</button></div>}

        <button className="btn btn-ghost btn-sm" onClick={() => borrarEjemplo(st, update, toast)}>Borrarlos</button></div>}

  );
}

  const { abrirFicha } = useApp();

    <div className="grid" style={{ gap: 6 }}>
      {libres.slice(0, max).map(({ p, u }) => (
        <div key={u.id} className="alert-row" onClick={() => abrirFicha(p.id, u.id)}>
          <span style={{ fontSize: 18 }}>{ICONO[u.categoria] || "📍"}</span>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ fontWeight: 600, fontSize: 13 }}>{nombreUnidad(p, u)}</div>

        </div>
      ))}
      {libres.length > max && <div className="muted">y {libres.length - max} más…</div>}
    </div>
  );
}

    if (q) { const s = q.toLowerCase(); return [pt.p.nombre, pt.p.direccion, pt.p.comuna, ...pt.p.unidades.map(u => u.contrato?.arrendatario?.nombre)].some(x => (x || "").toLowerCase().includes(s)); }
    return true;
  }, [estado, q]);
  const puntos = usePuntos(st.propiedades, filtro);
  return (
    <div className="grid fade-up" style={{ gap: 14 }}>
      <div className="row between">
        <div className="h1">Mapa</div>

          <input className="input" style={{ width: 220 }} placeholder="Buscar propiedad, comuna, arrendatario…" value={q} onChange={e => setQ(e.target.value)} />

          </select>
          {puede(user, "editar") && <button className="btn btn-primary" onClick={() => setEditar({})}>+ Agregar</button>}
        </div>
      </div>

  multa: { cobrar: false, tipo: "diaria", monto: 0.1, diasGracia: 3, tope: 0, desdeGracia: true },
  pagos: [], multasCondonadas: {}, alDiaHasta: "",
});
const unidadVacia = (categoria = "casa", nombre = "Unidad principal") => ({ id: uid(), nombre, categoria, m2: "", dormitorios: "", banos: "", estacionamientos: "", descripcion: "", precioUF: "", fotos: [], servicios: {}, inventario: [], contrato: null, publicar: true, operacion: "arriendo", precioVentaUF: "" });

function Fotos({ fotos, onChange, editable = true, privado = false }) {
  const { st, toast } = useApp();
  const [ver, setVer] = useState(null);
  const [subiendo, setSubiendo] = useState(0);
  useFotosFirmadas(fotos);
  // Se comprimen en el navegador y se suben a Storage; en la base queda solo la URL
  const subir = async e => {
    const files = Array.from(e.target.files || []);
    e.target.value = "";
    setSubiendo(files.length);
    const nuevas = [];
    for (const f of files) {
      try { nuevas.push(await subirFoto(st.empresa.id, await comprimirImagen(f), privado)); }
      catch (err) { toast("No se pudo subir una foto: " + mensajeError(err)); }
      setSubiendo(n => n - 1);
    }
    if (nuevas.length) onChange([...(fotos || []), ...nuevas]);
  };
  return (
    <div>
      <div className="gallery">
        {(fotos || []).map((src, i) => (
          <div key={i} className="ph">
            <img src={urlFoto(src)} onClick={() => setVer(urlFoto(src))} alt="" />
            {editable && <button type="button" onClick={() => onChange(fotos.filter((_, j) => j !== i))}>✕</button>}
          </div>
        ))}
        {editable && (
          <label style={{ border: `2px dashed ${C.border}`, borderRadius: 8, aspectRatio: "4/3", display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", color: C.muted, fontSize: 12, textAlign: "center" }}>
            {subiendo ? `Subiendo ${subiendo}…` : "+ Agregar fotos"}<input type="file" accept="image/*" multiple hidden disabled={subiendo > 0} onChange={subir} />
          </label>
        )}
      </div>
      {!editable && !(fotos || []).length && <div className="muted">Sin fotos.</div>}
      {ver && ReactDOM.createPortal(<div className="overlay" style={{ alignItems: "center" }} onClick={() => setVer(null)}><img src={ver} style={{ maxWidth: "95%", maxHeight: "90vh", borderRadius: 10 }} alt="" /></div>, document.body)}
    </div>
  );
}

            </Campo>
          </div>

      </div>
    </div>

}

function ServiciosFicha({ servicios }) {
  const sv = servicios || {};
  const gc = sv.gastoComun || {};
  const copiar = t => { try { navigator.clipboard.writeText(t); } catch {} };
  const filas = Object.entries(SERVICIOS).flatMap(([k, def]) => (sv[k] || []).filter(x => x.cliente || x.empresa).map((x, i) => ({ k: k + i, def, x })));
  if (!filas.length && !gc.aplica) return <div className="muted">Sin servicios registrados. Agrégalos con ✏️ Editar.</div>;
  return (
    <dl className="kv">
      {filas.map(({ k, def, x }) => (
        <React.Fragment key={k}>
          <dt>{def.icono} {def.titulo}{x.empresa ? ` · ${x.empresa}` : ""}</dt>
          <dd className="row" style={{ gap: 6 }}><span className="mono" style={{ fontSize: 12.5 }}>{x.cliente || "—"}</span>{x.cliente && <button className="btn btn-ghost btn-sm" style={{ padding: "1px 7px" }} onClick={() => copiar(x.cliente)} title="Copiar número">⧉</button>}</dd>
        </React.Fragment>
      ))}
      {gc.aplica && <>
        <dt>🏘️ Gastos comunes</dt>
        <dd>{gc.montoAprox ? `≈ ${fmtCLP(gc.montoAprox)} · ` : ""}paga el {gc.paga === "arrendador" ? "arrendador" : "arrendatario"}</dd>
        {gc.administracion && <><dt>Administración</dt><dd>{gc.administracion}{gc.cliente ? ` · ${gc.cliente}` : ""}</dd></>}
        {gc.contacto && <><dt>Contacto</dt><dd>{gc.contacto}</dd></>}
      </>}
    </dl>
  );
}

function UnidadEditor({ value: u, onChange, esLocal }) {
  const { user, uf } = useApp();
  const upd = (k, v) => onChange({ ...u, [k]: v });
  const c = u.contrato;
  const updC = (k, v) => {
    const n = { ...c, [k]: v };
    // al cambiar la moneda, los montos de la multa (no los %) se convierten a la UF de hoy
    if (k === "moneda" && v !== c.moneda && c.multa && uf) {
      const conv = x => x === "" || x == null ? x : v === "CLP" ? Math.round(Number(x) * uf) : Math.round(Number(x) / uf * 100) / 100;
      n.multa = { ...c.multa, monto: c.multa.tipo.includes("pct") ? c.multa.monto : conv(c.multa.monto), tope: conv(c.multa.tope) };
    }
    // al cambiar el inicio, si el término era el sugerido (un año), se recalcula; si lo escribiste tú, no se toca
    const terminoSugerido = iso => { const d = parseISO(iso); return d ? toISO(new Date(d.getFullYear() + 1, d.getMonth(), d.getDate() - 1)) : ""; };
    if (k === "inicio" && v && (!c.termino || c.termino === terminoSugerido(c.inicio))) n.termino = terminoSugerido(v);
    onChange({ ...u, contrato: n });
  };
  const updA = (k, v) => updC("arrendatario", { ...c.arrendatario, [k]: v });
  const updM = (k, v) => updC("multa", { ...c.multa, [k]: v });
  const esAdm = esAdminEmp(user) && !user.soloLectura;
  const unidadMoneda = c && c.moneda === "CLP" ? "$" : "UF";

  return (
    <div>
      <div className="section-title">Datos de la {esLocal ? "unidad / local" : "propiedad"}</div>
      <div className="form-grid">
        {esLocal && <Campo label="Nombre o número"><input className="input" value={u.nombre} onChange={e => upd("nombre", e.target.value)} placeholder="Ej: Local 12" /></Campo>}
        <Campo label="Tipo">
          <select className="select" value={u.categoria} onChange={e => upd("categoria", e.target.value)}>
            {Object.entries(CATEGORIAS).map(([k, l]) => <option key={k} value={k}>{l}</option>)}
          </select>
        </Campo>
        <Campo label="Superficie (m²)"><input className="input" type="number" value={u.m2} onChange={e => upd("m2", e.target.value)} /></Campo>
        {(!esLocal || ["depto", "casa"].includes(u.categoria)) && <Campo label="Dormitorios"><input className="input" type="number" value={u.dormitorios} onChange={e => upd("dormitorios", e.target.value)} /></Campo>}
        <Campo label="Baños"><input className="input" type="number" value={u.banos} onChange={e => upd("banos", e.target.value)} /></Campo>
        <Campo label="Estacionamientos"><input className="input" type="number" value={u.estacionamientos} onChange={e => upd("estacionamientos", e.target.value)} /></Campo>
        <Campo label="Se ofrece en">
          <select className="select" value={u.operacion || "arriendo"} onChange={e => upd("operacion", e.target.value)}>
            {Object.entries(OPERACIONES).map(([k, l]) => <option key={k} value={k}>{l}</option>)}
          </select>
        </Campo>
        {(u.operacion || "arriendo") !== "venta" && <Campo label="Precio arriendo mensual (UF)"><input className="input" type="number" step="0.01" value={u.precioUF} onChange={e => upd("precioUF", e.target.value)} /></Campo>}
        {(u.operacion || "arriendo") !== "arriendo" && <Campo label="Precio venta (UF)"><input className="input" type="number" step="0.01" value={u.precioVentaUF || ""} onChange={e => upd("precioVentaUF", e.target.value)} /></Campo>}
        <Campo label="Página web"><label className="switch" style={{ marginTop: 9 }}><input type="checkbox" checked={u.publicar !== false} onChange={e => upd("publicar", e.target.checked)} />Publicar cuando esté desocupada</label></Campo>
        <Campo label="Descripción" span><textarea className="input" rows={2} value={u.descripcion} onChange={e => upd("descripcion", e.target.value)} placeholder="Características para enviar a interesados" /></Campo>
      </div>
      <div className="section-title">Fotos</div>
      <Fotos fotos={u.fotos} onChange={f => upd("fotos", f)} />
      <div className="section-title">Servicios: luz, agua y gastos comunes</div>
      <ServiciosEditor value={u.servicios} onChange={v => upd("servicios", v)} />

      <div className="section-title row between">
        <span>Arriendo</span>
        <label className="switch" style={{ textTransform: "none", letterSpacing: 0, color: C.text, fontWeight: 500 }}>
          <input type="checkbox" checked={!!c} disabled={!!c && !esAdm && (c.pagos || []).length > 0} title={!!c && !esAdm ? "Para dejar la propiedad libre, un administrador usa Terminar contrato en la ficha" : ""} onChange={e => {
            if (e.target.checked) return upd("contrato", contratoVacio());
            const n = (c.pagos || []).length;
            if (n && !confirm(`Se borrará este contrato y sus ${n} pagos registrados. Para dejar la propiedad libre conservando el historial, usa "Terminar contrato" en la ficha. ¿Borrar de todas formas?`)) return;
            upd("contrato", null);
          }} />
          Ocupada (con contrato)
        </label>
      </div>
      {c && (
        <>
          <div className="label" style={{ marginTop: 4 }}>Arrendatario</div>

            <Campo label="Teléfono / WhatsApp"><input className="input" value={c.arrendatario.telefono} onChange={e => updA("telefono", e.target.value)} placeholder="+56 9 1234 5678" /></Campo>
            <Campo label="Domicilio"><input className="input" value={c.arrendatario.domicilio} onChange={e => updA("domicilio", e.target.value)} /></Campo>
            <Campo label={esLocal ? "Giro" : "Representante / aval"}>{esLocal
              ? <input className="input" value={c.arrendatario.giro} onChange={e => updA("giro", e.target.value)} />
              : <input className="input" value={c.arrendatario.representante} onChange={e => updA("representante", e.target.value)} />}</Campo>
          </div>
          <div className="label" style={{ marginTop: 14 }}>Condiciones del arriendo</div>
          <div className="form-grid">
            <Campo label="Inicio"><input className="input" type="date" value={c.inicio} onChange={e => updC("inicio", e.target.value)} /></Campo>
            <Campo label="Término"><input className="input" type="date" value={c.termino} onChange={e => updC("termino", e.target.value)} /></Campo>
            {c.inicio && c.inicio.slice(0, 7) < periodoDe(new Date()) && !(c.pagos || []).length &&
              <Campo label="Al día hasta (mes)"><input className="input" type="month" value={c.alDiaHasta || ""} max={periodoDe(new Date())} onChange={e => updC("alDiaHasta", e.target.value)} /></Campo>}

            <Campo label="Moneda">
              <select className="select" value={c.moneda} onChange={e => updC("moneda", e.target.value)}>
                <option value="UF">UF</option><option value="CLP">Pesos (CLP)</option>
              </select>
            </Campo>
            <Campo label={`Renta mensual (${unidadMoneda})`}><input className="input" type="number" step="0.01" value={c.valor} onChange={e => updC("valor", e.target.value)} /></Campo>
            <Campo label={`Garantía (${unidadMoneda})`}><input className="input" type="number" step="0.01" value={c.garantia} onChange={e => updC("garantia", e.target.value)} /></Campo>

              </select>
            </Campo>
            {tipoReajuste(c) && <>
              {tipoReajuste(c) === "pct" && <Campo label="Porcentaje (%)"><input className="input" type="number" step="0.01" min="0" value={c.reajuste.pct ?? ""} onChange={e => updC("reajuste", { ...c.reajuste, pct: e.target.value })} /></Campo>}
              <Campo label="Periodicidad">

            <div className="muted" style={{ margin: "4px 0 10px" }}>Según lo acordado en el contrato. Al vencer la fecha (más los días de gracia) la multa se suma sola a la deuda. {!esAdm && "Solo un administrador puede activarla o desactivarla."}</div>
            {c.moneda === "CLP" && c.multa.cobrar && !c.multa.tipo.includes("pct") && Number(c.multa.monto) > 0 && Number(c.multa.monto) < 100 &&
              <div style={{ color: "#B91C1C", fontSize: 12.5, marginBottom: 8 }}>⚠️ El monto de la multa está en pesos: ${c.multa.monto} parece un error (¿era en UF?).</div>}
            <div className="form-grid">
              <Campo label="Tipo de multa">
                <select className="select" value={c.multa.tipo} onChange={e => updM("tipo", e.target.value)}>
                  <option value="diaria">Monto por día de atraso</option>
                  <option value="diaria_pct">% de la renta por día</option>
                  <option value="fija">Monto fijo por mes atrasado</option>
                  <option value="pct">% de la renta por mes atrasado</option>
                </select>
              </Campo>
              <Campo label={c.multa.tipo.includes("pct") ? "Porcentaje (%)" : `Monto (${unidadMoneda})`}><input className="input" type="number" step="0.01" value={c.multa.monto} onChange={e => updM("monto", e.target.value)} /></Campo>
              <Campo label="Días de gracia"><input className="input" type="number" min="0" value={c.multa.diasGracia} onChange={e => updM("diasGracia", e.target.value)} /></Campo>
              <Campo label={`Tope por mes (${unidadMoneda}, 0 = sin tope)`}><input className="input" type="number" step="0.01" value={c.multa.tope} onChange={e => updM("tope", e.target.value)} /></Campo>
              {c.multa.tipo.startsWith("diaria") && <Campo label="Días que se cobran" span><label className="switch" style={{ marginTop: 6 }}><input type="checkbox" checked={!!c.multa.desdeGracia} onChange={e => updM("desdeGracia", e.target.checked)} disabled={!esAdm} />Solo los días posteriores a la gracia (si no, todos los días desde el vencimiento)</label></Campo>}
            </div>
          </div>
        </>
      )}
    </div>
  );
}

function PropiedadForm({ inicial, onClose }) {
  const { st, update, toast, user } = useApp();
  const [p, setP] = useState(() => inicial ? structuredClone(inicial) : {
    id: uid(), tipo: "propiedad", nombre: "", direccion: "", comuna: "", ciudad: "Santiago", lat: null, lng: null, rol: "", notas: "",
    arrendador: { nombre: "", rut: "", email: "", telefono: "", domicilio: "" }, propietarioId: "", unidades: [unidadVacia()],
  });
  const [localEdit, setLocalEdit] = useState(null);
  const [buscando, setBuscando] = useState(false);
  const [centrar, setCentrar] = useState(0);
  const upd = (k, v) => setP(x => ({ ...x, [k]: v }));
  const updArr = (k, v) => setP(x => ({ ...x, arrendador: { ...(x.arrendador || {}), [k]: v } }));

  const cambiarTipo = t => setP(x => ({ ...x, tipo: t, unidades: t === "centro"
    ? (x.unidades.length === 1 && !x.unidades[0].contrato && !x.unidades[0].m2 ? [] : x.unidades.map((u, i) => ({ ...u, nombre: u.nombre === "Unidad principal" ? `Local ${i + 1}` : u.nombre })))
    : (x.unidades.length ? [x.unidades[0]] : [unidadVacia()]) }));

  const buscarDireccion = async () => {
    const q = [p.direccion, p.comuna, p.ciudad, "Chile"].filter(Boolean).join(", ");
    if (!p.direccion) return toast("Escribe la dirección primero");
    setBuscando(true);
    try {
      const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=cl&q=${encodeURIComponent(q)}`, { headers: { "Accept-Language": "es" } });
      const j = await r.json();
      if (j[0]) { setP(x => ({ ...x, lat: Number(Number(j[0].lat).toFixed(6)), lng: Number(Number(j[0].lon).toFixed(6)) })); setCentrar(Date.now()); toast("Ubicación encontrada. Ajusta el marcador si es necesario."); }
      else toast("No se encontró la dirección. Haz clic en el mapa para ubicarla.");
    } catch { toast("No se pudo buscar. Haz clic en el mapa para ubicarla."); }
    setBuscando(false);
  };

  const guardar = () => {
    if (!p.nombre.trim()) return toast("Falta el nombre de la propiedad");
    if (p.lat == null || p.lng == null || isNaN(p.lat) || isNaN(p.lng)) return toast("Ubica la propiedad en el mapa (busca la dirección o haz clic en el mapa)");
    if (p.tipo === "centro" && !p.unidades.length) return toast("Agrega al menos un local");
    const max = st.suscripcion && st.suscripcion.maxUnidades;
    const otras = listarUnidades(st).filter(x => x.p.id !== p.id).length;
    if (max && otras + p.unidades.length > max) return toast(`Tu plan ${st.suscripcion.plan} permite hasta ${max} unidades (tienes ${otras}). Contacta a HM Software para cambiar de plan.`);
    const malos = p.unidades.filter(u => u.contrato && (!u.contrato.arrendatario.nombre || !u.contrato.valor));
    if (malos.length) return toast(`Completa arrendatario y renta en: ${malos.map(u => u.nombre).join(", ")}`);
    const lat = Number(p.lat), lng = Number(p.lng);
    update(s => {
      const i = s.propiedades.findIndex(x => x.id === p.id);
      const limpio = { ...p, lat, lng };
      if (i >= 0) s.propiedades[i] = limpio; else s.propiedades.push(limpio);
    }, `${inicial ? "Editó" : "Agregó"} ${p.tipo === "centro" ? "centro comercial" : "propiedad"} "${p.nombre}"`);
    toast("Guardado");
    onClose();
  };

  return (
    <Modal titulo={inicial ? `Editar: ${inicial.nombre}` : "Nueva propiedad o centro comercial"} onClose={onClose} ancho={880}
      pie={<><button className="btn btn-ghost" onClick={onClose}>Cancelar</button><button className="btn btn-primary" onClick={guardar}>Guardar</button></>}>
      <div className="row" style={{ marginBottom: 14 }}>
        {[["propiedad", "🏠 Propiedad individual"], ["centro", "🛍️ Centro comercial / edificio con locales"]].map(([k, l]) =>
          <button key={k} type="button" className={"btn " + (p.tipo === k ? "btn-primary" : "btn-ghost")} onClick={() => cambiarTipo(k)}>{l}</button>)}
      </div>
      <div className="form-grid">
        <Campo label="Nombre"><input className="input" value={p.nombre} onChange={e => upd("nombre", e.target.value)} placeholder={p.tipo === "centro" ? "Ej: Strip Center Los Andes" : "Ej: Casa Los Jardines"} /></Campo>
        <Campo label="Dirección"><input className="input" value={p.direccion} onChange={e => upd("direccion", e.target.value)} onKeyDown={e => e.key === "Enter" && (e.preventDefault(), buscarDireccion())} /></Campo>
        <Campo label="Comuna"><input className="input" value={p.comuna} onChange={e => upd("comuna", e.target.value)} /></Campo>
        <Campo label="Ciudad"><input className="input" value={p.ciudad} onChange={e => upd("ciudad", e.target.value)} /></Campo>
        <Campo label="Rol SII"><input className="input" value={p.rol} onChange={e => upd("rol", e.target.value)} /></Campo>
      </div>

      <div className="section-title">Ubicación (coordenadas)</div>
      <div className="row" style={{ marginBottom: 8 }}>
        <button type="button" className="btn btn-ghost" onClick={buscarDireccion} disabled={buscando}>{buscando ? "Buscando…" : "📍 Buscar dirección en el mapa"}</button>
        <div style={{ width: 130 }}><input className="input" placeholder="Latitud" value={p.lat ?? ""} onChange={e => upd("lat", e.target.value === "" ? null : Number(e.target.value))} /></div>
        <div style={{ width: 130 }}><input className="input" placeholder="Longitud" value={p.lng ?? ""} onChange={e => upd("lng", e.target.value === "" ? null : Number(e.target.value))} /></div>
        <span className="muted">o haz clic en el mapa / arrastra el marcador</span>
      </div>
      <MapaBase puntos={[]} alto={260} tooltips={false} ajustar={false} elegir
        posicion={{ lat: p.lat, lng: p.lng, centrar }}
        onElegir={ll => setP(x => ({ ...x, lat: Number(ll.lat.toFixed(6)), lng: Number(ll.lng.toFixed(6)) }))} />

      {esAdminEmp(user) && st.usuarios.some(x => x.rol === "corredor" && x.activo !== false) && <>
        <div className="section-title">Corredor a cargo</div>
        <div className="form-grid" style={{ marginBottom: 8 }}>
          <Campo label="Corredor"><select className="select" value={p.corredorId || ""} onChange={e => upd("corredorId", e.target.value)}>
            <option value="">— Sin corredor —</option>
            {st.usuarios.filter(x => x.rol === "corredor" && (x.activo !== false || x.id === p.corredorId)).map(x => <option key={x.id} value={x.id}>{x.nombre}{x.comisionPct !== "" ? ` · ${x.comisionPct}% de la comisión` : ""}</option>)}
          </select></Campo>
        </div>
      </>}
      <div className="section-title">Propietario (arrendador)</div>
      {(st.propietarios || []).length > 0 && (
        <div className="form-grid" style={{ marginBottom: 8 }}>
          <Campo label="Propietario"><select className="select" value={p.propietarioId || ""} onChange={e => upd("propietarioId", e.target.value)}>
            <option value="">— Escribir los datos a mano —</option>
            {st.propietarios.map(x => <option key={x.id} value={x.id}>{x.nombre}{x.rut ? ` · ${x.rut}` : ""}</option>)}
          </select></Campo>
        </div>
      )}
      {!p.propietarioId && <>
        <div className="muted" style={{ marginBottom: 8 }}>Déjalo vacío si el arrendador es {st.empresa.nombre}.{planPermite(st, "propietarios") && esAdminEmp(user) ? " Si administras propiedades de terceros, regístralos en Propietarios para hacerles liquidaciones." : ""}</div>
        <div className="form-grid">
          <Campo label="Nombre"><input className="input" value={p.arrendador?.nombre || ""} onChange={e => updArr("nombre", e.target.value)} placeholder={st.empresa.nombre} /></Campo>
          <Campo label="RUT"><input className="input" value={p.arrendador?.rut || ""} onChange={e => updArr("rut", e.target.value)} /></Campo>
          <Campo label="Correo"><input className="input" value={p.arrendador?.email || ""} onChange={e => updArr("email", e.target.value)} /></Campo>
          <Campo label="Teléfono / WhatsApp"><input className="input" value={p.arrendador?.telefono || ""} onChange={e => updArr("telefono", e.target.value)} /></Campo>
        </div>
      </>}

      {p.tipo === "propiedad" ? (
        <UnidadEditor value={p.unidades[0]} onChange={u => setP(x => ({ ...x, unidades: [u] }))} />
      ) : (
        <>
          <div className="section-title row between"><span>Locales ({p.unidades.length})</span>
            <button type="button" className="btn btn-ghost btn-sm" onClick={() => setLocalEdit(unidadVacia("local", `Local ${p.unidades.length + 1}`))}>+ Agregar local</button>
          </div>
          {!p.unidades.length ? <div className="muted">Agrega los locales del centro comercial.</div> : (
            <div className="table-wrap"><table>
              <thead><tr><th>Local</th><th>m²</th><th>Arrendatario</th><th className="num">Renta</th><th></th></tr></thead>
              <tbody>{p.unidades.map(u => (
                <tr key={u.id} className="click" onClick={() => setLocalEdit(structuredClone(u))}>
                  <td style={{ fontWeight: 600 }}>{u.nombre}</td><td>{u.m2 || "—"}</td>
                  <td>{u.contrato ? u.contrato.arrendatario.nombre : <Badge estado="libre" />}</td>
                  <td className="num">{u.contrato ? fmtRenta(u.contrato) : "—"}</td>
                  <td className="num"><button type="button" className="btn btn-ghost btn-sm">Editar</button></td>
                </tr>))}
              </tbody></table></div>
          )}
        </>
      )}
      <div className="section-title">Notas internas</div>
      <textarea className="input" rows={2} value={p.notas} onChange={e => upd("notas", e.target.value)} />

      {localEdit && (
        <Modal titulo={`Local: ${localEdit.nombre}`} onClose={() => setLocalEdit(null)} ancho={760}
          pie={<>
            {p.unidades.some(x => x.id === localEdit.id) && esAdminEmp(user) &&
              <button className="btn btn-danger" style={{ marginRight: "auto" }} onClick={() => { if (confirm("¿Eliminar este local?")) { setP(x => ({ ...x, unidades: x.unidades.filter(u => u.id !== localEdit.id) })); setLocalEdit(null); } }}>Eliminar local</button>}
            <button className="btn btn-ghost" onClick={() => setLocalEdit(null)}>Cancelar</button>
            <button className="btn btn-primary" onClick={() => { setP(x => { const i = x.unidades.findIndex(u => u.id === localEdit.id); const us = [...x.unidades]; if (i >= 0) us[i] = localEdit; else us.push(localEdit); return { ...x, unidades: us }; }); setLocalEdit(null); }}>Listo</button>
          </>}>
          <UnidadEditor value={localEdit} onChange={setLocalEdit} esLocal />
        </Modal>
      )}
    </Modal>
  );
}


// ─── REGISTRO DE PAGO ─────────────────────────────────────────────────────────
function PagoModal({ p, u, onClose, modoInicial = "pago" }) {
  const { update, hoy, uf, user, toast } = useApp();
  const c = u.contrato;
  const r = calcUnidad(u, hoy, uf);
  const pagados = mesesPagados(c);
  const [modo, setModo] = useState(modoInicial);
  const esAbono = modo === "abono";
  const actual = periodoDe(hoy);
  // Todos los meses impagos desde el inicio del contrato y hasta 12 meses después del último pagado (sin pasar el término)
  const desde = primerPeriodo(c) || actual;
  const ultimoPagado = [...pagados].sort().pop();
  const fin = c.termino ? periodoDe(parseISO(c.termino)) : null;
  let tope = sumarMes([actual, ultimoPagado || desde, desde].sort().pop(), 12);
  if (fin && fin < tope) tope = fin;
  const opciones = [];
  for (let x = desde; x <= tope && opciones.length < 60; x = sumarMes(x, 1)) if (!pagados.has(x)) opciones.push(x);
  const [f, setF] = useState(() => ({ periodo: opciones[0] || actual, fecha: toISO(hoy), ufDia: Math.round(uf * 100) / 100, metodo: "Transferencia", obs: "", condonar: false }));
  const fechaPago = parseISO(f.fecha) || hoy;
  const diasAtraso = diffDias(fechaPago, vencimiento(f.periodo, c.diaPago));
  const multa = f.condonar ? 0 : multaPendiente(c, f.periodo, calcMulta(c, diasAtraso, f.periodo));
  // Renta del mes menos lo ya abonado (IVA incluido)
  const abonadoCLP = abonadoMesCLP(c, f.periodo);
  const montoCLP = Math.round(aCLP(saldoMes(c, f.periodo), c.moneda, Number(f.ufDia)));
  const multaCLP = Math.round(aCLP(multa, c.moneda, Number(f.ufDia)));
  const [ajuste, setAjuste] = useState(null);
  const totalSugerido = esAbono ? "" : montoCLP + multaCLP;
  const total = ajuste == null ? Number(totalSugerido) || 0 : Number(ajuste) || 0;

  const guardar = () => {
    if (esAbono) {
      if (total <= 0) return toast("Ingresa el monto del abono");
      update(s => {
        const cc = s.propiedades.find(x => x.id === p.id).unidades.find(x => x.id === u.id).contrato;
        cc.abonos = [...(cc.abonos || []), { id: uid(), periodo: f.periodo, fecha: f.fecha, ufDia: Number(f.ufDia), montoCLP: Math.round(total), metodo: f.metodo, obs: f.obs, registradoPor: user.nombre, registrado: Date.now() }];
      }, `Registró abono de ${fmtCLP(total)} a ${nombrePeriodo(f.periodo)} en "${nombreUnidad(p, u)}"`);
      toast(total >= montoCLP + multaCLP ? "Abono registrado: el mes quedó pagado" : `Abono registrado. Saldo del mes: ${fmtCLP(montoCLP + multaCLP - total)}`);
      return onClose();
    }
    update(s => {
      const uu = s.propiedades.find(x => x.id === p.id).unidades.find(x => x.id === u.id);
      const cc = uu.contrato;
      if (f.condonar) cc.multasCondonadas = { ...(cc.multasCondonadas || {}), [f.periodo]: true };
      const mClp = Math.min(multaCLP, Math.max(0, total - montoCLP));
      cc.pagos = [...(cc.pagos || []), { id: uid(), periodo: f.periodo, fecha: f.fecha, ufDia: Number(f.ufDia), montoCLP: total - mClp, multaCLP: mClp, ivaCLP: cc.iva ? Math.round((total - mClp) * TASA_IVA / (1 + TASA_IVA)) : 0, metodo: f.metodo, obs: f.obs, registradoPor: user.nombre, registrado: Date.now() }];
    }, `Registró pago de ${nombrePeriodo(f.periodo)} en "${nombreUnidad(p, u)}" por ${fmtCLP(total)}${f.condonar ? " (multa condonada)" : ""}`);
    toast("Pago registrado");
    onClose();
  };

  return (
    <Modal titulo={`${esAbono ? "Registrar abono" : "Registrar pago"} · ${nombreUnidad(p, u)}`} onClose={onClose} ancho={560}
      pie={<><button className="btn btn-ghost" onClick={onClose}>Cancelar</button><button className="btn btn-primary" onClick={guardar} disabled={!opciones.length}>{esAbono ? "Registrar abono" : "Registrar"} {total ? fmtCLP(total) : ""}</button></>}>
      <div className="row" style={{ marginBottom: 14 }}>
        {[["pago", "Pago del mes"], ["abono", "Abono (pago parcial)"]].map(([k, l]) =>
          <button key={k} type="button" className={"btn btn-sm " + (modo === k ? "btn-primary" : "btn-ghost")} onClick={() => { setModo(k); setAjuste(null); }}>{l}</button>)}
      </div>
      <div className="form-grid">
        <Campo label="Mes que paga">
          <select className="select" value={f.periodo} onChange={e => setF({ ...f, periodo: e.target.value })}>
            {!opciones.length && <option value="">Todos los meses del contrato están pagados</option>}
            {opciones.map(o => <option key={o} value={o}>{nombrePeriodo(o)}{r.deudas.some(d => d.periodo === o) ? " (atrasado)" : o > actual ? " (adelantado)" : ""}</option>)}
          </select>
        </Campo>
        <Campo label="Fecha de pago"><input className="input" type="date" value={f.fecha} onChange={e => setF({ ...f, fecha: e.target.value })} /></Campo>
        {c.moneda === "UF" && <Campo label="Valor UF del día"><input className="input" type="number" step="0.01" value={f.ufDia} onChange={e => setF({ ...f, ufDia: e.target.value })} /></Campo>}
        <Campo label="Medio de pago">
          <select className="select" value={f.metodo} onChange={e => setF({ ...f, metodo: e.target.value })}>
            {["Transferencia", "Depósito", "Efectivo", "Cheque", "Tarjeta", "Otro"].map(m => <option key={m}>{m}</option>)}
          </select>
        </Campo>
      </div>
      <div className="card" style={{ marginTop: 14, background: C.bg, padding: 14 }}>
        <dl className="kv">
          <dt>Renta</dt><dd>{fmtRenta(c, f.periodo)} = {fmtCLP(Math.round(aCLP(totalMes(c, f.periodo), c.moneda, Number(f.ufDia))))}{c.iva ? <span className="muted"> (con IVA)</span> : null}</dd>
          {abonadoCLP > 0 && <><dt>Abonado</dt><dd>{fmtCLP(abonadoCLP)} en {(c.abonos || []).filter(a => a.periodo === f.periodo).length} abono(s)</dd></>}
          {abonadoCLP > 0 && <><dt>Saldo de la renta</dt><dd style={{ fontWeight: 700 }}>{fmtCLP(montoCLP)}</dd></>}
          <dt>Vencimiento</dt><dd>{fmtFecha(vencimiento(f.periodo, c.diaPago))} {diasAtraso > 0 ? <span style={{ color: "#DC2626" }}>· {diasAtraso} días de atraso</span> : ""}</dd>
          {(!esAbono || multaCLP > 0) && <><dt>Multa{esAbono ? " pendiente" : ""}</dt><dd>{c.multa?.cobrar ? (multa ? `${fmtMonto(multa, c.moneda)} = ${fmtCLP(multaCLP)}` : "$0") : "No se cobra"} </dd></>}
        </dl>
        {esAbono && <div className="muted" style={{ marginTop: 8 }}>{total > 0 && total >= montoCLP + multaCLP ? "✅ Con este abono el mes queda pagado." : total > 0 ? `Quedará un saldo de ${fmtCLP(montoCLP + multaCLP - total)}.` : `Falta pagar ${fmtCLP(montoCLP + multaCLP)}${multaCLP ? " (renta + multa)" : ""}. El abono cubre primero la renta y luego la multa.`}</div>}
        {!esAbono && c.multa?.cobrar && calcMulta(c, diasAtraso, f.periodo) > 0 && (
          <label className="switch" style={{ marginTop: 10 }} title={!esAdminEmp(user) ? "Solo un administrador puede condonar multas" : ""}>
            <input type="checkbox" checked={f.condonar} disabled={!esAdminEmp(user)} onChange={e => setF({ ...f, condonar: e.target.checked })} />
            Condonar multa de este mes {!esAdminEmp(user) && <span className="muted">(solo administradores)</span>}
          </label>
        )}
      </div>
      <div className="form-grid" style={{ marginTop: 14 }}>
        <Campo label={esAbono ? "Monto del abono (CLP)" : "Monto recibido (CLP)"}><input className="input" type="number" value={ajuste ?? totalSugerido} onChange={e => setAjuste(e.target.value)} placeholder={esAbono ? "Ej: 500000" : ""} autoFocus={esAbono} /></Campo>
        <Campo label="Observación"><input className="input" value={f.obs} onChange={e => setF({ ...f, obs: e.target.value })} placeholder="N° de transferencia, etc." /></Campo>
      </div>
    </Modal>
  );
}


// ─── COMUNICAR (WhatsApp / correo) ────────────────────────────────────────────
function ComunicarModal({ p, u, onClose, inicial }) {
  const { st, hoy, uf, update } = useApp();
  const r = calcUnidad(u, hoy, uf);
  const lista = mensajes(p, u, r, uf, st.empresa);
  const [sel, setSel] = useState(inicial && lista.some(m => m.id === inicial) ? inicial : (r.deudas.length ? "atraso" : "recordatorio"));
  const m = lista.find(x => x.id === sel) || lista[0];
  const [texto, setTexto] = useState(m.texto);
  const [destino, setDestino] = useState("arrendatario");
  useEffect(() => { setTexto((lista.find(x => x.id === sel) || lista[0]).texto); }, [sel]);
  const a = u.contrato.arrendatario || {};
  const arr = arrendadorDe(st, p);
  const dest = destino === "arrendatario" ? a : arr;
  const registrar = canalTxt => update(() => {}, `Envió "${m.titulo}" por ${canalTxt} a ${dest.nombre || destino} (${nombreUnidad(p, u)})`);

  return (
    <Modal titulo="Contactar" onClose={onClose} ancho={620}>
      <div className="form-grid">
        <Campo label="Destinatario">
          <select className="select" value={destino} onChange={e => setDestino(e.target.value)}>
            <option value="arrendatario">Arrendatario: {a.nombre}</option>
            <option value="arrendador">Arrendador: {arr.nombre}</option>
          </select>
        </Campo>
