function CompartirModal({ p, u, onClose }) {
  const { uf, update, toast, user } = useApp();
  const [i, setI] = useState({ nombre: "", telefono: "", email: "", nota: "" });
  const texto = `Hola${i.nombre ? " " + i.nombre.split(" ")[0] : ""}, te comparto la información de la propiedad:\n\n${textoFichaDisponible(p, u, uf)}\n\nQuedo atento/a para coordinar una visita.`;
  const registrar = canalTxt => {
    if (!i.nombre && !i.telefono && !i.email) return;
    // misma persona (teléfono o correo) en la misma unidad: se actualiza en vez de duplicarla
    const tel = telWA(i.telefono), mail = (i.email || "").trim().toLowerCase();
    update(s => {
      const ya = s.interesados.find(x => x.unidadId === u.id && ((tel && telWA(x.telefono) === tel) || (mail && (x.email || "").trim().toLowerCase() === mail)));
      if (ya) Object.assign(ya, { nombre: i.nombre || ya.nombre, telefono: i.telefono || ya.telefono, email: i.email || ya.email, nota: [ya.nota, i.nota].filter(Boolean).join(" · ").slice(0, 500), canal: canalTxt });
      else s.interesados.unshift({ id: uid(), ...i, propId: p.id, unidadId: u.id, fecha: toISO(new Date()), canal: canalTxt, por: user.nombre });
    }, `Envió ficha de "${nombreUnidad(p, u)}" a interesado ${i.nombre || i.telefono || i.email} por ${canalTxt}`);
  };
  const compartirFotos = async () => {
    try {
      const files = await Promise.all((u.fotos || []).map(async (src, k) => { const b = await (await fetch(src)).blob(); return new File([b], `foto-${k + 1}.jpg`, { type: "image/jpeg" }); }));
      if (navigator.canShare && navigator.canShare({ files })) {
        await navigator.share({ files, title: nombreUnidad(p, u), text: texto });
        registrar("compartir (fotos)");
      } else toast("Este navegador no permite compartir fotos directamente. Usa “Ficha PDF” o compártelo desde el celular.");
    } catch {}
  };
  const fichaPDF = () => {
    imprimirHTML(`Ficha ${nombreUnidad(p, u)}`, `<h1 style="font-size:20px">${esc(nombreUnidad(p, u))}</h1><p style="text-align:center">${esc(p.direccion)}${p.comuna ? ", " + esc(p.comuna) : ""}</p>
      <div class="fotos">${(u.fotos || []).slice(0, 6).map(f => `${imgSegura(f)}/>`).join("")}</div>
      <table style="margin-top:14px"><tr><td>Tipo</td><td>${CATEGORIAS[u.categoria] || ""}</td></tr>${u.m2 ? `<tr><td>Superficie</td><td>${u.m2} m²</td></tr>` : ""}${u.dormitorios ? `<tr><td>Dormitorios</td><td>${u.dormitorios}</td></tr>` : ""}${u.banos ? `<tr><td>Baños</td><td>${u.banos}</td></tr>` : ""}${u.estacionamientos ? `<tr><td>Estacionamientos</td><td>${u.estacionamientos}</td></tr>` : ""}${u.precioUF ? `<tr><td>Valor mensual</td><td>${fmtUF(u.precioUF)} (aprox. ${fmtCLP(u.precioUF * uf)})</td></tr>` : ""}</table>
      ${u.descripcion ? `<p style="margin-top:14px">${esc(u.descripcion)}</p>` : ""}<p>Ubicación: https://www.google.com/maps?q=${p.lat},${p.lng}</p>`);
    registrar("ficha PDF");
  };
  return (
    <Modal titulo={`Enviar a interesado · ${nombreUnidad(p, u)}`} onClose={onClose} ancho={640}>
      <div className="form-grid">
        <Campo label="Nombre del interesado"><input className="input" value={i.nombre} onChange={e => setI({ ...i, nombre: e.target.value })} /></Campo>
        <Campo label="Teléfono / WhatsApp"><input className="input" value={i.telefono} onChange={e => setI({ ...i, telefono: e.target.value })} /></Campo>
        <Campo label="Correo"><input className="input" value={i.email} onChange={e => setI({ ...i, email: e.target.value })} /></Campo>
        <Campo label="Nota"><input className="input" value={i.nota} onChange={e => setI({ ...i, nota: e.target.value })} placeholder="Ej: busca para cafetería" /></Campo>
      </div>
      <div className="label" style={{ marginTop: 14 }}>Mensaje que se enviará</div>
      <pre style={{ whiteSpace: "pre-wrap", fontFamily: "Sora", fontSize: 12.5, background: C.bg, border: `1px solid ${C.border}`, borderRadius: 8, padding: 12 }}>{texto}</pre>
      {(u.fotos || []).length > 0 && <div style={{ marginTop: 10 }}><Fotos fotos={u.fotos} editable={false} /></div>}
      <div className="row" style={{ marginTop: 14 }}>
        <a className={"btn btn-wa" + (i.telefono ? "" : " disabled")} href={i.telefono ? linkWA(i.telefono, texto) : undefined} target="_blank" rel="noopener" onClick={e => { if (!i.telefono) { e.preventDefault(); toast("Ingresa el teléfono del interesado"); } else registrar("WhatsApp"); }}>WhatsApp</a>
        <a className="btn btn-mail" href={linkMail(i.email, `Propiedad en arriendo: ${nombreUnidad(p, u)}`, texto)} onClick={() => registrar("correo")}>Correo</a>

      <div className="muted" style={{ marginTop: 10 }}>WhatsApp Web no permite adjuntar fotos desde un enlace: en el celular usa “Compartir con fotos”; en el computador envía la Ficha PDF.</div>
    </Modal>
  );
}


// ─── FICHA (panel lateral) ────────────────────────────────────────────────────
// Reajuste en la ficha: renta vigente, la que viene, aviso, aplicar (IPC/UF) e historial
const pctTxt = v => `${Number(v).toLocaleString("es-CL", { maximumFractionDigits: 4 })}%`;
function detalleIndice(r) {
  const d = r.detalle || {};
  if (d.anexo) return `${d.documento || "Anexo"} (${r.variacionPct >= 0 ? "+" : ""}${pctTxt(r.variacionPct)})`;
  if (r.tipo === "pct") return `${pctTxt(r.variacionPct)} fijo pactado`;
  if (r.tipo === "ipc") return `IPC acumulado ${pctTxt(r.variacionPct)}: ` + (d.meses || []).map(m => `${nombrePeriodo(m.periodo).slice(0, 3).toLowerCase()} ${m.periodo.slice(2, 4)} ${String(m.ipc).replace(".", ",")}%`).join(" · ") + (d.completo === false ? " (últimos meses publicados)" : "");
  return `UF ${fmtFecha(d.ufInicio?.fecha)} ${fmtCLP(d.ufInicio?.valor)} → ${fmtFecha(d.ufFin?.fecha)} ${fmtCLP(d.ufFin?.valor)} (${pctTxt(r.variacionPct)})`;
}
function ReajusteFicha({ p, u, c }) {
  const { hoy, user, update, toast } = useApp();
  const [calc, setCalc] = useState(null);
  const [cargando, setCargando] = useState(false);
  useEffect(() => { setCalc(null); }, [c.id]);
  const contratoDe = s => s.propiedades.find(x => x.id === p.id).unidades.find(x => x.id === u.id).contrato;
  const actual = periodoDe(hoy), tipo = tipoReajuste(c);
  const hist = reajusteActivo(c) ? historialReajustes(c, actual) : aplicados(c);
  // se puede deshacer el último reajuste o anexo registrado (no los pasos automáticos del % fijo)
  const ultimo = [...hist].reverse().find(r => !(r.detalle && r.detalle.automatico)) || null;
  const deshacer = () => {
    if (!confirm(`¿Deshacer el cambio de renta de ${nombrePeriodo(ultimo.desde)}? La renta vuelve a ${fmtMonto(ultimo.valorAnterior, c.moneda)}.`)) return;
    update(s => { const cc = contratoDe(s); cc.reajustes = (cc.reajustes || []).filter(x => x.id !== ultimo.id); },
      `Deshizo el cambio de renta de ${nombrePeriodo(ultimo.desde)} en "${nombreUnidad(p, u)}"`);
  };
  const historial = hist.length > 0 && (
    <div style={{ marginTop: 10, paddingTop: 8, borderTop: `1px solid ${C.border}` }}>
      <div className="label" style={{ marginBottom: 4 }}>Historial de cambios de renta</div>
      {hist.slice().reverse().map(r => (
        <div key={r.id} style={{ fontSize: 12, padding: "3px 0" }}>
          <b>{nombrePeriodo(r.desde)}</b>: {fmtMonto(r.valorAnterior, c.moneda)} → {fmtMonto(r.valorNuevo, c.moneda)} <span className="muted">· {detalleIndice(r)}{r.registradoPor ? ` · aplicó ${r.registradoPor}${r.creado ? " el " + fmtFecha(r.creado.slice(0, 10)) : ""}` : ""}</span>
          {ultimo && r.id === ultimo.id && esAdminEmp(user) && <button className="btn btn-ghost btn-sm" style={{ marginLeft: 6, padding: "1px 8px" }} onClick={deshacer}>Deshacer</button>}
        </div>
      ))}
    </div>
  );
  if (!reajusteActivo(c)) return <div className="muted" style={{ marginTop: 10 }}>Sin reajuste pactado.{puede(user, "editar") ? " Puedes configurarlo (IPC, UF o % fijo) al editar el contrato." : ""}{historial}</div>;
  const prox = proximoReajuste(c, actual), pend = reajustePendiente(c, actual), dias = diasParaReajuste(c, hoy);
  const aviso = !pend && dias != null && dias <= avisoReajuste(c);
  const siguiente = tipo === "pct" ? rentaMes(c, prox) : calc && calc.desde === prox ? calc.valorNuevo : null;
  const calcular = async () => {
    setCargando(true);
    try { setCalc(await calcularReajuste(c, prox)); }
    catch (e) { toast("No se pudo obtener el índice: " + e.message); }
    finally { setCargando(false); }
  };
  const aplicar = () => {
    const r = { id: uid(), ...calc, registradoPor: user.nombre };
    update(s => { const cc = contratoDe(s); cc.reajustes = [...(cc.reajustes || []), r]; },
      `Aplicó reajuste ${TIPOS_REAJUSTE[tipo]} (${pctTxt(r.variacionPct)}) en "${nombreUnidad(p, u)}": ${fmtMonto(r.valorAnterior, c.moneda)} → ${fmtMonto(r.valorNuevo, c.moneda)} desde ${nombrePeriodo(r.desde)}`);
    setCalc(null); toast("Reajuste aplicado: los cobros desde " + nombrePeriodo(r.desde) + " salen con la renta nueva");
  };
  return (
    <div className="card" style={{ marginTop: 10, padding: 12, background: pend ? C.warningBg : aviso ? C.infoBg : C.bg }}>
      <div className="row between" style={{ alignItems: "flex-start" }}>
        <div style={{ fontSize: 12.5 }}>
          <b>Reajuste:</b> {descripcionReajuste(c)}{c.moneda === "UF" ? " · renta en UF (se paga en pesos a la UF del día del pago)" : ""}
          <div style={{ marginTop: 6, display: "grid", gridTemplateColumns: "auto auto", gap: "2px 14px", justifyContent: "start" }}>
            <span className="muted">Renta vigente</span><b>{fmtRenta(c)}</b>
            <span className="muted">Próximo reajuste</span><span>{nombrePeriodo(prox)}{pend ? " · pendiente de aplicar" : dias != null && dias >= 0 ? ` · en ${dias} días` : ""}</span>
            <span className="muted">Renta que viene</span><span>{siguiente != null ? <b>{fmtMonto(siguiente, c.moneda)}{c.iva ? " + IVA" : ""}</b> : tipo === "ipc" ? "según IPC del período" : "según variación de la UF"}{calc && calc.desde === prox ? <span className="muted"> ({detalleIndice(calc)})</span> : null}</span>
          </div>
          {pend && <div style={{ marginTop: 6, color: C.warning }}>⚠️ El reajuste de {nombrePeriodo(pend)} aún no se aplica: los cobros siguen con la renta anterior.</div>}
          {aviso && <div style={{ marginTop: 6, color: C.info }}>🔔 Reajuste en {dias} días: avisa al arrendatario.</div>}
        </div>
        {tipo !== "pct" && puede(user, "editar") && (
          <div className="row" style={{ flexShrink: 0 }}>
            {(!calc || calc.desde !== prox) && (pend || tipo === "ipc") && <button className="btn btn-ghost btn-sm" disabled={cargando} onClick={calcular}>{cargando ? "Calculando…" : pend ? "Calcular" : "Estimar"}</button>}
            {calc && calc.desde === prox && pend && <button className="btn btn-primary btn-sm" onClick={aplicar}>Aplicar reajuste</button>}
          </div>
        )}
      </div>
      {historial}
    </div>
  );
}

  const [tab, setTab] = useState("resumen");
  const [modal, setModal] = useState(null);
  useEffect(() => { setTab("resumen"); }, [unidadId]);
  useEffect(() => { const f = e => e.key === "Escape" && !e.defaultPrevented && !document.querySelector(".overlay") && onClose(); window.addEventListener("keydown", f); return () => window.removeEventListener("keydown", f); }, [onClose]);
  if (!p) return null;
  const esCentro = p.tipo === "centro";
  const u = esCentro ? p.unidades.find(x => x.id === unidadId) : p.unidades[0];
  const cp = calcPropiedad(p, hoy, uf);
  const esAdm = esAdminEmp(user) && !user.soloLectura;

  const eliminar = () => {
    const n = p.unidades.length, pagos = p.unidades.reduce((t, x) => t + [...(x.historial || []), ...(x.contrato ? [x.contrato] : [])].reduce((s, c) => s + (c.pagos || []).length, 0), 0);

    update(s => { s.propiedades = s.propiedades.filter(x => x.id !== p.id); }, `Eliminó la propiedad "${p.nombre}"`);
    onClose();
  };

  return (
    <>
      <div className="drawer-bg" onClick={onClose} />

          <div className="row between" style={{ flexWrap: "nowrap" }}>

            <a className="btn btn-ghost btn-sm" href={`https://www.google.com/maps?q=${p.lat},${p.lng}`} target="_blank" rel="noopener">🗺️ Google Maps</a>
            {esAdm && !u && <button className="btn btn-danger btn-sm" onClick={eliminar}>Eliminar</button>}
            {esAdm && u && !esCentro && <button className="btn btn-danger btn-sm" onClick={eliminar}>Eliminar</button>}

        </div>
        <div className="drawer-body">

  );

function FichaUnidad({ p, u, tab, setTab, setModal }) {
  const { st, hoy, uf, user, update, toast } = useApp();
  if (!u) return <div className="empty">Unidad no encontrada.</div>;
  const r = calcUnidad(u, hoy, uf);
  const c = u.contrato;
  const a = c?.arrendatario || {};
  const esAdm = esAdminEmp(user) && !user.soloLectura;
  const arr = arrendadorDe(st, p);
  const docs = st.documentos.filter(d => d.unidadId === u.id);
  const interes = st.interesados.filter(x => x.unidadId === u.id);

  const toggleMulta = () => update(s => {
    const cc = s.propiedades.find(x => x.id === p.id).unidades.find(x => x.id === u.id).contrato;
    cc.multa = { ...cc.multa, cobrar: !cc.multa.cobrar };
  }, `${c.multa.cobrar ? "Desactivó" : "Activó"} el cobro de multa en "${nombreUnidad(p, u)}"`);

  const terminar = () => {
    if (!confirm(`¿Terminar el contrato de ${a.nombre}? La unidad quedará desocupada y el contrato pasará al historial.`)) return;
    update(s => {
      const uu = s.propiedades.find(x => x.id === p.id).unidades.find(x => x.id === u.id);
      uu.historial = [...(uu.historial || []), { ...uu.contrato, terminado: toISO(new Date()) }];
      uu.contrato = null;
    }, `Terminó el contrato de ${a.nombre} en "${nombreUnidad(p, u)}"`);
    toast("Contrato terminado. La unidad quedó disponible.");
  };

  const borrarPago = pg => {
    const que = pg.esAbono ? `el abono de ${fmtCLP(pg.montoCLP)}` : "el pago";
    if (!confirm(`¿Eliminar ${que} de ${nombrePeriodo(pg.periodo)}?`)) return;
    update(s => {
      const cc = s.propiedades.find(x => x.id === p.id).unidades.find(x => x.id === u.id).contrato;
      if (pg.esAbono) cc.abonos = (cc.abonos || []).filter(x => x.id !== pg.id);
      else cc.pagos = cc.pagos.filter(x => x.id !== pg.id);
    }, `Eliminó ${que} de ${nombrePeriodo(pg.periodo)} en "${nombreUnidad(p, u)}"`);
  };

  const tabs = c ? [["resumen", "Resumen"], ["arrendatario", "Arrendatario"], ["pagos", `Pagos${r.deudas.length ? " ⚠️" : ""}`], ["fotos", "Fotos"], ["inventario", `Inventario (${(u.inventario || []).length})`], ["docs", `Documentos (${docs.length})`]]
                 : [["resumen", "Resumen"], ["fotos", "Fotos"], ["inventario", `Inventario (${(u.inventario || []).length})`], ["interesados", `Interesados (${interes.length})`], ["docs", `Documentos (${docs.length})`]];

  return (
    <div>
      {u.fotos?.length ? <img className="cover" style={{ borderRadius: 10, height: 180 }} src={u.fotos[0]} alt="" /> : null}
      {c ? (
        <div className="row" style={{ marginTop: 12 }}>
          {puede(user, "pagos") && <button className="btn btn-primary btn-sm" onClick={() => setModal({ t: "pago" })}>💵 Registrar pago</button>}
          <button className="btn btn-ghost btn-sm" onClick={() => setModal({ t: "comunicar" })}>💬 Contactar</button>
          <button className="btn btn-ghost btn-sm" onClick={() => setModal({ t: "doc", tipo: p.tipo === "centro" || ["local", "oficina", "bodega"].includes(u.categoria) ? "contrato_com" : "contrato_hab" })}>📄 Contrato / anexo</button>
        </div>
      ) : (
        <div className="row" style={{ marginTop: 12 }}>
          <button className="btn btn-primary btn-sm" onClick={() => setModal({ t: "compartir" })}>📤 Enviar a interesado</button>
          {puede(user, "editar") && <button className="btn btn-ghost btn-sm" onClick={() => setModal({ t: "editar" })}>🔑 Arrendar (crear contrato)</button>}
        </div>
      )}

      <div className="tabs">{tabs.map(([k, l]) => <button key={k} className={"tab" + (tab === k ? " active" : "")} onClick={() => setTab(k)}>{l}</button>)}</div>
      <div style={{ paddingTop: 16 }}>
        {tab === "resumen" && (
          <div className="grid" style={{ gap: 18 }}>
            {c && (
              <div className="card" style={{ background: EST[r.estado].bg, borderColor: EST[r.estado].color + "55", padding: 14 }}>
                <div className="row between">
                  <div>
                    <div className="muted">Renta mensual</div>
                    <div style={{ fontSize: 22, fontWeight: 700 }}>{fmtRenta(c)}</div>
                    {c.moneda === "UF" && <div className="muted">≈ {fmtCLP(r.canonCLP)} (UF {fmtCLP(uf)})</div>}
                    {reajusteActivo(c) && <div className="muted">Reajuste {descripcionReajuste(c)}{reajustePendiente(c, periodoDe(hoy)) ? ` · ⚠️ pendiente de aplicar (${nombrePeriodo(reajustePendiente(c, periodoDe(hoy)))})` : ` · próximo ${nombrePeriodo(proximoReajuste(c, periodoDe(hoy)))}`}</div>}
                  </div>
                  <div style={{ textAlign: "right" }}>
                    <Badge estado={r.estado} />
                    <div className="muted" style={{ marginTop: 6 }}>{r.proxVenc ? `Próximo pago: ${fmtFecha(r.proxVenc)}` : ""}</div>
                  </div>
                </div>
                {r.deudas.length > 0 && (
                  <div style={{ marginTop: 10, paddingTop: 10, borderTop: `1px solid ${EST.atrasado.color}33` }}>
                    <div style={{ fontWeight: 700, color: "#B91C1C" }}>Deuda: {fmtCLP(r.deudaCLP)}</div>
                    {r.deudas.map(d => <div key={d.periodo} className="muted">{nombrePeriodo(d.periodo)} · {d.dias} días de atraso{d.multa ? ` · multa ${fmtMonto(d.multa, c.moneda)}` : ""}</div>)}
                  </div>
                )}
              </div>
            )}
            <div>
              <div className="h2">Datos de la propiedad</div>
              <dl className="kv">
                <dt>Tipo</dt><dd>{CATEGORIAS[u.categoria]}{p.tipo === "centro" ? ` en ${p.nombre}` : ""}</dd>
                {(p.direccion || p.comuna) && <><dt>Dirección</dt><dd>{[p.direccion, p.comuna].filter(Boolean).join(", ")}</dd></>}
                {u.m2 ? <><dt>Superficie</dt><dd>{u.m2} m²</dd></> : null}
                {u.dormitorios ? <><dt>Dormitorios</dt><dd>{u.dormitorios}</dd></> : null}
                {u.banos ? <><dt>Baños</dt><dd>{u.banos}</dd></> : null}
                {u.estacionamientos ? <><dt>Estacionamientos</dt><dd>{u.estacionamientos}</dd></> : null}
                {p.rol && <><dt>Rol SII</dt><dd>{p.rol}</dd></>}
                <dt>Coordenadas</dt><dd className="mono" style={{ fontSize: 12 }}>{Number(p.lat).toFixed(5)}, {Number(p.lng).toFixed(5)}</dd>
                {!c && u.precioUF ? <><dt>Precio publicado</dt><dd>{fmtUF(u.precioUF)} ≈ {fmtCLP(u.precioUF * uf)}</dd></> : null}
                {u.descripcion && <><dt>Descripción</dt><dd>{u.descripcion}</dd></>}
              </dl>
            </div>
            {c && (
              <div>
                <div className="h2">Datos del arriendo</div>
                <dl className="kv">
                  <dt>Arrendatario</dt><dd>{a.nombre}</dd>
                  <dt>Vigencia</dt><dd>{fmtFecha(c.inicio)} al {fmtFecha(c.termino)} {r.diasTermino != null && r.diasTermino <= DIAS_AVISO_TERMINO && <span className="tag" style={{ background: C.warningBg, color: C.warning }}>{r.diasTermino < 0 ? "vencido" : `termina en ${r.diasTermino} días`}</span>}</dd>
                  <dt>Día de pago</dt><dd>{c.diaPago} de cada mes</dd>
                  <dt>Garantía</dt><dd>{c.garantia ? fmtMonto(c.garantia, c.moneda) : "—"}</dd>
                  <dt>Multa</dt><dd>{descripcionMulta(c)}</dd>
                </dl>
                <div className="card" style={{ marginTop: 10, padding: 12, background: c.multa?.cobrar ? C.warningBg : C.bg }}>
                  <div className="row between">
                    <span style={{ fontSize: 12.5 }}><b>Cobro de multa:</b> {c.multa?.cobrar ? "activo — se aplica automáticamente al vencer" : "desactivado"}</span>
                    {esAdm ? <button className="btn btn-ghost btn-sm" onClick={toggleMulta}>{c.multa?.cobrar ? "Desactivar" : "Activar"}</button> : <span className="muted">Lo decide un administrador</span>}
                  </div>
                </div>
                <ReajusteFicha p={p} u={u} c={c} />
              </div>
            )}
            <div>
              <div className="h2">Servicios</div>
              <ServiciosFicha servicios={u.servicios} />
            </div>
            <div>
              <div className="h2">{p.propietarioId ? "Propietario (arrendador)" : "Arrendador"}</div>
              <dl className="kv"><dt>Nombre</dt><dd>{arr.nombre}</dd>{arr.rut && <><dt>RUT</dt><dd>{arr.rut}</dd></>}</dl>
              <div style={{ marginTop: 8 }}><Contactar tel={arr.telefono} email={arr.email} compacto mensaje={`Hola ${arr.nombre || ""}, te escribo por la propiedad ${nombreUnidad(p, u)} (${p.direccion}).`} asunto={`Propiedad ${nombreUnidad(p, u)}`} /></div>
            </div>
            {c && esAdm && <button className="btn btn-danger btn-sm" style={{ justifySelf: "start" }} onClick={terminar}>Terminar contrato y dejar disponible</button>}
            {(u.historial || []).length > 0 && (
              <div><div className="h2">Contratos anteriores</div>
                {u.historial.map((h, i) => <div key={i} className="muted">{h.arrendatario?.nombre} · {fmtFecha(h.inicio)} al {fmtFecha(h.terminado || h.termino)} · {fmtMonto(h.valor, h.moneda)}</div>)}
              </div>
            )}
          </div>
        )}

        {tab === "arrendatario" && c && (
          <div className="grid" style={{ gap: 14 }}>
            <dl className="kv">
              <dt>Nombre</dt><dd>{a.nombre}</dd>
              <dt>RUT</dt><dd>{a.rut || "—"}</dd>
              <dt>Correo</dt><dd>{a.email || "—"}</dd>
              <dt>Teléfono</dt><dd>{a.telefono || "—"}</dd>
              <dt>Domicilio</dt><dd>{a.domicilio || "—"}</dd>
              {a.giro && <><dt>Giro</dt><dd>{a.giro}</dd></>}
              {a.representante && <><dt>Representante / aval</dt><dd>{a.representante}</dd></>}
            </dl>
            <div className="label">Contacto directo</div>
            <Contactar tel={a.telefono} email={a.email} mensaje={`Estimado/a ${a.nombre}, `} asunto={`Arriendo ${nombreUnidad(p, u)}`} />
            <button className="btn btn-ghost" style={{ justifySelf: "start" }} onClick={() => setModal({ t: "comunicar" })}>Usar plantilla (recordatorio, atraso, etc.)</button>
          </div>
        )}

        {tab === "pagos" && c && (
          <div className="grid" style={{ gap: 14 }}>
            {r.deudas.length > 0 && (
              <div className="card" style={{ background: EST.atrasado.bg, borderColor: "#FCA5A5", padding: 14 }}>
                <div className="row between">
                  <b style={{ color: "#B91C1C" }}>Pendiente: {fmtCLP(r.deudaCLP)}</b>
                  <button className="btn btn-ghost btn-sm" onClick={() => setModal({ t: "comunicar", plantilla: "atraso" })}>Enviar aviso de atraso</button>
                </div>
                {r.deudas.map(d => <div key={d.periodo} className="muted" style={{ marginTop: 4 }}>{nombrePeriodo(d.periodo)}: {d.abonadoCLP ? `saldo ${fmtMonto(d.saldo, c.moneda)} (abonado ${fmtCLP(d.abonadoCLP)})` : fmtRenta(c, d.periodo)} · venció {fmtFecha(d.venc)} ({d.dias} días){d.multa ? ` · multa ${fmtMonto(d.multa, c.moneda)}` : ""}</div>)}
              </div>
            )}
            {puede(user, "pagos") && <div className="row">
              <button className="btn btn-primary btn-sm" onClick={() => setModal({ t: "pago" })}>💵 Registrar pago</button>
              <button className="btn btn-ghost btn-sm" onClick={() => setModal({ t: "pago", modo: "abono" })}>Registrar abono</button>
            </div>}
            {!(c.pagos || []).length && !(c.abonos || []).length ? <div className="empty">Sin pagos registrados.</div> : (
              <div className="table-wrap"><table>
                <thead><tr><th>Mes</th><th>Tipo</th><th>Fecha</th><th className="num">Monto</th><th className="num">Multa</th><th>Medio</th><th></th>{esAdm && <th></th>}</tr></thead>
                <tbody>{[...(c.pagos || []), ...(c.abonos || []).map(a => ({ ...a, esAbono: true }))]
                  .sort((x, y) => y.periodo.localeCompare(x.periodo) || (y.fecha || "").localeCompare(x.fecha || "")).map(pg => (
                  <tr key={pg.id} title={`Registró: ${pg.registradoPor}${pg.obs ? " · " + pg.obs : ""}`}>
                    <td style={{ textTransform: "capitalize" }}>{nombrePeriodo(pg.periodo)}</td>
                    <td>{pg.esAbono ? <span className="tag" style={{ background: C.infoBg, color: C.info }}>Abono</span> : "Pago"}</td>
                    <td>{fmtFecha(pg.fecha)}</td>
                    <td className="num">{fmtCLP(pg.montoCLP)}</td><td className="num">{pg.multaCLP ? fmtCLP(pg.multaCLP) : "—"}</td><td>{pg.metodo}</td>
                    <td><button className="btn btn-ghost btn-sm" onClick={() => imprimirHTML(`Recibo ${nombreUnidad(p, u)} ${nombrePeriodo(pg.periodo)}`, htmlRecibo(st, p, u, c, pg))}>🧾 Recibo</button></td>
                    {esAdm && <td><button className="icon-btn" style={{ fontSize: 13 }} onClick={() => borrarPago(pg)}>🗑</button></td>}
                  </tr>))}
                </tbody></table></div>
            )}
          </div>
        )}

        {tab === "fotos" && (
          <Fotos fotos={u.fotos} editable={puede(user, "editar")} onChange={f => update(s => { s.propiedades.find(x => x.id === p.id).unidades.find(x => x.id === u.id).fotos = f; }, `Actualizó fotos de "${nombreUnidad(p, u)}"`)} />
        )}

        {tab === "inventario" && <InventarioTab p={p} u={u} setModal={setModal} />}

        {tab === "interesados" && (
          interes.length ? <div className="grid" style={{ gap: 6 }}>{interes.map(x => (
            <div key={x.id} className="alert-row" style={{ cursor: "default" }}>
              <div style={{ flex: 1 }}><div style={{ fontWeight: 600 }}>{x.nombre || "Sin nombre"}</div><div className="muted">{fmtFecha(x.fecha)} · {x.canal} · {x.telefono} {x.email}{x.nota ? " · " + x.nota : ""}</div></div>
              <Contactar tel={x.telefono} email={x.email} compacto mensaje={`Hola ${x.nombre || ""}, te escribo por la propiedad ${nombreUnidad(p, u)}.`} asunto={`Propiedad ${nombreUnidad(p, u)}`} />
            </div>))}</div> : <div className="empty">Aún no se ha enviado esta propiedad a interesados.</div>
        )}

        {tab === "docs" && (
          <div className="grid" style={{ gap: 10 }}>
            <button className="btn btn-primary btn-sm" style={{ justifySelf: "start" }} onClick={() => setModal({ t: "doc" })}>+ Generar documento</button>
            {docs.length ? docs.map(d => (
              <div key={d.id} className="alert-row" onClick={() => setModal({ t: "doc", doc: d })}>
                <span>📄</span><div style={{ flex: 1 }}><div style={{ fontWeight: 600, fontSize: 13 }}>{d.titulo}</div><div className="muted">{fmtFecha(d.fecha)} · {d.autor}</div></div>
                <button className="btn btn-ghost btn-sm" onClick={e => { e.stopPropagation(); imprimirHTML(d.titulo, d.html); }}>PDF</button>
                <button className="btn btn-ghost btn-sm" onClick={e => { e.stopPropagation(); descargarWord(d.titulo, d.html); }}>Word</button>
              </div>)) : <div className="empty">Sin documentos generados.</div>}
          </div>
        )}
      </div>
    </div>
  );
}


// ─── INVENTARIO ───────────────────────────────────────────────────────────────
const ESTADOS_INV = { nuevo: "Nuevo", bueno: "Bueno", regular: "Regular", malo: "Malo" };
const COLOR_INV = { nuevo: C.success, bueno: C.info, regular: C.warning, malo: C.danger };
const RECINTOS = ["Living", "Comedor", "Cocina", "Dormitorio principal", "Dormitorio 2", "Dormitorio 3", "Baño", "Baño 2", "Logia", "Terraza", "Bodega", "Estacionamiento", "Local", "Oficina", "General"];

function InventarioTab({ p, u, setModal }) {
  const { update, user } = useApp();
  const [editar, setEditar] = useState(null);
  const items = u.inventario || [];
  useFotosFirmadas(items.flatMap(i => i.fotos || []));
  const puedeEditar = puede(user, "editar");
  const recintos = [...new Set(items.map(i => i.recinto || "General"))];

  const guardar = () => {
    const it = { ...editar, nombre: editar.nombre.trim() };
    if (!it.nombre) return alert("Escribe el nombre del ítem");
    const existe = items.some(x => x.id === it.id);
    update(s => {
      const uu = s.propiedades.find(x => x.id === p.id).unidades.find(x => x.id === u.id);
      const lista = [...(uu.inventario || [])];
      const i = lista.findIndex(x => x.id === it.id);
      if (i >= 0) lista[i] = it; else lista.push(it);
      uu.inventario = lista;
    }, `${existe ? "Editó" : "Agregó"} "${it.nombre}" en el inventario de "${nombreUnidad(p, u)}"`);
    setEditar(null);
  };
  const borrar = it => {
    if (!confirm(`¿Quitar "${it.nombre}" del inventario?`)) return;
    update(s => {
      const uu = s.propiedades.find(x => x.id === p.id).unidades.find(x => x.id === u.id);
      uu.inventario = (uu.inventario || []).filter(x => x.id !== it.id);
    }, `Quitó "${it.nombre}" del inventario de "${nombreUnidad(p, u)}"`);
    setEditar(null);
  };

  return (
    <div className="grid" style={{ gap: 14 }}>
      <div className="row">
        {puedeEditar && <button className="btn btn-primary btn-sm" onClick={() => setEditar({ id: uid(), recinto: "", nombre: "", cantidad: 1, estado: "bueno", notas: "", fotos: [] })}>+ Agregar ítem</button>}
        <button className="btn btn-ghost btn-sm" onClick={() => setModal({ t: "doc", tipo: "inventario" })}>📄 Acta de inventario</button>
      </div>
      {!items.length ? <div className="empty">Sin inventario. Agrega muebles, artefactos, llaves y su estado, con fotos.</div> : recintos.map(rc => (
        <div key={rc}>
          <div className="label">{rc}</div>
          <div className="grid" style={{ gap: 6 }}>
            {items.filter(i => (i.recinto || "General") === rc).map(i => (
              <div key={i.id} className="alert-row" onClick={() => puedeEditar && setEditar({ ...i })} style={{ cursor: puedeEditar ? "pointer" : "default" }}>
                {(i.fotos || [])[0] ? <img src={urlFoto(i.fotos[0])} alt="" style={{ width: 52, height: 40, objectFit: "cover", borderRadius: 6, flexShrink: 0 }} /> : <span style={{ fontSize: 22, width: 52, textAlign: "center" }}>📦</span>}
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontWeight: 600, fontSize: 13 }}>{i.nombre}{Number(i.cantidad) > 1 ? ` × ${i.cantidad}` : ""}</div>
                  <div className="muted">{i.notas || ""}{(i.fotos || []).length ? `${i.notas ? " · " : ""}${i.fotos.length} foto${i.fotos.length > 1 ? "s" : ""}` : ""}</div>
                </div>
                <span className="tag" style={{ background: C.bg, color: COLOR_INV[i.estado] || C.textDim, border: `1px solid ${C.border}` }}>{ESTADOS_INV[i.estado] || "—"}</span>
              </div>
            ))}
          </div>
        </div>
      ))}
      {editar && (
        <Modal titulo={items.some(x => x.id === editar.id) ? `Editar: ${editar.nombre}` : "Nuevo ítem de inventario"} onClose={() => setEditar(null)} ancho={640}
          pie={<>
            {items.some(x => x.id === editar.id) && <button className="btn btn-danger" style={{ marginRight: "auto" }} onClick={() => borrar(editar)}>Quitar</button>}
            <button className="btn btn-ghost" onClick={() => setEditar(null)}>Cancelar</button>
            <button className="btn btn-primary" onClick={guardar}>Guardar</button>
          </>}>
          <div className="form-grid">
            <Campo label="Recinto"><input className="input" list="recintos-inv" value={editar.recinto} onChange={e => setEditar({ ...editar, recinto: e.target.value })} placeholder="Ej: Cocina" /></Campo>
            <Campo label="Ítem"><input className="input" value={editar.nombre} onChange={e => setEditar({ ...editar, nombre: e.target.value })} placeholder="Ej: Refrigerador Samsung" autoFocus /></Campo>
            <Campo label="Cantidad"><input className="input" type="number" min="1" value={editar.cantidad} onChange={e => setEditar({ ...editar, cantidad: e.target.value })} /></Campo>
            <Campo label="Estado">
              <select className="select" value={editar.estado} onChange={e => setEditar({ ...editar, estado: e.target.value })}>
                {Object.entries(ESTADOS_INV).map(([k, l]) => <option key={k} value={k}>{l}</option>)}
              </select>
            </Campo>
            <Campo label="Observaciones" span><textarea className="input" rows={2} value={editar.notas} onChange={e => setEditar({ ...editar, notas: e.target.value })} placeholder="Ej: rayón en la puerta, funciona bien" /></Campo>
          </div>
          <datalist id="recintos-inv">{RECINTOS.map(r => <option key={r} value={r} />)}</datalist>
          <div className="label" style={{ marginTop: 14 }}>Fotos</div>
          <Fotos fotos={editar.fotos} privado onChange={f => setEditar({ ...editar, fotos: f })} />
        </Modal>
      )}
    </div>
  );
}


// ─── DOCUMENTOS ───────────────────────────────────────────────────────────────
function DocumentoModal({ p, u, tipoInicial, doc, onClose }) {
  const { st, hoy, uf, update, user, toast } = useApp();
  const [tipo, setTipo] = useState(doc ? doc.tipo : tipoInicial || (u.contrato ? "anexo_renta" : "contrato_hab"));
  const [extra, setExtra] = useState({ nuevoValor: "", desde: toISO(hoy), nuevoTermino: "", texto: "", fechaTermino: toISO(hoy) });
  const [version, setVersion] = useState(0);
  // documento guardado: se abre con su texto editado; al cambiar el tipo o "Restablecer" se vuelve a la plantilla
  const [guardado, setGuardado] = useState(doc ? doc.html : null);
  const ref = useRef(null);
  useEffect(() => {
    const refs = [...(tipo === "inventario" ? (u.inventario || []).flatMap(i => i.fotos || []) : []), ...((doc && doc.html.match(/privado:[0-9a-f-]+\/[0-9a-f-]+\.jpg/gi)) || [])];
    firmarFotos(refs).then(c => { if (c) { setVersion(v => v + 1); if (guardado != null) setGuardado(g => g + " "); } }).catch(() => {});
  }, [tipo]);
  const html = useMemo(() => guardado ?? generarDocumento(tipo, { st, p, u, extra, hoy, uf }), [tipo, extra, version, guardado]);
  useEffect(() => { if (ref.current) ref.current.innerHTML = limpiarHTML(html); }, [html]);
  const titulo = doc && guardado != null ? doc.titulo : `${TIPOS_DOC[tipo]} - ${nombreUnidad(p, u)}`;
  // al guardar, los enlaces firmados de fotos privadas vuelven a ser referencias (los enlaces vencen)
  const conReferencias = x => [...fotosFirmadas.entries()].reduce((t, [r, v]) => t.split(v.url.replace(/&/g, "&amp;")).join(r).split(v.url).join(r), x);
  const actual = () => limpiarHTML(ref.current ? ref.current.innerHTML : html);
  const c = u.contrato;
  const e = st.empresa;
  const faltanEmpresa = ["contrato_hab", "contrato_com", "anexo_renta", "anexo_prorroga", "anexo_libre", "termino"].includes(tipo)
    ? [["rut", "RUT"], ["direccion", "domicilio"], ["representante", "representante legal"]].filter(([k]) => !e[k]).map(([, l]) => l) : [];
  const blancos = (html.match(/_{3,}/g) || []).length;
  // Anexo de renta o prórroga: además del documento, se puede aplicar al contrato
  const aplicable = !doc && c && ((tipo === "anexo_renta" && Number(extra.nuevoValor) > 0 && extra.desde) || (tipo === "anexo_prorroga" && extra.nuevoTermino));
  const aplicarAlContrato = () => update(s => {
    const cc = s.propiedades.find(x => x.id === p.id).unidades.find(x => x.id === u.id).contrato;
    if (tipo === "anexo_prorroga") cc.termino = extra.nuevoTermino;
    const nuevo = Number(String(extra.nuevoValor).replace(",", "."));
    if (nuevo > 0) {
      const desde = tipo === "anexo_renta" ? extra.desde.slice(0, 7) : sumarMes(periodoDe(parseISO(c.termino || extra.nuevoTermino)), 1);
      const ant = rentaMes(cc, sumarMes(desde, -1));
      cc.reajustes = [...(cc.reajustes || []).filter(r => r.desde !== desde), { id: uid(), desde, tipo: "pct", variacionPct: ant ? Math.round((nuevo / ant - 1) * 1000000) / 10000 : 0,
        detalle: { anexo: true, documento: TIPOS_DOC[tipo] }, valorAnterior: ant, valorNuevo: nuevo, registradoPor: user.nombre }];
    }
  }, `Aplicó al contrato de "${nombreUnidad(p, u)}" el ${TIPOS_DOC[tipo].toLowerCase()}${extra.nuevoValor ? `: renta ${extra.nuevoValor} ${c.moneda}` : ""}${tipo === "anexo_prorroga" ? `, término ${fmtFecha(extra.nuevoTermino)}` : ""}`);
  const guardar = () => {
    if (doc && guardado != null) {
      update(s => { const d = s.documentos.find(x => x.id === doc.id); if (d) d.html = conReferencias(actual()); }, `Editó "${doc.titulo}"`);
      toast("Documento actualizado"); return;
    }
    update(s => { s.documentos.unshift({ id: uid(), propId: p.id, unidadId: u.id, tipo, titulo, fecha: toISO(new Date()), autor: user.nombre, html: conReferencias(actual()) }); }, `Generó "${titulo}"`);
    if (aplicable && confirm(tipo === "anexo_renta"
      ? `¿Aplicar también la nueva renta (${extra.nuevoValor} ${c.moneda}) al contrato desde ${nombrePeriodo(extra.desde.slice(0, 7)).toLowerCase()}? Los cobros desde ese mes saldrán con la renta nueva.`
      : `¿Aplicar también el nuevo término (${fmtFecha(extra.nuevoTermino)})${extra.nuevoValor ? " y la nueva renta" : ""} al contrato?`)) { aplicarAlContrato(); toast("Documento guardado y aplicado al contrato"); return; }
    toast("Documento guardado en la ficha");
  };
  const necesitaContrato = !u.contrato && !["contrato_hab", "contrato_com", "inventario"].includes(tipo);
  return (
    <Modal titulo="Generar contrato o anexo" onClose={onClose} ancho={920}
      pie={<>
        <button className="btn btn-ghost" onClick={() => imprimirHTML(titulo, actual())}>🖨️ Imprimir / PDF</button>
        <button className="btn btn-ghost" onClick={() => descargarWord(titulo, actual())}>⬇️ Word</button>
        <button className="btn btn-primary" onClick={guardar}>Guardar en la ficha</button>
      </>}>
      <div className="form-grid">
        <Campo label="Documento">
          <select className="select" value={tipo} onChange={e => { setGuardado(null); setTipo(e.target.value); }}>
            {Object.entries(TIPOS_DOC).map(([k, l]) => <option key={k} value={k}>{l}</option>)}
          </select>
        </Campo>
        {(tipo === "anexo_renta" || tipo === "anexo_prorroga") && <Campo label={`Nueva renta (${u.contrato?.moneda || "UF"})`}><input className="input" value={extra.nuevoValor} onChange={e => setExtra({ ...extra, nuevoValor: e.target.value })} /></Campo>}
        {tipo === "anexo_renta" && <Campo label="Vigente desde"><input className="input" type="date" value={extra.desde} onChange={e => setExtra({ ...extra, desde: e.target.value })} /></Campo>}
        {tipo === "anexo_prorroga" && <Campo label="Nuevo término"><input className="input" type="date" value={extra.nuevoTermino} onChange={e => setExtra({ ...extra, nuevoTermino: e.target.value })} /></Campo>}
        {tipo === "termino" && <Campo label="Fecha de término"><input className="input" type="date" value={extra.fechaTermino} onChange={e => setExtra({ ...extra, fechaTermino: e.target.value })} /></Campo>}
        {(tipo === "anexo_libre" || tipo === "entrega") && <Campo label={tipo === "entrega" ? "Estado del inmueble" : "Modificación acordada"} span><textarea className="input" rows={2} value={extra.texto} onChange={e => setExtra({ ...extra, texto: e.target.value })} /></Campo>}
      </div>
      {necesitaContrato && <div className="card" style={{ marginTop: 12, background: C.warningBg, padding: 12, fontSize: 12.5 }}>Esta unidad no tiene contrato registrado: los datos del arrendatario saldrán en blanco.</div>}
      {faltanEmpresa.length > 0 && guardado == null && <div className="card" style={{ marginTop: 12, background: C.warningBg, padding: 12, fontSize: 12.5 }}>Faltan datos de la empresa ({faltanEmpresa.join(", ")}): complétalos en Configuración → Datos de la empresa para que el documento no salga con espacios en blanco.</div>}
      {blancos > 0 && <div className="muted" style={{ marginTop: 8 }}>Este documento tiene {blancos} espacio{blancos > 1 ? "s" : ""} por completar (___): puedes escribir encima antes de imprimir.</div>}
      {doc && guardado != null && <div className="muted" style={{ marginTop: 8 }}>Estás viendo el documento guardado el {fmtFecha(doc.fecha)}. Los cambios se guardan sobre el mismo documento.</div>}
      <div className="row between" style={{ margin: "14px 0 8px" }}>
        <span className="muted">Puedes editar el texto directamente antes de imprimir o guardar.</span>
        <button className="btn btn-ghost btn-sm" onClick={() => { setGuardado(null); setVersion(v => v + 1); }}>{doc && guardado != null ? "Generar de nuevo desde la plantilla" : "Restablecer texto"}</button>
      </div>
      <div ref={ref} className="doc-editor" contentEditable suppressContentEditableWarning />
      <div className="muted" style={{ marginTop: 8 }}>⚖️ Borrador de referencia: revísalo con un abogado antes de firmar.</div>
    </Modal>
  );
}

function exportarCobranza(st, hoy, uf, toast) {
  if (!permiteExportar(st, toast)) return;
  const filas = listarUnidades(st).filter(x => x.u.contrato).map(({ p, u }) => {
    const c = u.contrato, r = calcUnidad(u, hoy, uf);
    return [nombreUnidad(p, u), c.arrendatario.nombre, arrendadorDe(st, p).nombre, EST[r.estado].label, r.proxVenc ? fmtFecha(r.proxVenc) : "",
      fmtRenta(c), Math.round(r.canonCLP), Math.round(aCLP(r.multa, c.moneda, uf)), Math.round(r.deudaCLP), r.abonosPendCLP || 0];
  });
  descargarExcel(`cobranza-${toISO(hoy)}`, [["Unidad", "Arrendatario", "Propietario", "Estado", "Próximo vencimiento", "Renta", "Renta en pesos (UF de hoy)", "Multa", "Deuda", "Abonado"], ...filas]);
}

  const borrar = pr => {

    if (!confirm(`¿Eliminar a ${pr.nombre}? Sus propiedades quedarán sin propietario asignado.`)) return;
    update(s => {
      s.propietarios = s.propietarios.filter(x => x.id !== pr.id);
      s.propiedades.forEach(p => { if (p.propietarioId === pr.id) p.propietarioId = ""; });

  };
  return (
    <div className="grid fade-up" style={{ gap: 14 }}>
      <div className="row between">

        <div className="table-wrap"><table>
          <thead><tr><th>Nombre</th><th>RUT</th><th>Propiedades</th><th className="num">Comisión</th><th>Contacto</th><th></th></tr></thead>
          <tbody>{st.propietarios.map(pr => (
            <tr key={pr.id}>
              <td style={{ fontWeight: 600 }}>{pr.nombre}</td>
              <td>{pr.rut || "—"}</td>
              <td>{suyas(pr.id).map(p => p.nombre).join(", ") || <span className="muted">sin propiedades</span>}</td>
              <td className="num">{pr.comisionPct}%{pr.comisionIva !== false ? " + IVA" : ""}</td>
              <td><Contactar tel={pr.telefono} email={pr.email} compacto asunto="Administración de su propiedad" mensaje={`Hola ${pr.nombre}, `} /></td>
              <td><div className="row" style={{ flexWrap: "nowrap" }}>
                <button className="btn btn-ghost btn-sm" onClick={() => setEditar({ ...structuredClone(pr), propiedades: suyas(pr.id).map(p => p.id) })}>Editar</button>
                <button className="btn btn-ghost btn-sm" onClick={() => borrar(pr)}>Eliminar</button>

            </tr>))}</tbody>

    </div>
  );
}

// Liquidación al propietario: lo efectivamente recibido en el mes (por fecha del pago o abono)
// en sus propiedades, menos la comisión de administración (+ IVA) y los descuentos.
// La comisión se calcula sobre la renta sin IVA; las multas van íntegras al propietario.
// Cobros recibidos (por fecha de pago) de una propiedad en el mes
function cobrosDePropiedad(p, periodo) {
  const cobros = [];
  p.unidades.forEach(u => {
    [...(u.historial || []), ...(u.contrato ? [u.contrato] : [])].forEach(c => {
      const base = { unidad: nombreUnidad(p, u), arrendatario: (c.arrendatario || {}).nombre || "" };
      (c.pagos || []).filter(pg => (pg.fecha || "").slice(0, 7) === periodo).forEach(pg => cobros.push({
        ...base, ref: "pago:" + pg.id, fecha: pg.fecha, concepto: `Arriendo ${nombrePeriodo(pg.periodo)}`,
        renta: Math.round(pg.montoCLP || 0), iva: Math.round(pg.ivaCLP || 0), multa: Math.round(pg.multaCLP || 0) }));
      (c.abonos || []).filter(a => (a.fecha || "").slice(0, 7) === periodo).forEach(a => cobros.push({
        ...base, ref: "abono:" + a.id, fecha: a.fecha, concepto: `Abono ${nombrePeriodo(a.periodo)}`,
        renta: Math.round(a.montoCLP), iva: c.iva ? Math.round(a.montoCLP * TASA_IVA / (1 + TASA_IVA)) : 0, multa: 0 }));
    });
  });
  return cobros;
}
function calcLiquidacion(st, pr, periodo, descuentos = []) {
  const cobros = st.propiedades.filter(p => p.propietarioId === pr.id).flatMap(p => cobrosDePropiedad(p, periodo));
  cobros.sort((a, b) => a.fecha < b.fecha ? -1 : a.fecha > b.fecha ? 1 : 0);
  const totalCobrado = cobros.reduce((t, x) => t + x.renta + x.multa, 0);
  const baseComision = cobros.reduce((t, x) => t + x.renta - x.iva, 0);
  const pct = Number(pr.comisionPct) || 0, conIva = pr.comisionIva !== false;
  const comision = Math.round(baseComision * pct / 100);
  const ivaComision = conIva ? Math.round(comision * TASA_IVA) : 0;
  const desc = descuentos.filter(d => d.concepto.trim() || Number(d.monto)).map(d => ({ concepto: d.concepto.trim() || "Descuento", monto: Math.round(Number(d.monto)) || 0 }));
  const totalDescuentos = desc.reduce((t, d) => t + d.monto, 0);
  return { cobros, descuentos: desc, pct, comisionIva: conIva, baseComision, totalCobrado, comision, ivaComision, totalDescuentos,
    total: totalCobrado - comision - ivaComision - totalDescuentos };
}
// Comisión de cada corredor en el mes: su % sobre la comisión de administración (renta sin IVA × % del
// propietario) que generaron los cobros de las propiedades que tiene a cargo.
function calcComisiones(st, periodo) {
  return st.usuarios.filter(u => u.rol === "corredor").map(c => {
    const filas = st.propiedades.filter(p => p.corredorId === c.id).map(p => {
      const pr = p.propietarioId && (st.propietarios || []).find(x => x.id === p.propietarioId);
      const cobros = cobrosDePropiedad(p, periodo);
      const base = cobros.reduce((t, x) => t + x.renta - x.iva, 0);
      return { p, pr, cobrado: cobros.reduce((t, x) => t + x.renta + x.multa, 0), pctAdm: pr ? Number(pr.comisionPct) || 0 : 0,
        comisionAdm: pr ? Math.round(base * (Number(pr.comisionPct) || 0) / 100) : 0 };
    });
    const totalAdm = filas.reduce((t, x) => t + x.comisionAdm, 0), pct = Number(c.comisionPct) || 0;
    return { c, filas, totalAdm, pct, comision: Math.round(totalAdm * pct / 100), cobrado: filas.reduce((t, x) => t + x.cobrado, 0) };
  });
}
function htmlComision(st, x, periodo) {
  const h = esc, e = st.empresa;
  const filas = x.filas.map(f => `<tr><td>${h(f.p.nombre)}</td><td>${h(f.pr ? f.pr.nombre : "Sin propietario")}</td><td style="text-align:right">${fmtCLP(f.cobrado)}</td><td style="text-align:right">${f.pctAdm.toLocaleString("es-CL")}%</td><td style="text-align:right">${fmtCLP(f.comisionAdm)}</td></tr>`).join("")
    || `<tr><td colspan="5">Sin propiedades a cargo.</td></tr>`;
  return `<h2>Comisión de corredor · ${nombrePeriodo(periodo)}</h2>
<p><b>${h(e.nombre)}</b>${e.rut ? ` · RUT ${h(e.rut)}` : ""}</p>
<table><tr><td>Corredor</td><td><b>${h(x.c.nombre)}</b></td></tr><tr><td>Comisión pactada</td><td>${x.pct.toLocaleString("es-CL")}% de la comisión de administración</td></tr></table>
<p><br/><b>Propiedades a cargo</b> (cobros recibidos en el mes)</p>
<table border="1" cellpadding="6" style="border-collapse:collapse"><tr><td><b>Propiedad</b></td><td><b>Propietario</b></td><td style="text-align:right"><b>Cobrado</b></td><td style="text-align:right"><b>% adm.</b></td><td style="text-align:right"><b>Comisión adm.</b></td></tr>${filas}
<tr><td colspan="4"><b>Total comisión de administración</b></td><td style="text-align:right">${fmtCLP(x.totalAdm)}</td></tr>
<tr><td colspan="4"><b>Comisión del corredor (${x.pct.toLocaleString("es-CL")}%)</b></td><td style="text-align:right"><b>${fmtCLP(x.comision)}</b></td></tr></table>`;
}

// Valores de una liquidación emitida (lo guardado) o en borrador (lo calculado)
const valoresLiq = l => l.detalle ? { ...l.detalle, totalCobrado: l.totalCobrado, comision: l.comision, ivaComision: l.ivaComision, totalDescuentos: l.descuentos, total: l.total } : l;

function htmlLiquidacion(st, pr, periodo, v, emitida) {
  const h = esc, e = st.empresa, b = pr.banco || {};
  const filas = v.cobros.map(c => `<tr><td>${fmtFecha(c.fecha)}</td><td>${h(c.unidad)}</td><td>${h(c.arrendatario)}</td><td>${h(c.concepto)}${c.multa ? ` + multa ${fmtCLP(c.multa)}` : ""}</td><td style="text-align:right">${fmtCLP(c.renta + c.multa)}</td></tr>`).join("")
    || `<tr><td colspan="5">Sin cobros recibidos en el período.</td></tr>`;
  const linea = (t, m, neg) => `<tr><td colspan="4">${t}</td><td style="text-align:right">${neg && m ? "− " : ""}${fmtCLP(m)}</td></tr>`;
  return `<h2>Liquidación de arriendos · ${nombrePeriodo(periodo)}</h2>
<p><b>${h(e.nombre)}</b>${e.rut ? ` · RUT ${h(e.rut)}` : ""}${e.direccion ? ` · ${h(e.direccion)}` : ""}</p>
<table><tr><td>Propietario</td><td><b>${h(pr.nombre)}</b>${pr.rut ? ` · RUT ${h(pr.rut)}` : ""}</td></tr>
${b.numero ? `<tr><td>Cuenta de destino</td><td>${h(b.banco)} · ${h(b.tipo)} N° ${h(b.numero)} · ${h(b.titular || pr.nombre)}${b.rut || pr.rut ? ` · RUT ${h(b.rut || pr.rut)}` : ""}</td></tr>` : ""}
<tr><td>Estado</td><td>${emitida ? { emitida: "Emitida", pagada: `Pagada el ${fmtFecha(emitida.pagadaEn)}${emitida.medio ? " · " + h(emitida.medio) : ""}`, anulada: "Anulada" }[emitida.estado] + ` · emitida el ${fmtFecha(emitida.creado.slice(0, 10))}${emitida.emitidaPor ? " por " + h(emitida.emitidaPor) : ""}` : "Borrador (no emitida)"}</td></tr></table>
<p><br/><b>Cobros recibidos</b></p>
<table border="1" cellpadding="6" style="border-collapse:collapse"><tr><td><b>Fecha</b></td><td><b>Unidad</b></td><td><b>Arrendatario</b></td><td><b>Concepto</b></td><td style="text-align:right"><b>Monto</b></td></tr>${filas}
${linea("<b>Total recibido</b>", v.totalCobrado)}
${linea(`Comisión de administración ${String(v.pct).replace(".", ",")}% sobre ${fmtCLP(v.baseComision)} (renta sin IVA)`, v.comision, true)}
${v.comisionIva ? linea("IVA de la comisión (19%)", v.ivaComision, true) : ""}
${v.descuentos.map(d => linea(h(d.concepto), d.monto, true)).join("")}
<tr><td colspan="4"><b>Total a pagar al propietario</b></td><td style="text-align:right"><b>${fmtCLP(v.total)}</b></td></tr></table>
<p><br/>La comisión de administración y su IVA se respaldan con la factura de ${h(e.nombre)}.</p>`;
}

function LiquidacionModal({ pr, periodo, onClose }) {
  const { st, user, toast, recargar, hoy } = useApp();
  const emitida = st.liquidaciones.find(l => l.propietarioId === pr.id && l.periodo === periodo && l.estado !== "anulada");
  const [descuentos, setDescuentos] = useState([]);
  const [pago, setPago] = useState({ fecha: toISO(hoy), medio: "Transferencia" });
  const [enviando, setEnviando] = useState(false);
  const calc = calcLiquidacion(st, pr, periodo, descuentos);
  const v = emitida ? valoresLiq(emitida) : calc;
  const nuevos = emitida ? calc.cobros.filter(c => !(emitida.detalle.cobros || []).some(x => x.ref === c.ref)).length : 0;
  const E = st.empresa.id;
  const accion = async (fn, ok, registro) => {
    setEnviando(true);
    try {
      await fn();
      await q(sb.from("bitacora").insert({ empresa_id: E, user_id: user.id, usuario: user.nombre, accion: registro }));
      toast(ok); await recargar();
    } catch (e) { toast(mensajeError(e)); }
    setEnviando(false);
  };
  const emitir = () => {
    if (!calc.cobros.length && !confirm("No hay cobros recibidos en el período. ¿Emitir igual?")) return;
    const { cobros, descuentos: desc, pct, comisionIva, baseComision } = calc;
    accion(() => q(sb.from("liquidaciones").insert({ id: uid(), empresa_id: E, propietario_id: pr.id, periodo, detalle: { cobros, descuentos: desc, pct, comisionIva, baseComision },
      total_cobrado: calc.totalCobrado, comision: calc.comision, iva_comision: calc.ivaComision, descuentos: calc.totalDescuentos, total: calc.total, emitida_por: user.nombre })),
      "Liquidación emitida", `Emitió la liquidación de ${pr.nombre} de ${nombrePeriodo(periodo)} por ${fmtCLP(calc.total)}`);
  };
  const marcarPagada = () => {
    if (!pago.fecha) return toast("Indica la fecha del pago");
    accion(() => q(sb.from("liquidaciones").update({ estado: "pagada", pagada_en: pago.fecha, medio: pago.medio || null }).eq("id", emitida.id)),
      "Liquidación marcada como pagada", `Pagó la liquidación de ${pr.nombre} de ${nombrePeriodo(periodo)} (${fmtCLP(emitida.total)})`);
  };
  const anular = () => {
    if (emitida.estado === "pagada" && !confirm(`⚠️ Esta liquidación ya figura PAGADA al propietario (${fmtCLP(emitida.total)} el ${fmtFecha(emitida.pagadaEn)}). Anularla no revierte la transferencia. ¿Seguro que quieres anularla?`)) return;
    if (!confirm("¿Anular esta liquidación? Queda registrada como anulada y podrás emitir una nueva.")) return;
    accion(() => q(sb.from("liquidaciones").update({ estado: "anulada" }).eq("id", emitida.id)),
      "Liquidación anulada", `Anuló la liquidación de ${pr.nombre} de ${nombrePeriodo(periodo)}`);
  };
  const updDesc = (i, k, val) => setDescuentos(d => d.map((x, j) => j === i ? { ...x, [k]: val } : x));
  const texto = `Hola ${pr.nombre}, te enviamos la liquidación de arriendos de ${nombrePeriodo(periodo)}: recibido ${fmtCLP(v.totalCobrado)}, comisión ${fmtCLP(v.comision + v.ivaComision)}${v.totalDescuentos ? `, descuentos ${fmtCLP(v.totalDescuentos)}` : ""}. Total a pagar: ${fmtCLP(v.total)}.${emitida && emitida.estado === "pagada" ? ` Transferido el ${fmtFecha(emitida.pagadaEn)}.` : ""}`;
  return (
    <Modal titulo={`Liquidación · ${pr.nombre} · ${nombrePeriodo(periodo)}`} onClose={onClose} ancho={820}
      pie={<>
        <button className="btn btn-ghost" onClick={() => imprimirHTML(`Liquidación ${pr.nombre} ${nombrePeriodo(periodo)}`, htmlLiquidacion(st, pr, periodo, v, emitida))}>🖨️ PDF</button>
        {!emitida && <button className="btn btn-primary" disabled={enviando} onClick={emitir}>Emitir liquidación</button>}
        {emitida && <button className="btn btn-ghost" disabled={enviando} onClick={anular}>Anular</button>}
      </>}>
      {nuevos > 0 && <div className="card" style={{ background: C.warningBg, padding: 10, marginBottom: 12, fontSize: 12.5 }}>Hay {nuevos} cobro{nuevos > 1 ? "s" : ""} de este mes registrado{nuevos > 1 ? "s" : ""} después de emitirla. Anúlala y emite una nueva para incluirlo{nuevos > 1 ? "s" : ""}.</div>}
      <div className="table-wrap"><table>
        <thead><tr><th>Fecha</th><th>Unidad</th><th>Arrendatario</th><th>Concepto</th><th className="num">Monto</th></tr></thead>
        <tbody>
          {!v.cobros.length && <tr><td colSpan={5} className="muted">Sin cobros recibidos en {nombrePeriodo(periodo)}.</td></tr>}
          {v.cobros.map(c => <tr key={c.ref}><td>{fmtFecha(c.fecha)}</td><td>{c.unidad}</td><td>{c.arrendatario}</td><td>{c.concepto}{c.multa ? <span className="muted"> + multa {fmtCLP(c.multa)}</span> : null}</td><td className="num">{fmtCLP(c.renta + c.multa)}</td></tr>)}
        </tbody>
      </table></div>
      <dl className="kv" style={{ marginTop: 14 }}>
        <dt>Total recibido</dt><dd>{fmtCLP(v.totalCobrado)}</dd>
        <dt>Comisión {String(v.pct).replace(".", ",")}%</dt><dd>− {fmtCLP(v.comision)} <span className="muted">(sobre {fmtCLP(v.baseComision)}, renta sin IVA)</span></dd>
        {v.comisionIva && <><dt>IVA comisión</dt><dd>− {fmtCLP(v.ivaComision)}</dd></>}
        {emitida && v.descuentos.map((d, i) => <React.Fragment key={i}><dt>{d.concepto}</dt><dd>− {fmtCLP(d.monto)}</dd></React.Fragment>)}
      </dl>
      {!emitida && (
        <div style={{ marginTop: 12 }}>
          <div className="row between"><div className="label">Descuentos (mantenciones, gastos autorizados, anticipos)</div>
            <button className="btn btn-ghost btn-sm" onClick={() => setDescuentos(d => [...d, { concepto: "", monto: "" }])}>+ Agregar descuento</button></div>
          {descuentos.map((d, i) => (
            <div key={i} className="row" style={{ marginTop: 6, flexWrap: "nowrap" }}>
              <input className="input" placeholder="Concepto" value={d.concepto} onChange={e => updDesc(i, "concepto", e.target.value)} />
              <input className="input" style={{ width: 150 }} type="number" placeholder="Monto $" value={d.monto} onChange={e => updDesc(i, "monto", e.target.value)} />
              <button className="btn btn-ghost btn-sm" onClick={() => setDescuentos(x => x.filter((_, j) => j !== i))}>✕</button>
            </div>))}
        </div>
      )}
      <div className="card" style={{ marginTop: 14, padding: 14, background: C.blueDim }}>
        <div className="row between"><b>Total a pagar al propietario</b><b style={{ fontSize: 20 }}>{fmtCLP(v.total)}</b></div>
        {pr.banco && pr.banco.numero && <div className="muted" style={{ marginTop: 4 }}>{pr.banco.banco} · {pr.banco.tipo} N° {pr.banco.numero} · {pr.banco.titular || pr.nombre}</div>}
      </div>
      {emitida && emitida.estado === "emitida" && (
        <div style={{ marginTop: 14 }}>
          <div className="label">Registrar la transferencia al propietario</div>
          <div className="row" style={{ flexWrap: "nowrap" }}>
            <input className="input" type="date" style={{ width: 170 }} value={pago.fecha} onChange={e => setPago({ ...pago, fecha: e.target.value })} />
            <input className="input" placeholder="Medio" value={pago.medio} onChange={e => setPago({ ...pago, medio: e.target.value })} />
            <button className="btn btn-primary" disabled={enviando} onClick={marcarPagada}>Marcar pagada</button>
          </div>
        </div>
      )}
      {emitida && emitida.estado === "pagada" && <div className="muted" style={{ marginTop: 10 }}>Pagada el {fmtFecha(emitida.pagadaEn)}{emitida.medio ? ` · ${emitida.medio}` : ""}.</div>}
      {emitida && <div style={{ marginTop: 12 }}><Contactar tel={pr.telefono} email={pr.email} asunto={`Liquidación de arriendos ${nombrePeriodo(periodo)}`} mensaje={texto} /></div>}
    </Modal>
  );
}
