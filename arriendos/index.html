// Página pública de la inmobiliaria: <origen>/web/<slug>
const urlWeb = slug => `${location.origin}/web/${slug}`;
const aSlug = t => String(t || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 40);
function WebCard() {
  const { st, update, toast } = useApp();
  const [w, setW] = useState(() => ({ activa: false, titulo: "", descripcion: "", color: "#1A3A8A", whatsapp: "", email: "", ...st.empresa.web, slug: st.empresa.slug || aSlug(st.empresa.nombre) }));
  const set = (k, v) => setW(x => ({ ...x, [k]: v }));
  const [subiendoLogo, setSubiendoLogo] = useState(false);
  const elegirLogo = async e => {
    const f = e.target.files[0]; e.target.value = "";
    if (!f) return;
    if (!/^image\/(png|jpeg|webp)$/.test(f.type)) return toast("Usa una imagen PNG, JPG o WEBP");
    setSubiendoLogo(true);
    try { set("logo", await subirLogo(st.empresa.id, f)); toast("Logo cargado. Presiona Guardar para publicarlo."); }
    catch (err) { toast("No se pudo subir el logo: " + mensajeError(err)); }
    setSubiendoLogo(false);
  };
  const guardado = st.empresa.slug && st.empresa.web && st.empresa.web.activa;
  const libres = listarUnidades(st).filter(x => !x.u.contrato && x.u.publicar !== false).length;
  const guardar = () => {
    const slug = aSlug(w.slug);
    if (slug.length < 3) return toast("La dirección debe tener al menos 3 letras o números");
    // sin un teléfono o correo los interesados no tienen cómo escribir (salvo el formulario)
    if (w.activa && !(w.whatsapp || st.empresa.telefono || w.email || st.empresa.email) && !confirm("La página no tiene WhatsApp ni correo de contacto: los interesados solo podrán usar el formulario. ¿Publicarla de todas formas?")) return;
    const { slug: _, ...web } = w;
    update(s => { s.empresa = { ...s.empresa, slug, web }; }, `${w.activa ? "Publicó" : "Actualizó"} la página web (${slug})`);
    setW(x => ({ ...x, slug }));
    toast(w.activa ? "Página web publicada" : "Guardado (la página está desactivada)");
  };
  return (
    <div className="card">
      <div className="row between">
        <div className="h2">Página web de la inmobiliaria</div>
        <label className="switch"><input type="checkbox" checked={!!w.activa} onChange={e => set("activa", e.target.checked)} />Publicada</label>
      </div>
      <div className="muted" style={{ marginBottom: 10 }}>Muestra al público tus propiedades con fotos, características, precio y filtros: las desocupadas ({libres} hoy) disponibles para contactar y las arrendadas con una franja roja de "No disponible". La dirección exacta y los datos de arrendatarios y propietarios nunca se publican. Los contactos del formulario llegan como interesados a la ficha de cada propiedad.</div>
      <div className="form-grid">
        <Campo label="Dirección de la página"><input className="input" value={w.slug} onChange={e => set("slug", e.target.value)} onBlur={() => set("slug", aSlug(w.slug))} placeholder="mi-inmobiliaria" /></Campo>
        <Campo label="Título"><input className="input" value={w.titulo} onChange={e => set("titulo", e.target.value)} placeholder={st.empresa.nombre} /></Campo>
        <Campo label="WhatsApp de contacto"><input className="input" value={w.whatsapp} onChange={e => set("whatsapp", e.target.value)} placeholder={st.empresa.telefono || "+56 9 1234 5678"} /></Campo>
        <Campo label="Correo de contacto"><input className="input" value={w.email} onChange={e => set("email", e.target.value)} placeholder={st.empresa.email} /></Campo>
        <Campo label="Logo">
          <div className="row" style={{ flexWrap: "nowrap" }}>
            {w.logo && <img src={w.logo} alt="Logo" style={{ height: 38, maxWidth: 110, objectFit: "contain", background: w.color || "#1A3A8A", borderRadius: 6, padding: 4 }} />}
            <label className="btn btn-ghost btn-sm" style={{ cursor: "pointer" }}>{subiendoLogo ? "Subiendo…" : w.logo ? "Cambiar" : "Subir logo"}
              <input type="file" accept="image/png,image/jpeg,image/webp" hidden disabled={subiendoLogo} onChange={elegirLogo} /></label>
            {w.logo && <button type="button" className="btn btn-ghost btn-sm" onClick={() => set("logo", "")}>Quitar</button>}
          </div>
        </Campo>
        <Campo label="Color principal"><input className="input" type="color" style={{ height: 38, padding: 4 }} value={w.color || "#1A3A8A"} onChange={e => set("color", e.target.value)} /></Campo>
        <Campo label="Presentación" span><textarea className="input" rows={2} value={w.descripcion} onChange={e => set("descripcion", e.target.value)} placeholder="Ej: Corredora de propiedades en Santiago desde 2010. Arriendo y venta de casas, departamentos y locales." /></Campo>
      </div>
      <div className="muted" style={{ marginTop: 8 }}>Dirección: <b>{urlWeb(aSlug(w.slug) || "…")}</b></div>
      <div className="row" style={{ marginTop: 12 }}>
        <button className="btn btn-primary" onClick={guardar}>Guardar</button>
        {guardado && <a className="btn btn-ghost" href={urlWeb(st.empresa.slug)} target="_blank" rel="noopener">🌐 Abrir página</a>}
        {guardado && <button className="btn btn-ghost" onClick={() => navigator.clipboard.writeText(urlWeb(st.empresa.slug)).then(() => toast("Enlace copiado"), () => toast(urlWeb(st.empresa.slug)))}>Copiar enlace</button>}
      </div>
    </div>
  );
}

// ─── PANEL DE PLATAFORMA (SaaS) ───────────────────────────────────────────────
// Solo para administradores de plataforma (tabla admins_plataforma). Las políticas RLS ya les
// permiten leer todas las empresas y, según su rol, cambiar suscripciones, cobros y planes.
const ESTADOS_SUS = { prueba: ["En prueba", "#A05A08", "#FFF7ED"], activa: ["Activa", "#0A7A3E", "#EDFAF3"], morosa: ["Morosa", "#B91C1C", "#FEF2F2"], suspendida: ["Suspendida", "#4A5878", "#F1F3F8"], cancelada: ["Cancelada", "#8A9EC0", "#F1F3F8"] };
const mesActual = () => periodoDe(new Date());
// Todas las suscripciones se cobran neto + IVA (19%). Los cobros guardan el total con IVA.
const totalConIVA = neto => Math.round((Number(neto) || 0) * (1 + TASA_IVA));
function MontoCobro({ c }) {
  if (c.monto_clp == null) return <>{c.monto_uf} UF</>;
  const neto = Math.round(c.monto_clp / (1 + TASA_IVA));
  return <>{fmtCLP(c.monto_clp)}<div className="muted">neto {fmtCLP(neto)} + IVA {fmtCLP(c.monto_clp - neto)}</div></>;
}

function EstadoSus({ estado }) {
  const [t, color, bg] = ESTADOS_SUS[estado] || [estado || "—", C.muted, C.bg];
  return <span className="tag" style={{ background: bg, color, border: `1px solid ${color}33` }}>{t}</span>;
}

// Verificación en dos pasos (TOTP con una app como Google Authenticator). La exige la base para
// todo lo de plataforma y para entrar como soporte a una empresa.
function DosPasos({ onListo, onSalir }) {
  const [paso, setPaso] = useState("revisando"); // revisando · enrolar · codigo
  const [factor, setFactor] = useState(null);
  const [qr, setQr] = useState(null);
  const [codigo, setCodigo] = useState("");
  const [error, setError] = useState("");
  const [enviando, setEnviando] = useState(false);
  useEffect(() => { (async () => {
    try {
      const { data: nivel } = await sb.auth.mfa.getAuthenticatorAssuranceLevel();
      if (nivel && nivel.currentLevel === "aal2") return onListo();
      const { data: fs } = await sb.auth.mfa.listFactors();
      const listo = (fs && fs.totp || []).find(x => x.status === "verified");
      if (listo) { setFactor(listo.id); setPaso("codigo"); return; }
      for (const x of (fs && fs.all || []).filter(x => x.status !== "verified")) await sb.auth.mfa.unenroll({ factorId: x.id });
      const r = await q(sb.auth.mfa.enroll({ factorType: "totp", friendlyName: "Qipo Arriendos " + Date.now() }));
      setFactor(r.id); setQr(r.totp); setPaso("enrolar");
    } catch (e) { setError(mensajeError(e)); setPaso("codigo"); }
  })(); }, []);
  const verificar = async e => {
    e.preventDefault(); setError(""); setEnviando(true);
    try { await q(sb.auth.mfa.challengeAndVerify({ factorId: factor, code: codigo.trim() })); onListo(); }
    catch (err) { setError(/invalid|expired/i.test(err.message || "") ? "Código incorrecto o vencido. Usa el código que muestra la app ahora." : mensajeError(err)); }
    finally { setEnviando(false); }
  };
  if (paso === "revisando") return <Cargando texto="Verificando la seguridad de la cuenta…" />;
  return (
    <PantallaCentrada ancho={440}>
      <div style={{ fontSize: 28 }}>🔐</div>
      <div className="h2" style={{ marginTop: 6 }}>Verificación en dos pasos</div>
      {paso === "enrolar" ? <>
        <div className="muted" style={{ margin: "6px 0 12px" }}>El panel de plataforma y el acceso de soporte a las empresas la exigen. Escanea este código con Google Authenticator, Microsoft Authenticator o similar, y escribe el código de 6 dígitos.</div>
        {qr && <img src={qr.qr_code} alt="Código QR" style={{ width: 180, height: 180, background: "#fff", padding: 8, borderRadius: 10 }} />}
        {qr && <div className="muted mono" style={{ fontSize: 11, wordBreak: "break-all", marginTop: 6 }}>Clave manual: {qr.secret}</div>}
      </> : <div className="muted" style={{ margin: "6px 0 12px" }}>Escribe el código de 6 dígitos de tu app de autenticación.</div>}
      <form onSubmit={verificar} className="grid" style={{ gap: 10, marginTop: 12 }}>
        <input className="input mono" inputMode="numeric" autoComplete="one-time-code" maxLength={6} placeholder="000000" value={codigo} onChange={e => setCodigo(e.target.value.replace(/\D/g, ""))} autoFocus style={{ fontSize: 22, textAlign: "center", letterSpacing: 6 }} />
        {error && <div style={{ color: "#B91C1C", fontSize: 12.5 }}>{error}</div>}
        <button className="btn btn-primary" style={{ justifyContent: "center" }} disabled={codigo.length !== 6 || enviando}>{enviando ? "Verificando…" : "Verificar"}</button>
        <button type="button" className="btn btn-ghost" onClick={onSalir}>‹ Volver</button>
      </form>
    </PantallaCentrada>
  );
}

// Pide el motivo y abre un acceso de soporte de 2 horas (queda en la bitácora del cliente)
function AccesoSoporteModal({ empresa, onAbierto, onClose }) {
  const [motivo, setMotivo] = useState("");
  const [error, setError] = useState("");
  const abrir = async () => {
    if (motivo.trim().length < 5) return setError("Describe el motivo (lo verá el cliente en su bitácora).");
    try { const hasta = await q(sb.rpc("abrir_acceso_soporte", { p_empresa: empresa.id, p_motivo: motivo.trim() })); onAbierto(empresa.id, hasta); }
    catch (e) { setError(mensajeError(e)); }
  };
  return (
    <Modal titulo={`Entrar como soporte · ${empresa.nombre}`} onClose={onClose} pie={<><button className="btn btn-ghost" onClick={onClose}>Cancelar</button><button className="btn btn-primary" onClick={abrir}>🛟 Entrar (2 horas)</button></>}>
      <div className="muted" style={{ marginBottom: 10 }}>Tendrás los permisos de un super administrador durante 2 horas. El cliente verá en su bitácora que entraste, cuándo y por qué, y todo lo que hagas quedará con tu nombre.</div>
      <Campo label="Motivo"><textarea className="input" rows={3} value={motivo} onChange={e => setMotivo(e.target.value)} placeholder="Ej: el cliente pidió ayuda para cargar sus contratos" autoFocus /></Campo>
      {error && <div style={{ color: "#B91C1C", fontSize: 12.5, marginTop: 8 }}>{error}</div>}
    </Modal>
  );
}

function PlataformaView({ sesionSb, empresas, onVer, onSalir }) {
  const [mfa, setMfa] = useState(false);
  if (!mfa) return <DosPasos onListo={() => setMfa(true)} onSalir={onSalir} />;
  return <PlataformaPanel sesionSb={sesionSb} empresas={empresas} onVer={onVer} onSalir={onSalir} />;
}

function PlataformaPanel({ sesionSb, empresas, onVer, onSalir }) {
  const [d, setD] = useState(null);
  const [tab, setTab] = useState("empresas");
  const [filtro, setFiltro] = useState("");
  const [abierta, setAbierta] = useState(null);
  const [aviso, setAviso] = useState("");
  const [error, setError] = useState("");
  const [entrar, setEntrar] = useState(null);
  const toast = m => { setAviso(m); clearTimeout(window.__tp); window.__tp = setTimeout(() => setAviso(""), 3800); };

  const cargar = useCallback(async () => {
    try {
      const [rol, emp, subs, planes, cobros, miembros, bit, accesos] = await Promise.all([
        q(sb.from("admins_plataforma").select("rol").eq("user_id", sesionSb.user.id).maybeSingle()),
        q(sb.rpc("plataforma_empresas")),
        q(sb.from("suscripciones").select("*")),
        q(sb.from("planes").select("*").order("orden")),
        q(sb.from("cobros_suscripcion").select("*").order("periodo", { ascending: false }).limit(500)),
        q(sb.from("miembros").select("empresa_id, nombre, rol, activo")),
        q(sb.from("bitacora").select("creado, usuario, accion, empresa_id").is("empresa_id", null).order("creado", { ascending: false }).limit(50)),
        q(sb.from("accesos_soporte").select("*").order("desde", { ascending: false }).limit(50)),
      ]);
      setD({ rol: rol && rol.rol, emp, subs, planes, cobros, miembros, bit, accesos });
      setError("");
    } catch (e) { setError(mensajeError(e)); }
  }, [sesionSb.user.id]);
  useEffect(() => { cargar(); }, [cargar]);

  // Toda acción queda en la bitácora de plataforma (empresa_id nulo)
  const accion = async (fn, ok, registro) => {
    try {
      await fn();
      await q(sb.from("bitacora").insert({ empresa_id: null, user_id: sesionSb.user.id, usuario: sesionSb.user.email, accion: registro }));
      toast(ok); await cargar(); return true;
    } catch (e) { toast(mensajeError(e)); return false; }
  };

  if (error) return <PantallaCentrada><div style={{ color: "#B91C1C", margin: "12px 0" }}>{error}</div><button className="btn btn-ghost" onClick={onSalir}>‹ Volver</button></PantallaCentrada>;
  if (!d) return <Cargando texto="Cargando plataforma…" />;

  const puede = roles => roles.includes(d.rol);
  const susDe = id => d.subs.find(s => s.empresa_id === id);
  const usuariosDe = id => d.miembros.filter(m => m.empresa_id === id && m.activo).length;
  const pendienteDe = id => d.cobros.filter(c => c.empresa_id === id && c.estado === "pendiente").reduce((t, c) => t + (c.monto_clp || 0), 0);
  const precioDe = e => { const s = susDe(e.id); const p = s && d.planes.find(x => x.id === s.plan_id); return s ? s.precio_clp_pactado ?? (p && p.precio_clp) ?? 0 : 0; };
  const vivas = d.emp.filter(e => e.estado !== "cancelada");
  const kpi = {
    total: vivas.length,
    activas: vivas.filter(e => e.estado === "activa").length,
    prueba: vivas.filter(e => e.estado === "prueba").length,
    problemas: vivas.filter(e => ["morosa", "suspendida"].includes(e.estado)).length,
    mrr: vivas.filter(e => e.estado === "activa").reduce((t, e) => t + precioDe(e), 0),
    potencial: vivas.filter(e => e.estado === "prueba").reduce((t, e) => t + precioDe(e), 0),
    porCobrar: d.cobros.filter(c => c.estado === "pendiente").reduce((t, c) => t + (c.monto_clp || 0), 0),
    unidades: vivas.reduce((t, e) => t + Number(e.unidades || 0), 0),
  };
  const lista = d.emp.filter(e => !filtro || (filtro === "problemas" ? ["morosa", "suspendida"].includes(e.estado) : e.estado === filtro));
  const abiertaE = abierta && d.emp.find(e => e.id === abierta);

  return (
    <div style={{ minHeight: "100vh", background: C.bg }}>
      <div style={{ background: C.sidebar, color: "#fff", padding: "14px 24px" }}>
        <div className="row between" style={{ maxWidth: 1240, margin: "0 auto" }}>
          <div className="row"><span style={{ fontSize: 20 }}>🛰️</span><div><div style={{ fontWeight: 800 }}>Qipo Arriendos · Plataforma</div><div style={{ fontSize: 11.5, opacity: .6 }}>{sesionSb.user.email} · {({ super_admin: "Super administrador", contabilidad: "Contabilidad", soporte: "Soporte" })[d.rol] || d.rol}</div></div></div>
          <div className="row">
            <button className="btn btn-sm" style={{ background: "rgba(255,255,255,.1)", color: "#fff", border: "1px solid rgba(255,255,255,.2)" }} onClick={cargar}>↻ Actualizar</button>
            <button className="btn btn-sm" style={{ background: "rgba(255,255,255,.1)", color: "#fff", border: "1px solid rgba(255,255,255,.2)" }} onClick={onSalir}>{empresas.length ? "‹ Mis empresas" : "‹ Salir"}</button>
          </div>
        </div>
      </div>
      <div className="grid fade-up" style={{ gap: 16, maxWidth: 1240, margin: "0 auto", padding: 24 }}>
        <div className="grid g4">
          <Kpi label="Inmobiliarias" valor={kpi.total} sub={`${kpi.activas} pagando · ${kpi.prueba} en prueba`} icono="🏢" />
          <Kpi label="Ingreso mensual (MRR)" valor={fmtCLP(kpi.mrr)} sub={`neto + IVA · con IVA ${fmtCLP(totalConIVA(kpi.mrr))} · ARR neto ${fmtCLP(kpi.mrr * 12)}`} icono="💰" color={C.success} />
          <Kpi label="En prueba (potencial)" valor={fmtCLP(kpi.potencial)} sub={`neto + IVA (${fmtCLP(totalConIVA(kpi.potencial))} con IVA) si todas pasan a pagar`} icono="⏳" />
          <Kpi label="Por cobrar (con IVA)" valor={fmtCLP(kpi.porCobrar)} sub={`${kpi.problemas} morosas o suspendidas · ${kpi.unidades} unidades`} icono="⚠️" color={kpi.porCobrar ? "#DC2626" : null} />
        </div>
        <div className="tabs">
          {[["empresas", `Inmobiliarias (${d.emp.length})`], ["planes", "Planes y precios"], ["cobros", "Cobros"], ["bitacora", "Bitácora"]].map(([k, l]) =>
            <button key={k} className={"tab" + (tab === k ? " active" : "")} onClick={() => setTab(k)}>{l}</button>)}
        </div>

        {tab === "empresas" && <>
          <div className="row">
            {[["", "Todas"], ["prueba", "En prueba"], ["activa", "Activas"], ["problemas", "Morosas o suspendidas"], ["cancelada", "Canceladas"]].map(([k, l]) =>
              <button key={k} className={"btn btn-sm " + (filtro === k ? "btn-primary" : "btn-ghost")} onClick={() => setFiltro(k)}>{l}</button>)}
          </div>
          {!lista.length ? <div className="card empty">No hay inmobiliarias con ese filtro.</div> : (
            <div className="table-wrap"><table>
              <thead><tr><th>Inmobiliaria</th><th>Plan</th><th>Estado</th><th className="num">Unidades</th><th className="num">Usuarios</th><th className="num">Mensual + IVA</th><th>Próximo evento</th><th className="num">Por cobrar</th><th>Última actividad</th><th></th></tr></thead>
              <tbody>{lista.map(e => {
                const pl = d.planes.find(p => p.id === e.plan_id);
                const ev = e.estado === "prueba" && e.prueba_hasta ? `Prueba termina ${fmtFecha(e.prueba_hasta)}` : e.vigente_hasta ? `Vence ${fmtFecha(e.vigente_hasta)}` : "—";
                return (
                  <tr key={e.id} className="click" onClick={() => setAbierta(e.id)}>
                    <td style={{ fontWeight: 600 }}>{e.nombre}<div className="muted">{[e.rut, e.email].filter(Boolean).join(" · ") || `alta ${fmtFecha(e.creado.slice(0, 10))}`}</div></td>
                    <td>{e.plan || "—"}{susDe(e.id)?.ciclo === "anual" ? <div className="muted">anual</div> : null}</td>
                    <td><EstadoSus estado={e.estado} /></td>
                    <td className="num">{e.unidades}{pl && pl.max_unidades ? ` / ${pl.max_unidades}` : ""}<div className="muted">{e.ocupadas} arrendadas</div></td>
                    <td className="num">{usuariosDe(e.id)}{pl && pl.max_usuarios ? ` / ${pl.max_usuarios}` : ""}</td>
                    <td className="num">{fmtCLP(precioDe(e))}{susDe(e.id)?.precio_clp_pactado != null ? <div className="muted">pactado</div> : null}</td>
                    <td>{ev}</td>
                    <td className="num" style={{ color: pendienteDe(e.id) ? "#DC2626" : null }}>{pendienteDe(e.id) ? fmtCLP(pendienteDe(e.id)) : "—"}</td>
                    <td>{e.ultima_actividad ? fmtFecha(e.ultima_actividad.slice(0, 10)) : "—"}</td>
                    <td style={{ whiteSpace: "nowrap" }}><button className="btn btn-ghost btn-sm">Administrar</button>{puede(["super_admin", "soporte"]) && <> <button className="btn btn-ghost btn-sm" title="Entrar como soporte" onClick={x => { x.stopPropagation(); setEntrar(e); }}>🛟 Entrar</button></>}</td>
                  </tr>);
              })}</tbody>
            </table></div>
          )}
        </>}

        {tab === "planes" && <><ContactoAdmin editable={puede(["super_admin"])} accion={accion} /><PlanesAdmin planes={d.planes} editable={puede(["super_admin"])} accion={accion} /></>}
        {tab === "cobros" && <CobrosAdmin d={d} editable={puede(["super_admin", "contabilidad"])} accion={accion} />}
        {tab === "bitacora" && (
          <div className="card">
            <div className="h2">Accesos de soporte a empresas</div>
            {!d.accesos.length ? <div className="muted" style={{ marginBottom: 14 }}>Sin accesos registrados.</div> : <div className="table-wrap" style={{ marginBottom: 16 }}><table>
              <thead><tr><th>Fecha</th><th>Quién</th><th>Empresa</th><th>Motivo</th><th>Hasta</th></tr></thead>
              <tbody>{d.accesos.map(a => <tr key={a.id}><td>{fmtFecha(a.desde.slice(0, 10))} {new Date(a.desde).toTimeString().slice(0, 5)}</td><td>{a.nombre}</td><td>{(d.emp.find(x => x.id === a.empresa_id) || {}).nombre || "—"}</td><td>{a.motivo}</td>
                <td>{a.cerrado ? "cerrado " + new Date(a.cerrado).toTimeString().slice(0, 5) : new Date(a.hasta) > new Date() ? "vigente hasta " + new Date(a.hasta).toTimeString().slice(0, 5) : "vencido"}</td></tr>)}</tbody></table></div>}
            <div className="h2">Acciones de plataforma</div>
            {!d.bit.length ? <div className="muted">Sin acciones de plataforma registradas.</div> : d.bit.map((b, i) =>
              <div key={i} style={{ padding: "7px 0", borderBottom: `1px solid ${C.border}`, fontSize: 13 }}><span className="muted">{fmtFecha(b.creado.slice(0, 10))} {b.creado.slice(11, 16)} · {b.usuario}</span><div>{b.accion}</div></div>)}
          </div>
        )}
      </div>
      {abiertaE && <EmpresaAdmin e={abiertaE} d={d} puede={puede} accion={accion} onVer={() => setEntrar(abiertaE)} onClose={() => setAbierta(null)} />}
      {entrar && <AccesoSoporteModal empresa={entrar} onClose={() => setEntrar(null)} onAbierto={(id, hasta) => { setEntrar(null); onVer(id, hasta); }} />}
      {aviso && <div className="toast">{aviso}</div>}
    </div>
  );
}

function EmpresaAdmin({ e, d, puede, accion, onVer, onClose }) {
  const s = d.subs.find(x => x.empresa_id === e.id);
  const [f, setF] = useState(() => ({ plan_id: s?.plan_id || "corredor", estado: s?.estado || "prueba", ciclo: s?.ciclo || "mensual", precio: s?.precio_clp_pactado ?? "", prueba_hasta: s?.prueba_hasta || "", vigente_hasta: s?.vigente_hasta || "" }));
  const pl = d.planes.find(p => p.id === f.plan_id);
  const precio = f.precio === "" ? pl?.precio_clp || 0 : Number(f.precio) || 0;
  const [cobro, setCobro] = useState(() => ({ periodo: mesActual(), neto: precio * (f.ciclo === "anual" ? 10 : 1), pagado: true, pagado_en: toISO(new Date()), medio: "Transferencia" }));
  const cobros = d.cobros.filter(c => c.empresa_id === e.id);
  const equipo = d.miembros.filter(m => m.empresa_id === e.id);
  const set = (k, v) => setF(x => ({ ...x, [k]: v }));

  const guardar = () => accion(() => q(sb.from("suscripciones").update({
    plan_id: f.plan_id, estado: f.estado, ciclo: f.ciclo, precio_clp_pactado: f.precio === "" ? null : Math.round(Number(f.precio)),
    prueba_hasta: f.prueba_hasta || null, vigente_hasta: f.vigente_hasta || null, actualizado: new Date().toISOString(),
  }).eq("empresa_id", e.id)), "Suscripción actualizada", `Suscripción de ${e.nombre}: ${f.plan_id}, ${f.estado}${f.precio !== "" ? `, precio pactado ${fmtCLP(f.precio)}` : ""}`);
  const cambiarEstado = estado => {
    if (estado === "suspendida" && !confirm(`¿Suspender ${e.nombre}? Podrán ver sus datos pero no modificarlos.`)) return;
    accion(() => q(sb.from("suscripciones").update({ estado, actualizado: new Date().toISOString() }).eq("empresa_id", e.id)), estado === "suspendida" ? "Suspendida" : "Reactivada", `${estado === "suspendida" ? "Suspendió" : "Reactivó"} a ${e.nombre}`).then(ok => ok && set("estado", estado));
  };
  // Pago recibido: si había prueba o mora, la suscripción pasa a activa y se extiende la vigencia
  const registrarCobro = async () => {
    if (!/^\d{4}-\d{2}$/.test(cobro.periodo)) return alert("Período inválido (AAAA-MM)");
    if (!(Number(cobro.neto) > 0)) return alert("Indica el monto neto");
    const ok = await accion(() => q(sb.from("cobros_suscripcion").upsert({
      empresa_id: e.id, periodo: cobro.periodo, monto_clp: totalConIVA(cobro.neto), estado: cobro.pagado ? "pagado" : "pendiente",
      pagado_en: cobro.pagado ? cobro.pagado_en || toISO(new Date()) : null, medio: cobro.medio || null,
    }, { onConflict: "empresa_id,periodo" })), "Cobro registrado", `Cobro ${cobro.periodo} de ${e.nombre}: ${fmtCLP(totalConIVA(cobro.neto))} con IVA ${cobro.pagado ? "pagado" : "pendiente"}`);
    if (ok && cobro.pagado && s && ["prueba", "morosa"].includes(s.estado) && confirm("¿Dejar la suscripción como Activa?")) {
      const hasta = vencimiento(sumarMes(cobro.periodo, f.ciclo === "anual" ? 12 : 1), 1);
      accion(() => q(sb.from("suscripciones").update({ estado: "activa", vigente_hasta: toISO(hasta), actualizado: new Date().toISOString() }).eq("empresa_id", e.id)),
        "Suscripción activa", `Activó a ${e.nombre} hasta ${fmtFecha(hasta)}`).then(ok => ok && setF(x => ({ ...x, estado: "activa", vigente_hasta: toISO(hasta) })));
    }
  };
  const estadoCobro = (c, estado) => accion(() => q(sb.from("cobros_suscripcion").update({ estado, pagado_en: estado === "pagado" ? toISO(new Date()) : null }).eq("id", c.id)),
    `Cobro ${estado}`, `Cobro ${c.periodo} de ${e.nombre} marcado ${estado}`);

  return (
    <Modal titulo={e.nombre} onClose={onClose} ancho={900}
      pie={<>{puede(["super_admin", "soporte"]) && <button className="btn btn-primary" onClick={onVer}>🛟 Entrar como soporte ›</button>}<button className="btn btn-ghost" onClick={onClose}>Cerrar</button></>}>
      <div className="row" style={{ marginBottom: 12 }}>
        <EstadoSus estado={s?.estado} />
        <span className="muted">{[e.rut, e.email, e.telefono].filter(Boolean).join(" · ")} · alta {fmtFecha(e.creado.slice(0, 10))}</span>
        <span style={{ marginLeft: "auto" }} />
        {puede(["super_admin", "contabilidad"]) && s && (s.estado === "suspendida"
          ? <button className="btn btn-primary btn-sm" onClick={() => cambiarEstado("activa")}>Reactivar</button>
          : s.estado !== "cancelada" && <button className="btn btn-danger btn-sm" onClick={() => cambiarEstado("suspendida")}>Suspender</button>)}
      </div>
      <div className="grid g4" style={{ gap: 12 }}>
        <div className="card" style={{ padding: 14 }}><div className="label">Cartera</div><div style={{ fontSize: 24, fontWeight: 800 }}>{e.unidades}<span className="muted" style={{ fontSize: 13 }}> unidades{pl?.max_unidades ? ` de ${pl.max_unidades}` : ""}</span></div><div className="muted">{e.ocupadas} arrendadas · {Number(e.unidades) - Number(e.ocupadas)} desocupadas</div></div>
        <div className="card" style={{ padding: 14 }}><div className="label">Mensual</div><div style={{ fontSize: 24, fontWeight: 800 }}>{fmtCLP(precio)}</div><div className="muted">+ IVA · {f.ciclo === "anual" ? `anual ${fmtCLP(precio * 10)}` : "mensual"}</div></div>
        <div className="card" style={{ padding: 14 }}><div className="label">Usuarios ({equipo.filter(m => m.activo).length}{pl?.max_usuarios ? ` de ${pl.max_usuarios}` : ""})</div>{equipo.map((m, i) => <div key={i} className="muted" style={m.activo ? null : { textDecoration: "line-through" }}>{m.nombre} · {nombreRol(m.rol)}</div>)}</div>
      </div>

      <div className="section-title">Suscripción</div>
      {!s ? <div className="muted">Sin suscripción.</div> : (
        <>
          <div className="form-grid">

// ─── IMPORTAR CARTERA DESDE EXCEL ─────────────────────────────────────────────
// Una fila por unidad. Filas con el mismo nombre de propiedad forman un edificio o centro con varias
// unidades. Si la fila trae arrendatario, se crea el contrato vigente; "Al día hasta" evita deuda inventada.
const COLUMNAS_IMPORT = ["Propiedad", "Dirección", "Comuna", "Ciudad", "Tipo", "Unidad", "m2", "Dormitorios", "Baños", "Estacionamientos",
  "Arrendatario", "RUT arrendatario", "Teléfono", "Correo", "Inicio", "Término", "Día de pago", "Moneda", "Renta", "Garantía", "IVA", "Al día hasta", "Latitud", "Longitud"];
const TIPO_IMPORT = { casa: "casa", departamento: "depto", depto: "depto", oficina: "oficina", local: "local", "local comercial": "local", bodega: "bodega", terreno: "terreno" };
const normCol = s => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]/g, "");
function fechaImport(v) {
  if (v == null || v === "") return "";
  if (v instanceof Date) return toISO(v);
  if (typeof v === "number") { const d = new Date(Math.round((v - 25569) * 86400000)); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`; } // fecha de Excel
  const s = String(v).trim(); let m;
  if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/))) return `${m[1]}-${pad(+m[2])}-${pad(+m[3])}`;
  if ((m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/))) return `${m[3]}-${pad(+m[2])}-${pad(+m[1])}`;
  return null;
}
function mesImport(v) {
  if (v == null || v === "") return "";
  const f = fechaImport(v); if (f) return f.slice(0, 7);
  const s = String(v).trim(); let m;
  if ((m = s.match(/^(\d{4})-(\d{1,2})$/))) return `${m[1]}-${pad(+m[2])}`;
  if ((m = s.match(/^(\d{1,2})[\/.-](\d{4})$/))) return `${m[2]}-${pad(+m[1])}`;
  return null;
}
// números chilenos: "450.000" (miles con punto), "18,5" (decimal con coma) o "18.5"
function numImport(v) {
  if (v == null || v === "") return "";
  if (typeof v === "number") return v;
  let s = String(v).replace(/\$|\s|UF|CLP/gi, "");
  if (s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");
  else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, "");
  return Number(s);
}
// Convierte las filas del Excel en propiedades de la app, con los errores por fila
function filasAPropiedades(filas) {
  const errores = [], props = new Map();
  filas.forEach((f, i) => {
    const n = i + 2, err = t => errores.push(`Fila ${n}: ${t}`);
    const nombre = String(f.propiedad || "").trim();
    if (!nombre) return err("falta el nombre de la propiedad");
    const tipo = TIPO_IMPORT[String(f.tipo || "casa").trim().toLowerCase()] || "otro";
    let p = props.get(nombre.toLowerCase());
    if (!p) {
      const lat = numImport(f.latitud), lng = numImport(f.longitud);
      p = { id: uid(), tipo: "propiedad", nombre, direccion: String(f.direccion || "").trim(), comuna: String(f.comuna || "").trim(), ciudad: String(f.ciudad || "").trim() || "Santiago",
        lat: lat === "" || isNaN(lat) ? null : lat, lng: lng === "" || isNaN(lng) ? null : lng, rol: "", notas: "", arrendador: {}, propietarioId: "", unidades: [] };
      props.set(nombre.toLowerCase(), p);
    }
    const u = { ...unidadVacia(tipo, String(f.unidad || "").trim() || (p.unidades.length ? `Unidad ${p.unidades.length + 1}` : "Unidad principal")),
      m2: numImport(f.m2), dormitorios: numImport(f.dormitorios), banos: numImport(f.banos), estacionamientos: numImport(f.estacionamientos) };
    if (String(f.arrendatario || "").trim()) {
      const inicio = fechaImport(f.inicio), termino = fechaImport(f.termino), alDia = mesImport(f.aldiahasta);
      const moneda = String(f.moneda || "UF").trim().toUpperCase() === "CLP" || /peso|\$/i.test(String(f.moneda || "")) ? "CLP" : "UF";
      const valor = numImport(f.renta), dia = Number(f.diadepago) || 5;
      if (!inicio) return err("falta o no se entiende la fecha de inicio (usa AAAA-MM-DD o DD-MM-AAAA)");
      if (termino === null) return err("no se entiende la fecha de término");
      if (alDia === null) return err("no se entiende \"Al día hasta\" (usa AAAA-MM o MM-AAAA)");
      if (!(valor > 0)) return err("falta la renta");
      if (moneda === "CLP" && valor < 1000) return err(`la renta ${valor} en pesos parece estar en UF (revisa la columna Moneda)`);
      u.contrato = { ...contratoVacio(), arrendatario: { nombre: String(f.arrendatario).trim(), rut: String(f.rutarrendatario || "").trim(), email: String(f.correo || "").trim(), telefono: String(f.telefono || "").trim(), giro: "", domicilio: "", representante: "" },
        inicio, termino: termino || "", diaPago: Math.min(31, Math.max(1, dia)), moneda, valor, garantia: numImport(f.garantia), iva: /^(si|sí|s|x|1|true)$/i.test(String(f.iva || "").trim()), alDiaHasta: alDia || "" };
    }
    p.unidades.push(u);
  });
  // las propiedades cuyas filas tenían errores quedan sin unidades: no se importan
  const lista = [...props.values()].filter(p => p.unidades.length).map(p => p.unidades.length > 1 ? { ...p, tipo: "centro" } : p);
  return { props: lista, errores };
}

function ImportarExcel() {
  const { st, update, toast } = useApp();
  const [res, setRes] = useState(null);
  const [trabajando, setTrabajando] = useState("");
  const archivo = useRef(null);
  const plantilla = () => descargarExcel("plantilla-cartera-qipo", [COLUMNAS_IMPORT,
    ["Casa Los Robles", "Los Robles 123", "Ñuñoa", "Santiago", "Casa", "", 120, 3, 2, 1, "María Pérez", "12.345.678-9", "+56912345678", "maria@correo.cl", "2025-03-01", "2027-02-28", 5, "UF", 18, 18, "No", "2026-09", "", ""],
    ["Edificio Centro", "Huérfanos 1000", "Santiago", "Santiago", "Departamento", "Depto 501", 55, 2, 1, 0, "Juan Soto", "15.111.222-3", "+56987654321", "", "01-06-2026", "", 1, "CLP", 450000, 450000, "No", "", "", ""],
    ["Edificio Centro", "Huérfanos 1000", "Santiago", "Santiago", "Departamento", "Depto 502", 55, 2, 1, 0, "", "", "", "", "", "", "", "", "", "", "", "", "", ""]]);
  const leer = async e => {
    const f = e.target.files[0]; e.target.value = ""; if (!f) return;
    setTrabajando("Leyendo el archivo…");
    try {
      await cargarXLSX();
      const libro = XLSX.read(await f.arrayBuffer());
      const crudas = XLSX.utils.sheet_to_json(libro.Sheets[libro.SheetNames[0]], { defval: "" });
      const filas = crudas.map(r => Object.fromEntries(Object.entries(r).map(([k, v]) => [normCol(k), v]))).filter(r => Object.values(r).some(v => String(v).trim()));
      if (!filas.length) throw new Error("El archivo no tiene filas con datos");
      if (!("propiedad" in filas[0])) throw new Error("No encontré la columna \"Propiedad\". Usa la plantilla.");
      const r = filasAPropiedades(filas);
      // no duplicar lo que ya existe
      const existentes = new Set(st.propiedades.map(p => p.nombre.trim().toLowerCase()));
      r.repetidas = r.props.filter(p => existentes.has(p.nombre.trim().toLowerCase())).map(p => p.nombre);
      r.props = r.props.filter(p => !existentes.has(p.nombre.trim().toLowerCase()));
      setRes(r);
    } catch (err) { toast(err.message || "No se pudo leer el archivo"); }
    setTrabajando("");
  };
  const importar = async () => {
    const props = structuredClone(res.props);
    const max = st.suscripcion && st.suscripcion.maxUnidades, total = listarUnidades(st).length + props.reduce((t, p) => t + p.unidades.length, 0);
    if (max && total > max) return toast(`Tu plan permite hasta ${max} unidades y quedarías con ${total}. Cambia de plan o importa menos filas.`);
    // ubicar en el mapa las que no traen coordenadas (OpenStreetMap, 1 por segundo)
    const sinUbicar = props.filter(p => p.lat == null || p.lng == null);
    for (let i = 0; i < sinUbicar.length; i++) {
      const p = sinUbicar[i];
      setTrabajando(`Ubicando en el mapa ${i + 1} de ${sinUbicar.length}…`);
      try {
        const q = [p.direccion, p.comuna, p.ciudad, "Chile"].filter(Boolean).join(", ");
        const j = await (await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=cl&q=${encodeURIComponent(q)}`, { headers: { "Accept-Language": "es" } })).json();
        if (j[0]) { p.lat = Number(Number(j[0].lat).toFixed(6)); p.lng = Number(Number(j[0].lon).toFixed(6)); }
      } catch {}
      if (p.lat == null) { p.lat = -33.4489; p.lng = -70.6693; p.notas = "Ubicación aproximada: ajústala en el mapa al editar la propiedad."; }
      if (i < sinUbicar.length - 1) await new Promise(r => setTimeout(r, 1100));
    }
    setTrabajando("");
    const n = props.reduce((t, p) => t + p.unidades.length, 0), c = props.reduce((t, p) => t + p.unidades.filter(u => u.contrato).length, 0);
    update(s => { s.propiedades.push(...props); }, `Importó desde Excel ${props.length} propiedades (${n} unidades, ${c} contratos)`);
    toast(`Importadas ${props.length} propiedades, ${n} unidades y ${c} contratos`);
    setRes(null);
  };
  return (
    <div className="card">
      <div className="h2">Importar cartera desde Excel</div>
      <div className="muted" style={{ marginBottom: 10 }}>Carga todas tus propiedades, unidades y contratos de una vez. Una fila por unidad: las filas con el mismo nombre de propiedad forman un edificio o centro. Para contratos que ya venían corriendo, completa "Al día hasta" con el último mes pagado y no se generará deuda de meses anteriores.</div>
      <div className="row">
        <button className="btn btn-ghost" onClick={plantilla}>⬇️ Descargar plantilla</button>
        <button className="btn btn-primary" onClick={() => archivo.current.click()} disabled={!!trabajando}>⬆️ Subir Excel o CSV</button>
        <input ref={archivo} type="file" accept=".xlsx,.xls,.csv" hidden onChange={leer} />
        {trabajando && <span className="muted">{trabajando}</span>}
      </div>
      {res && (
        <div style={{ marginTop: 14 }}>
          <div style={{ fontWeight: 600 }}>{res.props.length} propiedades nuevas · {res.props.reduce((t, p) => t + p.unidades.length, 0)} unidades · {res.props.reduce((t, p) => t + p.unidades.filter(u => u.contrato).length, 0)} contratos</div>
          {res.repetidas.length > 0 && <div className="muted">Se omiten porque ya existen: {res.repetidas.join(", ")}</div>}
          {res.errores.length > 0 && <div className="card" style={{ background: C.warningBg, padding: 10, marginTop: 8, fontSize: 12.5 }}><b>Filas con problemas (no se importan):</b>{res.errores.slice(0, 15).map((e, i) => <div key={i}>{e}</div>)}{res.errores.length > 15 && <div>… y {res.errores.length - 15} más</div>}</div>}
          {res.props.length > 0 && <div className="table-wrap" style={{ marginTop: 8, maxHeight: 260, overflowY: "auto" }}><table>
            <thead><tr><th>Propiedad</th><th>Unidad</th><th>Arrendatario</th><th className="num">Renta</th><th>Al día hasta</th><th>Ubicación</th></tr></thead>
            <tbody>{res.props.flatMap(p => p.unidades.map(u => <tr key={u.id}><td>{p.nombre}</td><td>{p.tipo === "centro" ? u.nombre : CATEGORIAS[u.categoria]}</td><td>{u.contrato ? u.contrato.arrendatario.nombre : <span className="muted">Desocupada</span>}</td>
              <td className="num">{u.contrato ? fmtMonto(u.contrato.valor, u.contrato.moneda) : ""}</td><td>{u.contrato && u.contrato.alDiaHasta ? nombrePeriodo(u.contrato.alDiaHasta) : ""}</td><td>{p.lat != null ? "✓" : <span className="muted">se busca</span>}</td></tr>))}</tbody>
          </table></div>}
          <div className="row" style={{ marginTop: 10 }}>
            {res.props.length > 0 && <button className="btn btn-primary" disabled={!!trabajando} onClick={importar}>Importar {res.props.length} propiedades</button>}
            <button className="btn btn-ghost" onClick={() => setRes(null)}>Cancelar</button>
          </div>
        </div>
      )}
    </div>
  );
}

// Usuarios de la empresa. Super administrador: todo. Administrador: gestiona administradores y
// corredores (no a los super administradores). Corredor: solo en corredoras, con su % de comisión.
function UsuariosCard({ accion }) {
  const { st, user, toast } = useApp();
  const E = st.empresa.id, sus = st.suscripcion;
  const esSuper = user.rol === "super_admin";
  const conCorredores = planPermite(st, "propietarios");
  const rolesAsignables = Object.keys(ROLES).filter(r => (r !== "super_admin" || esSuper) && (r !== "corredor" || conCorredores));
  const [inv, setInv] = useState({ nombre: "", email: "", rol: "admin", comision: "" });
  const puedeTocar = r => esSuper || r !== "super_admin";
  const invitar = () => {
    const email = inv.email.trim().toLowerCase();
    if (!inv.nombre.trim() || !/^\S+@\S+\.\S+$/.test(email)) return toast("Ingresa nombre y un correo válido");
    const maxU = sus && sus.maxUsuarios;
    if (maxU && st.usuarios.filter(u => u.activo !== false).length + st.invitaciones.length >= maxU) return toast(`Tu plan ${sus.plan} permite hasta ${maxU} usuarios. Revisa los planes para invitar a más.`);
    const com = inv.rol === "corredor" && inv.comision !== "" ? Number(inv.comision) : null;
    if (com != null && !(com >= 0 && com <= 100)) return toast("La comisión debe estar entre 0 y 100%");
    accion(() => q(sb.from("invitaciones").insert({ empresa_id: E, email, nombre: inv.nombre.trim(), rol: inv.rol, comision_pct: com })),
      "Invitación creada", `Invitó a ${inv.nombre.trim()} (${email}) como ${nombreRol(inv.rol).toLowerCase()}${com != null ? ` con ${com}% de comisión` : ""}`);
    setInv({ nombre: "", email: "", rol: "admin", comision: "" });
  };
  const cambiarRol = (u, rol) => {
    if (rol === u.rol) return;
    if (u.id === user.id && !confirm("¿Cambiar tu propio rol? Podrías perder acceso a esta sección.")) return;
    accion(() => q(sb.from("miembros").update({ rol }).eq("empresa_id", E).eq("user_id", u.id)), "Rol actualizado", `Cambió a ${u.nombre} de ${nombreRol(u.rol).toLowerCase()} a ${nombreRol(rol).toLowerCase()}`);
  };
  const mensajeInvitacion = i => `Hola ${i.nombre}, te invité a ${st.empresa.nombre} en Qipo Arriendos como ${nombreRol(i.rol).toLowerCase()}. Crea tu cuenta con este correo (${i.email}) en: ${urlRetorno()}`;
  return (
    <div className="card">
      <div className="h2">Usuarios</div>
      <div className="muted" style={{ marginBottom: 10 }}>
        <b>Super administrador</b>: todo, incluidos otros super administradores. <b>Administrador</b>: ingresos, multas, propietarios, liquidaciones, configuración y usuarios (salvo super administradores).
        {conCorredores ? <> <b>Corredor</b>: propiedades, contratos, pagos, avisos e interesados; ve sus comisiones. No ve datos bancarios ni liquidaciones.</> : null} Todo queda en la bitácora.
      </div>
      <div className="table-wrap"><table>
        <thead><tr><th>Nombre</th><th>Rol</th><th>Estado</th><th></th></tr></thead>
        <tbody>
          {st.usuarios.map(u => (
            <tr key={u.id}><td>{u.nombre}{u.id === user.id ? " (tú)" : ""}{u.rol === "corredor" && u.comisionPct !== "" ? <div className="muted">{u.comisionPct}% de la comisión</div> : null}</td>
              <td>{puedeTocar(u.rol) && !user.soporte
                ? <select className="select" style={{ minWidth: 170 }} value={u.rol} onChange={e => cambiarRol(u, e.target.value)}>{[...new Set([...rolesAsignables, u.rol])].map(r => <option key={r} value={r} disabled={!rolesAsignables.includes(r)}>{nombreRol(r)}</option>)}</select>
                : nombreRol(u.rol)}</td>
              <td>{u.activo === false ? <span className="tag" style={{ background: C.dangerBg, color: C.danger }}>Desactivado</span> : <span className="tag" style={{ background: C.successBg, color: C.success }}>Activo</span>}</td>
              <td>{u.id !== user.id && puedeTocar(u.rol) && <button className="btn btn-ghost btn-sm" onClick={() => accion(() => q(sb.from("miembros").update({ activo: u.activo === false }).eq("empresa_id", E).eq("user_id", u.id)), "Listo", `${u.activo === false ? "Activó" : "Desactivó"} a ${u.nombre}`)}>{u.activo === false ? "Activar" : "Desactivar"}</button>}</td>
            </tr>))}
          {st.invitaciones.map(i => (
            <tr key={i.email}><td>{i.nombre}<div className="muted">{i.email}</div></td><td>{nombreRol(i.rol)}{i.rol === "corredor" && i.comision_pct != null ? <div className="muted">{Number(i.comision_pct)}% de la comisión</div> : null}</td>
              <td><span className="tag" style={{ background: C.warningBg, color: C.warning }}>Invitación pendiente</span></td>
              <td><div className="row" style={{ flexWrap: "nowrap" }}>
                <a className="btn btn-mail btn-sm" href={linkMail(i.email, `Invitación a ${st.empresa.nombre}`, mensajeInvitacion(i))}>Correo</a>
                <a className="btn btn-wa btn-sm" target="_blank" rel="noreferrer" href={`https://wa.me/?text=${encodeURIComponent(mensajeInvitacion(i))}`}>WhatsApp</a>
                {puedeTocar(i.rol) && <button className="btn btn-ghost btn-sm" onClick={() => accion(() => q(sb.from("invitaciones").delete().eq("empresa_id", E).eq("email", i.email)), "Invitación anulada", `Anuló la invitación de ${i.email}`)}>Anular</button>}
              </div></td>
            </tr>))}
        </tbody></table></div>
      <div className="label" style={{ marginTop: 16 }}>Invitar usuario</div>
      <div className="form-grid">
        <Campo label="Nombre"><input className="input" value={inv.nombre} onChange={e => setInv({ ...inv, nombre: e.target.value })} /></Campo>
        <Campo label="Correo"><input className="input" type="email" value={inv.email} onChange={e => setInv({ ...inv, email: e.target.value })} /></Campo>
        <Campo label="Rol"><select className="select" value={inv.rol} onChange={e => setInv({ ...inv, rol: e.target.value })}>{rolesAsignables.map(r => <option key={r} value={r}>{nombreRol(r)}</option>)}</select></Campo>
        {inv.rol === "corredor" && <Campo label="Comisión (% de la comisión de administración)"><input className="input" type="number" min="0" max="100" step="0.5" value={inv.comision} placeholder="Ej: 40" onChange={e => setInv({ ...inv, comision: e.target.value })} /></Campo>}
      </div>
      <button className="btn btn-primary" style={{ marginTop: 12 }} onClick={invitar}>Invitar</button>
      <div className="muted" style={{ marginTop: 8 }}>Envíale el enlace por correo o WhatsApp: la persona se registra con ese correo, lo confirma y queda dentro de tu empresa.{!conCorredores ? " El rol Corredor está disponible en los planes para corredoras." : ""}</div>
    </div>
  );
}

function ConfigView() {
  const { st, update, user, toast, recargarUF, recargar } = useApp();
  const [emp, setEmp] = useState(st.empresa);
  const [clave, setClave] = useState({ actual: "", nueva: "", repetir: "" });
  const [haylocal, setHayLocal] = useState(false);
  const archivo = useRef(null);
  const E = st.empresa.id;
  const sus = st.suscripcion;

  useEffect(() => { leerDatosDelNavegador().then(d => setHayLocal(!!(d && d.propiedades && d.propiedades.length))); }, []);

  const accion = async (fn, ok, registro) => {
    try {
      await fn();
      if (registro) await q(sb.from("bitacora").insert({ empresa_id: E, user_id: user.id, usuario: user.nombre, accion: registro }));
      toast(ok); recargar();
    } catch (e) { toast(mensajeError(e)); }
  };
  // Pide la clave actual para evitar cambios por autocompletado del navegador o descuido
  const cambiarClave = async () => {
    if (!clave.actual) return toast("Escribe tu clave actual");
    if (clave.nueva.length < 8) return toast("La clave nueva debe tener al menos 8 caracteres");
    if (clave.nueva !== clave.repetir) return toast("Las claves nuevas no coinciden");
    try { await q(sb.auth.signInWithPassword({ email: user.email, password: clave.actual })); }
    catch { return toast("La clave actual no es correcta"); }
    await accion(() => q(sb.auth.updateUser({ password: clave.nueva })), "Clave actualizada. Úsala la próxima vez que ingreses.");
    setClave({ actual: "", nueva: "", repetir: "" });
  };
  const importar = (d, origen) => {
    // no duplicar: se omiten las propiedades que ya existen (mismo nombre y dirección)
    const clave = p => `${(p.nombre || "").trim().toLowerCase()}|${(p.direccion || "").trim().toLowerCase()}`;
    const existentes = new Set(st.propiedades.map(clave));
    const nuevas = (d.propiedades || []).filter(p => !existentes.has(clave(p)));
    const omitidas = (d.propiedades || []).length - nuevas.length;
    const r = conIdsNuevos({ ...d, propiedades: nuevas });
    if (!r.propiedades.length) return toast(omitidas ? `Las ${omitidas} propiedades del archivo ya existen: no se importó nada.` : "No hay propiedades para importar");
    if (!confirm(`Se agregarán ${r.propiedades.length} propiedades ${origen}${omitidas ? ` (se omiten ${omitidas} que ya existen)` : ""}. ¿Continuar?`)) return;
    update(s => { s.propiedades.push(...r.propiedades); s.documentos.unshift(...r.documentos); s.interesados.unshift(...r.interesados); }, `Importó ${r.propiedades.length} propiedades ${origen}`);
    toast("Importando…");
  };
  const exportar = () => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(st)], { type: "application/json" }));
    a.download = `respaldo-arriendos-${toISO(new Date())}.json`; a.click();
  };
  const leerArchivo = e => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => { try { const d = JSON.parse(r.result); if (!d.propiedades) throw new Error(); importar(d, "desde el respaldo"); } catch { toast("Archivo de respaldo inválido"); } };
    r.readAsText(f); e.target.value = "";
  };

  return (
    <div className="grid fade-up" style={{ gap: 16 }}>
      <div className="h1">Configuración</div>

      {sus && <PlanesCard />}

      <div className="card">
        <div className="h2">Datos de la empresa (arrendador por defecto)</div>
        <div className="form-grid">
          {[["nombre", "Razón social"], ["rut", "RUT"], ["direccion", "Domicilio"], ["email", "Correo"], ["telefono", "Teléfono / WhatsApp"], ["representante", "Representante legal"], ["rutRep", "RUT representante"]].map(([k, l]) =>
            <Campo key={k} label={l}><input className="input" value={emp[k] || ""} onChange={e => setEmp({ ...emp, [k]: e.target.value })} /></Campo>)}
        </div>
        <button className="btn btn-primary" style={{ marginTop: 12 }} onClick={() => { if (!emp.nombre.trim()) return toast("Falta la razón social"); update(s => { s.empresa = { ...emp, slug: s.empresa.slug, web: s.empresa.web }; }, "Actualizó los datos de la empresa"); toast("Guardado"); }}>Guardar</button>
      </div>

      <WebCard />

      <div className="card">
        <div className="h2">Valor UF</div>
        <div className="row">
          <div style={{ width: 160 }}><input className="input" type="number" step="0.01" key={st.uf.valor} defaultValue={st.uf.valor}
            onBlur={e => { const v = Number(e.target.value); if (!(v > 1000)) { e.target.value = st.uf.valor; return toast("Ingresa un valor de UF válido (por ejemplo 39876,54)"); } if (v !== Number(st.uf.valor)) update(s => { s.uf = { valor: v, fecha: toISO(new Date()), auto: false }; }); }}
            onKeyDown={e => e.key === "Enter" && e.target.blur()} /></div>
          <span className="muted">Actualizada: {fmtFecha(st.uf.fecha || null)} {st.uf.auto ? "(automática, mindicador.cl)" : "(manual, solo en este equipo)"}</span>
          <button className="btn btn-ghost btn-sm" onClick={recargarUF}>Actualizar desde internet</button>
        </div>
      </div>

      <ImportarExcel />

      <UsuariosCard accion={accion} />

      <div className="card">
        <div className="h2">Mi clave</div>
        <div className="form-grid">
          <Campo label="Clave actual"><input className="input" type="password" value={clave.actual} onChange={e => setClave({ ...clave, actual: e.target.value })} autoComplete="current-password" name="clave-actual" /></Campo>
          <Campo label="Clave nueva"><input className="input" type="password" value={clave.nueva} onChange={e => setClave({ ...clave, nueva: e.target.value })} autoComplete="new-password" name="clave-nueva" /></Campo>
          <Campo label="Repetir clave nueva"><input className="input" type="password" value={clave.repetir} onChange={e => setClave({ ...clave, repetir: e.target.value })} autoComplete="new-password" name="clave-repetir" /></Campo>
        </div>
        <button className="btn btn-ghost" style={{ marginTop: 10 }} onClick={cambiarClave}>Cambiar clave</button>
      </div>

      <div className="card">
        <div className="h2">Importar y respaldar</div>
        <div className="muted" style={{ marginBottom: 10 }}>Los datos se guardan en la nube y se ven desde cualquier equipo. Puedes descargar un respaldo cuando quieras.</div>
        <div className="row">
          <button className="btn btn-ghost" onClick={exportar}>⬇️ Descargar respaldo</button>
          <button className="btn btn-ghost" onClick={() => archivo.current.click()}>⬆️ Importar respaldo</button>
          <input ref={archivo} type="file" accept="application/json" hidden onChange={leerArchivo} />
          {haylocal && <button className="btn btn-primary" onClick={() => leerDatosDelNavegador().then(d => d && importar(d, "guardadas en este navegador"))}>Importar datos de la versión anterior</button>}
          {!st.propiedades.length && <button className="btn btn-ghost" onClick={() => importar({ propiedades: propiedadesEjemplo() }, "de ejemplo")}>Cargar datos de ejemplo</button>}
          {st.propiedades.some(esEjemplo) && <button className="btn btn-danger" onClick={() => borrarEjemplo(st, update, toast)}>🗑 Borrar datos de ejemplo</button>}
        </div>
      </div>
    </div>
  );
}

function Cargando({ texto = "Cargando…", error, onReintentar }) {
  return (
    <PantallaCentrada>
      {error ? <>
        <div style={{ color: "#B91C1C", margin: "12px 0" }}>{error}</div>
        <div className="row"><button className="btn btn-primary" onClick={onReintentar}>Reintentar</button><button className="btn btn-ghost" onClick={() => sb.auth.signOut()}>Cerrar sesión</button></div>
      </> : <div className="muted" style={{ marginTop: 8 }}>{texto}</div>}
    </PantallaCentrada>

function App() {
  const [sesionSb, setSesionSb] = useState(undefined); // undefined: verificando · null: sin sesión
  const [recuperando, setRecuperando] = useState(false);
  const [empresas, setEmpresas] = useState(null);
  const [esAdmin, setEsAdmin] = useState(false);
  const [empresaId, setEmpresaId] = useState(null);
  const [plataforma, setPlataforma] = useState(() => location.hash === "#plataforma");
  // Soporte HM: admin de plataforma dentro de una inmobiliaria, con los permisos de super administrador y sin ser miembro
  const [soporte, setSoporte] = useState(false);
  const [rolAdmin, setRolAdmin] = useState(null);
  const [st, setSt] = useState(null);
  const [error, setError] = useState("");
  const [intento, setIntento] = useState(0);
  const [vista, setVista] = useState("panel");
  const [ficha, setFicha] = useState(null);
  const [toastMsg, setToastMsg] = useState("");
  const [hoy, setHoy] = useState(() => sinHora(new Date()));
  const [menu, setMenu] = useState(false);
  const [guardando, setGuardando] = useState(0);
  const stRef = useRef(null); stRef.current = st;
  const cola = useRef(Promise.resolve());
  const pendientes = useRef(0);
  const temporizador = useRef(null);

  const toast = useCallback(m => { setToastMsg(m); clearTimeout(window.__tt); window.__tt = setTimeout(() => setToastMsg(""), 3800); }, []);

  useEffect(() => {
    sb.auth.getSession().then(({ data }) => setSesionSb(data.session));
    const { data } = sb.auth.onAuthStateChange((evento, s) => { setSesionSb(s); if (evento === "PASSWORD_RECOVERY") setRecuperando(true); });
    const t = setInterval(() => { const d = sinHora(new Date()); setHoy(h => h.getTime() === d.getTime() ? h : d); }, 60000);
    return () => { data.subscription.unsubscribe(); clearInterval(t); };
  }, []);

  const uidSesion = sesionSb ? sesionSb.user.id : null;

  // Al iniciar sesión: aceptar invitaciones pendientes y listar las empresas del usuario
  const cargarEmpresas = useCallback(async () => {
    setError("");
    await q(sb.rpc("aceptar_invitaciones"));
    const [ms, adm] = await Promise.all([
      q(sb.from("miembros").select("empresa_id, rol, activo, empresas(nombre)").eq("user_id", uidSesion)),
      q(sb.from("admins_plataforma").select("rol").eq("user_id", uidSesion).maybeSingle()),
    ]);
    const activas = ms.filter(m => m.activo);
    setEsAdmin(!!adm); setRolAdmin(adm ? adm.rol : null); setEmpresas(activas);
    const enSoporte = adm && ["super_admin", "soporte"].includes(adm.rol) ? local.get("qipo-soporte") : null;
    if (enSoporte) {
      // el acceso de soporte dura 2 horas: si venció (o falta la verificación en dos pasos) se vuelve a la plataforma
      const vigente = await sb.from("accesos_soporte").select("hasta").eq("empresa_id", enSoporte).eq("user_id", uidSesion).is("cerrado", null).gt("hasta", new Date().toISOString()).order("hasta", { ascending: false }).limit(1);
      if (vigente.data && vigente.data.length) { setSoporte(vigente.data[0].hasta); setEmpresaId(enSoporte); return; }
      local.set("qipo-soporte", null); setPlataforma(true);
    }
    const guardada = local.get("qipo-empresa");
    const elegida = activas.find(m => m.empresa_id === guardada) || (activas.length === 1 ? activas[0] : null);
    setSoporte(false); setEmpresaId(elegida ? elegida.empresa_id : null);
  }, [uidSesion]);

  useEffect(() => {
    setEmpresas(null); setEmpresaId(null); setSt(null);
    if (uidSesion) cargarEmpresas().catch(e => setError(mensajeError(e)));
  }, [uidSesion, intento]);

  const recargar = useCallback(async () => {
    if (!empresaId) return;
    try { const n = await cargarEmpresa(empresaId); stRef.current = n; setSt(n); setError(""); }
    catch (e) { if (!stRef.current) setError(mensajeError(e)); else toast(mensajeError(e)); }
  }, [empresaId, toast]);

  // Contactos desde la web: la primera vez solo cuentan los que lleguen desde ahora; si llega uno con la app
  // abierta, se avisa al momento
  const vistosWeb = useRef(null);
  useEffect(() => {
    if (!st) return;
    if (!local.get(claveVistos(st))) local.set(claveVistos(st), new Date().toISOString());
    const web = st.interesados.filter(x => x.canal === "Sitio web");
    const v = vistosWeb.current;
    if (v && v.e === st.empresa.id) web.filter(x => !v.ids.has(x.id)).forEach(x => toast(`📩 Nuevo contacto desde la web: ${x.nombre}`));
    vistosWeb.current = { e: st.empresa.id, ids: new Set(web.map(x => x.id)) };
  }, [st && st.interesados]);

  // Recarga cuando otro usuario cambia algo (espera a que terminen los guardados propios)
  const programarRecarga = useCallback(() => {
    clearTimeout(temporizador.current);
    temporizador.current = setTimeout(() => { if (pendientes.current) programarRecarga(); else recargar(); }, 700);
  }, [recargar]);

  useEffect(() => {
    if (!empresaId) return;
    if (!soporte) local.set("qipo-empresa", empresaId);
    setSt(null); recargar();
    const canalVivo = sb.channel("empresa-" + empresaId);
    TABLAS_EN_VIVO.forEach(t => canalVivo.on("postgres_changes", { event: "*", schema: "public", table: t, filter: `empresa_id=eq.${empresaId}` }, programarRecarga));
    canalVivo.on("postgres_changes", { event: "*", schema: "public", table: "empresas", filter: `id=eq.${empresaId}` }, programarRecarga);
    canalVivo.subscribe();
    return () => { sb.removeChannel(canalVivo); };
  }, [empresaId]);

  // Suscripción suspendida o cancelada: todo en solo lectura (la base además rechaza cualquier cambio)
  const soloLectura = !!(st && st.suscripcion && ["suspendida", "cancelada"].includes(st.suscripcion.estado));
  const user = st && uidSesion && (() => {
    if (soporte) return { id: uidSesion, nombre: `Soporte HM · ${(sesionSb.user.user_metadata || {}).nombre || sesionSb.user.email}`, rol: "super_admin", soporte: true, activo: true, email: sesionSb.user.email, soloLectura };
    const m = st.usuarios.find(u => u.id === uidSesion && u.activo !== false);
    return m ? { ...m, email: sesionSb.user.email, soloLectura } : null;
  })();

  // Cambio optimista: se ve al instante y se guarda en segundo plano, en orden
  const update = useCallback((fn, accion) => {
    if (soloLectura && accion) { toast("La suscripción está suspendida: puedes ver tus datos, pero no modificarlos."); return; }
    const prev = stRef.current;
    const n = structuredClone(prev);
    fn(n);
    if (accion) n.bitacora = [{ t: Date.now(), u: user ? user.nombre : "—", a: accion }, ...(n.bitacora || [])].slice(0, 1000);
    stRef.current = n; setSt(n);
    if (JSON.stringify(n.uf) !== JSON.stringify(prev.uf)) local.set("qipo-uf", n.uf);
    pendientes.current++; setGuardando(g => g + 1);
    cola.current = cola.current
      .then(async () => {
        await sincronizar(prev, n, empresaId);
        if (accion) await q(sb.from("bitacora").insert({ empresa_id: empresaId, user_id: uidSesion, usuario: user ? user.nombre : null, accion }));
      })
      .catch(e => { toast("No se guardó: " + mensajeError(e)); recargar(); })
      .finally(() => { pendientes.current--; setGuardando(g => g - 1); });
  }, [empresaId, uidSesion, user && user.nombre, toast, recargar, soloLectura]);

  const recargarUF = useCallback(async () => {
    try { const r = await obtenerUF(); update(s => { s.uf = { valor: r.valor, fecha: r.fecha, auto: true }; }); toast(`UF actualizada: ${fmtCLP(r.valor)}`); }
    catch { toast("No se pudo obtener la UF. Ingresa el valor manualmente en Configuración."); }
  }, [update, toast]);

  // UF automática una vez al día
  useEffect(() => {
    if (st && user && st.uf.auto !== false && st.uf.fecha !== toISO(hoy)) obtenerUF().then(r => update(s => { s.uf = { valor: r.valor, fecha: toISO(hoy), auto: true }; })).catch(() => {});
  }, [!!user, hoy]);

  const salir = () => { setVista("panel"); setFicha(null); sb.auth.signOut(); };

  if (recuperando && sesionSb) return <><style>{css}</style><NuevaClave onListo={() => { setRecuperando(false); toast("Clave actualizada"); }} /></>;
  if (sesionSb === undefined) return <><style>{css}</style><Cargando /></>;
  if (!sesionSb) return <><style>{css}</style><Acceso /></>;
  if (error && !st) return <><style>{css}</style><Cargando error={error} onReintentar={() => setIntento(i => i + 1)} /></>;
  if (!empresas) return <><style>{css}</style><Cargando /></>;
  const irPlataforma = v => { setPlataforma(v); history.replaceState(null, "", v ? "#plataforma" : location.pathname + location.search); };
  if (esAdmin && plataforma) return <><style>{css}</style><PlataformaView sesionSb={sesionSb} empresas={empresas}
    onVer={(id, hasta) => { local.set("qipo-soporte", id); setSoporte(hasta || true); setVista("panel"); setFicha(null); if (id !== empresaId) setSt(null); setEmpresaId(id); irPlataforma(false); }} onSalir={() => irPlataforma(false)} /></>;
  if (!empresaId) return <><style>{css}</style><Bienvenida sesionSb={sesionSb} empresas={empresas} esAdmin={esAdmin} onPlataforma={() => irPlataforma(true)}
    onElegir={setEmpresaId} onCreada={id => { local.set("qipo-empresa", id); setIntento(i => i + 1); }} /></>;
  if (!st) return <><style>{css}</style><Cargando texto="Cargando propiedades…" /></>;
  if (!user) return <><style>{css}</style><Cargando error="Tu usuario está desactivado en esta empresa." onReintentar={() => setIntento(i => i + 1)} /></>;

  const ctx = {
    st, update, user, hoy, uf: Number(st.uf.valor) || 0, toast, recargarUF, recargar,
    abrirFicha: (propId, unidadId = null) => setFicha({ propId, unidadId }),
    setUnidadFicha: unidadId => setFicha(f => ({ ...f, unidadId })),
    ir: v => setVista(v),
  };
  const atrasados = listarUnidades(st).filter(x => x.u.contrato && calcUnidad(x.u, hoy, ctx.uf).estado === "atrasado").length;
  const webNuevos = contactosWebNuevos(st).length;
  const vistas = VISTAS.filter(v => (!v.soloAdmin || esAdminEmp(user)) && (!v.soloCorredor || user.rol === "corredor"));
  const grupos = [...new Set(vistas.map(v => v.grupo))];
  const vistaOk = vistas.some(v => v.id === vista) ? vista : "panel";
  const Vista = { panel: PanelView, mapa: MapaView, propiedades: PropiedadesView, cobranza: CobranzaView, disponibles: DisponiblesView, contratos: ContratosView, propietarios: PropietariosView, liquidaciones: LiquidacionesView, corredores: CorredoresView, comisiones: CorredoresView, bitacora: BitacoraView, config: ConfigView }[vistaOk];
  const sus = st.suscripcion;
  const bloqueada = sus && ["suspendida", "cancelada"].includes(sus.estado);

  return (
    <Ctx.Provider value={ctx}>
      <style>{css}</style>
      <div className="shell">
        <aside className={"sidebar" + (menu ? " open" : "")}>
          <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "4px 8px 12px" }}>
            <div style={{ width: 34, height: 34, borderRadius: 9, background: C.sidebarActive, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 18 }}>🏢</div>
            <div><div style={{ color: "#fff", fontWeight: 700, fontSize: 14 }}>Qipo Arriendos</div><div style={{ color: "rgba(255,255,255,.4)", fontSize: 10.5 }}>{st.empresa.nombre}</div></div>
          </div>
          {grupos.map(g => (
            <div key={g}>
              <div className="nav-group-label">{g}</div>
              {vistas.filter(v => v.grupo === g).map(v => (
                <button key={v.id} className={"nav-item" + (vistaOk === v.id ? " active" : "")} onClick={() => { setVista(v.id); setMenu(false); }}>
                  <span>{v.icono}</span>{v.label}{v.id === "cobranza" && atrasados > 0 && <span className="nav-badge">{atrasados}</span>}{v.id === "disponibles" && webNuevos > 0 && <span className="nav-badge" style={{ background: C.success }} title="Contactos nuevos desde la página web">{webNuevos}</span>}
                </button>
              ))}
            </div>
          ))}
          <div style={{ marginTop: "auto", padding: "12px 8px 0", borderTop: "1px solid rgba(255,255,255,.08)" }}>
            <div style={{ color: "#fff", fontSize: 12.5, fontWeight: 600 }}>{user.nombre}</div>
            <div style={{ color: "rgba(255,255,255,.4)", fontSize: 11 }}>{soporte ? "Soporte HM (sin ocupar cupo)" : nombreRol(user.rol) + (esAdmin ? " · admin HM" : "")}</div>
            {esAdmin && <button className="nav-item" style={{ marginTop: 8, paddingLeft: 0 }} onClick={() => { setFicha(null); irPlataforma(true); }}>🛰️ Panel de plataforma</button>}
            {(empresas.length > 1 || soporte) && <button className="nav-item" style={{ marginTop: 8, paddingLeft: 0 }} onClick={() => { if (soporte) sb.rpc("cerrar_acceso_soporte", { p_empresa: empresaId }); local.set("qipo-empresa", null); local.set("qipo-soporte", null); setSoporte(false); setFicha(null); setEmpresaId(null); }}>{soporte ? "↩ Salir del modo soporte" : "⇄ Cambiar empresa"}</button>}
            <button className="nav-item" style={{ paddingLeft: 0 }} onClick={salir}>↩ Cerrar sesión</button>
          </div>
        </aside>
        <div className="main">
          <div className="topbar">
            <div className="row">
              <button className="icon-btn menu-btn" onClick={() => setMenu(true)}>☰</button>
              <span style={{ fontWeight: 700 }}>{VISTAS.find(v => v.id === vistaOk)?.label}</span>
            </div>
            <div className="row">
              {guardando > 0 && <span className="muted">Guardando…</span>}
              <span className="tag hide-sm" style={{ background: C.blueDim, color: C.blue }}>UF {fmtCLP(ctx.uf)}</span>
              {atrasados > 0 && <button className="tag" style={{ background: EST.atrasado.bg, color: EST.atrasado.color, border: "none", cursor: "pointer" }} onClick={() => setVista("cobranza")}>⚠️ {atrasados} atrasado{atrasados > 1 ? "s" : ""}</button>}
            </div>
          </div>
          {soporte && (
            <div className="row between" style={{ padding: "8px 24px", fontSize: 12.5, background: "#EEF2FF", color: "#3730A3", borderBottom: `1px solid ${C.border}` }}>
              <span>🛟 <b>Modo soporte</b> en {st.empresa.nombre}: ves y haces lo mismo que un super administrador{typeof soporte === "string" ? ` hasta las ${new Date(soporte).toTimeString().slice(0, 5)}` : ""}. El cliente ve tu acceso y tus cambios en su bitácora.</span>
              <button className="btn btn-sm" style={{ background: "#fff" }} onClick={() => { setFicha(null); irPlataforma(true); }}>🛰️ Volver a plataforma</button>
            </div>
          )}
          {sus && sus.estado !== "activa" && (() => {
            const pruebaVencida = sus.estado === "prueba" && sus.pruebaHasta && sus.pruebaHasta < toISO(hoy);
            const alerta = bloqueada || pruebaVencida;
            return (
              <div className="row between" style={{ padding: "8px 24px", fontSize: 12.5, background: alerta ? EST.atrasado.bg : sus.estado === "morosa" ? C.warningBg : C.infoBg, color: alerta ? "#B91C1C" : sus.estado === "morosa" ? C.warning : C.info, borderBottom: `1px solid ${C.border}`, flexWrap: "wrap" }}>
                <span>{bloqueada ? "Suscripción suspendida: puedes ver tus datos, pero no modificarlos. Para reactivarla:"
                  : sus.estado === "morosa" ? "Tu suscripción tiene un pago pendiente. Regulariza para evitar la suspensión."
                  : pruebaVencida ? `Tu período de prueba terminó el ${fmtFecha(sus.pruebaHasta)}. Elige un plan para seguir usando Qipo Arriendos sin interrupciones.`
                  : `Período de prueba hasta el ${fmtFecha(sus.pruebaHasta)} · plan ${sus.plan} (durante la prueba tienes todas las funciones).`}</span>
                {(alerta || sus.estado === "morosa") && esAdminEmp(user) && <ContactoHM motivo="mi suscripción" compacto />}
              </div>
            );
          })()}
          <div className="content"><Vista /></div>
        </div>
      </div>
      {ficha && <FichaDrawer propId={ficha.propId} unidadId={ficha.unidadId} onClose={() => setFicha(null)} />}
      {toastMsg && <div className="toast">{toastMsg}</div>}
    </Ctx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
